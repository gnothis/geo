          drawSegmentLabel(B, O, `R = ${Math.round(R)}`, '#fbbf24', -14);
          drawSegmentLabel(O, A1, `R = ${Math.round(R)}`, '#fbbf24', -14);
        }

        // Main triangle ABC
        ctx.beginPath();
        ctx.moveTo(A.x, A.y); ctx.lineTo(B.x, B.y); ctx.lineTo(C.x, C.y);
        ctx.closePath();
        ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2.8;
        ctx.stroke();

        // Signed sides and angles
        drawSegmentLabel(B, C, `a = ${Math.round(a)}`, '#f43f5e', -18);
        drawSegmentLabel(A, C, `b = ${Math.round(b)}`, '#38bdf8', -18);
        drawSegmentLabel(A, B, `c = ${Math.round(c)}`, '#34d399', 18);

        drawAngleArc(A, B, C, 30, '#f43f5e', `α=${angA.toFixed(1)}°`);
        drawAngleArc(B, C, A, 30, '#38bdf8', `β=${angB.toFixed(1)}°`);
        drawAngleArc(C, A, B, 30, '#34d399', `γ=${angC.toFixed(1)}°`);

        drawPointMarker(O, '#fbbf24', `Центр O (2R = ${Math.round(diam2R)})`, 14);
        drawDraggableHandle(A);
        drawDraggableHandle(B);
        drawDraggableHandle(C);

        // Top-left Visual Formula Verification Card
        ctx.fillStyle = 'rgba(17, 24, 39, 0.92)';
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        ctx.roundRect(16, 16, 365, 118, 12);
        ctx.fill();
        ctx.stroke();

        ctx.textAlign = 'left';
        ctx.font = 'bold 13px sans-serif';
        ctx.fillStyle = '#38bdf8';
        ctx.fillText('⭕ ТЕОРЕМА СИНУСОВ: все отношения равны 2R!', 28, 36);
        ctx.font = 'bold 12px monospace';
        ctx.fillStyle = '#fda4af';
        ctx.fillText(`• a / sin α = ${Math.round(a)} / ${Math.sin(radA).toFixed(3)} = ${(a / Math.sin(radA)).toFixed(1)}`, 28, 58);
        ctx.fillStyle = '#7dd3fc';
        ctx.fillText(`• b / sin β = ${Math.round(b)} / ${Math.sin(radB).toFixed(3)} = ${(b / Math.sin(radB)).toFixed(1)}`, 28, 78);
        ctx.fillStyle = '#6ee7b7';
        ctx.fillText(`• c / sin γ = ${Math.round(c)} / ${Math.sin(radC).toFixed(3)} = ${(c / Math.sin(radC)).toFixed(1)}`, 28, 98);
        ctx.fillStyle = '#fbbf24';
        ctx.fillText(`• Диаметр описанной окружности 2R = ${diam2R.toFixed(1)} ✨`, 28, 118);

        updateMetrics({
          'a / sin α': (a / Math.sin(radA)).toFixed(1),
          'b / sin β': (b / Math.sin(radB)).toFixed(1),
          'c / sin γ': (c / Math.sin(radC)).toFixed(1),
          'Диаметр 2R': `${diam2R.toFixed(1)} ✨`
        }, 'Теорема Синусов');
      } else {
        // LAW OF COSINES: c^2 = a^2 + b^2 - 2ab*cos(gamma)
        // Drop altitude from A to BC to show projection b*cos(gamma)
        const footA = projectPointOnLine(A, B, C);
        drawLine(C, footA, 'rgba(251, 191, 36, 0.5)', 2, true);
        drawLine(A, footA, '#fbbf24', 2.5, true);
        drawRightAngleSquare(footA, A, B, 13, '#fbbf24');

        ctx.beginPath();
        ctx.moveTo(A.x, A.y); ctx.lineTo(B.x, B.y); ctx.lineTo(C.x, C.y);
        ctx.closePath();
        ctx.fillStyle = 'rgba(52, 211, 153, 0.12)';
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 3;
        ctx.stroke();

        // Signed sides a, b, c
        drawSegmentLabel(B, C, `Сторона a = ${Math.round(a)}`, '#38bdf8', -18);
        drawSegmentLabel(A, C, `Сторона b = ${Math.round(b)}`, '#34d399', -18);
        drawSegmentLabel(A, B, `Противолежащая c = ${Math.round(c)}`, '#f43f5e', 18);
        drawSegmentLabel(C, footA, `Проекция b·cos γ = ${(b * Math.cos(radC)).toFixed(0)}`, '#fbbf24', 20);

        drawAngleArc(C, A, B, 38, '#fbbf24', `γ = ${angC.toFixed(1)}°`);

        drawDraggableHandle(A);
        drawDraggableHandle(B);
        drawDraggableHandle(C);

        const a2 = a * a, b2 = b * b, c2 = c * c;
        const corr = -2 * a * b * Math.cos(radC);

        // Top-left Visual Formula Verification Card
        ctx.fillStyle = 'rgba(17, 24, 39, 0.92)';
        ctx.strokeStyle = '#fbbf24';
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        ctx.roundRect(16, 16, 405, 128, 12);
        ctx.fill();
        ctx.stroke();

        ctx.textAlign = 'left';
        ctx.font = 'bold 13px sans-serif';
        ctx.fillStyle = '#fbbf24';
        ctx.fillText('📐 ТЕОРЕМА КОСИНУСОВ: c² = a² + b² − 2ab·cos γ', 28, 36);
        ctx.font = '12px monospace';
        ctx.fillStyle = '#e2e8f0';
        ctx.fillText(`• Сумма квадратов a² + b² = ${Math.round(a2)} + ${Math.round(b2)} = ${Math.round(a2 + b2)}`, 28, 58);
        ctx.fillStyle = corr < -10 ? '#34d399' : (corr > 10 ? '#f43f5e' : '#fbbf24');
        ctx.fillText(`• Поправка −2ab·cos(${angC.toFixed(1)}°) = ${corr >= 0 ? '+' : ''}${Math.round(corr)}`, 28, 78);
        ctx.fillStyle = '#fda4af';
        ctx.font = 'bold 12.5px monospace';
        ctx.fillText(`• Итог: c² = ${Math.round(a2 + b2)} ${corr >= 0 ? '+' : '−'} ${Math.abs(Math.round(corr))} = ${Math.round(c2)} ➔ c = ${c.toFixed(1)}`, 28, 100);
        ctx.font = '11.5px sans-serif';
        ctx.fillStyle = '#94a3b8';
        ctx.fillText(Math.abs(angC - 90) < 1.5 ? 'При γ = 90° косинус равен 0 — это чистая теорема Пифагора!' : (angC < 90 ? 'Угол γ острый (<90°) ➔ поправка вычитается (c² < a² + b²)' : 'Угол γ тупой (>90°) ➔ cos γ < 0, поправка прибавляется (c² > a² + b²)!'), 28, 124);

        updateMetrics({
          'Угол γ и cos γ': `${angC.toFixed(1)}° (cos = ${Math.cos(radC).toFixed(3)})`,
          'Пифагор a² + b²': `${Math.round(a2 + b2)}`,
          'Поправка −2ab·cos γ': `${corr >= 0 ? '+' : ''}${Math.round(corr)}`,
          'Квадрат стороны c²': `${Math.round(c2)} (c = ${c.toFixed(1)}) ✨`
        }, 'Теорема Косинусов');
      }
    }

    // ------------------------------------------
    // 6. QUADRILATERALS SCENE
    // ------------------------------------------
    function renderQuadrilateralsScene() {
      const q = state.quads;
      const cx = canvas.width / 2 - 20;
      const cy = canvas.height / 2 + 10;

      let A, B, C, D;
      let w = q.width, h = q.height, sk = q.skew;

      if (q.type === 'parallelogram') {
        A = { x: cx - w / 2 - sk / 2, y: cy + h / 2 };
        D = { x: cx + w / 2 - sk / 2, y: cy + h / 2 };
        C = { x: cx + w / 2 + sk / 2, y: cy - h / 2 };
        B = { x: cx - w / 2 + sk / 2, y: cy - h / 2 };
      } else if (q.type === 'rectangle') {
        A = { x: cx - w / 2, y: cy + h / 2 };
        D = { x: cx + w / 2, y: cy + h / 2 };
        C = { x: cx + w / 2, y: cy - h / 2 };
        B = { x: cx - w / 2, y: cy - h / 2 };
      } else if (q.type === 'rhombus') {
        A = { x: cx - w / 2, y: cy };
        C = { x: cx + w / 2, y: cy };
        B = { x: cx, y: cy - h / 2 };
        D = { x: cx, y: cy + h / 2 };
      } else if (q.type === 'square') {
        const s = Math.min(w, h);
        A = { x: cx - s / 2, y: cy + s / 2 };
        D = { x: cx + s / 2, y: cy + s / 2 };
        C = { x: cx + s / 2, y: cy - s / 2 };
        B = { x: cx - s / 2, y: cy - s / 2 };
      } else {
        const topW = w * 0.52;
        A = { x: cx - w / 2, y: cy + h / 2 };
        D = { x: cx + w / 2, y: cy + h / 2 };
        B = { x: cx - topW / 2 + sk * 0.4, y: cy - h / 2 };
        C = { x: cx + topW / 2 + sk * 0.4, y: cy - h / 2 };
      }

      if (q.showCircle) {
        if (q.type === 'rectangle' || q.type === 'square') {
          const R = dist({ x: cx, y: cy }, A);
          ctx.beginPath();
          ctx.arc(cx, cy, R, 0, 2 * Math.PI);
          ctx.strokeStyle = 'rgba(56, 189, 248, 0.55)';
          ctx.lineWidth = 2;
          ctx.stroke();
        }
        if (q.type === 'rhombus' || q.type === 'square') {
          const side = dist(A, B);
          const r = (q.type === 'rhombus') ? (w * h) / (4 * side) : Math.min(w, h) / 2;
          ctx.beginPath();
          ctx.arc(cx, cy, r, 0, 2 * Math.PI);
          ctx.strokeStyle = 'rgba(244, 63, 94, 0.65)';
          ctx.lineWidth = 2;
          ctx.stroke();
        }
      }

      ctx.beginPath();
      ctx.moveTo(A.x, A.y); ctx.lineTo(B.x, B.y); ctx.lineTo(C.x, C.y); ctx.lineTo(D.x, D.y);
      ctx.closePath();
      ctx.fillStyle = 'rgba(56, 189, 248, 0.14)';
      ctx.fill();
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 3;
      ctx.stroke();

      // Sign all 4 sides clearly
      drawSegmentLabel(A, D, `a = ${Math.round(dist(A, D))}`, '#7dd3fc', 16);
      drawSegmentLabel(B, C, `b = ${Math.round(dist(B, C))}`, '#7dd3fc', -16);
      drawSegmentLabel(A, B, `c = ${Math.round(dist(A, B))}`, '#e2e8f0', -16);
      drawSegmentLabel(D, C, `d = ${Math.round(dist(D, C))}`, '#e2e8f0', 16);

      if (q.type === 'rectangle' || q.type === 'square') {
        drawRightAngleSquare(A, B, D, 14, '#fbbf24');
        drawRightAngleSquare(B, C, A, 14, '#fbbf24');
        drawRightAngleSquare(C, D, B, 14, '#fbbf24');
        drawRightAngleSquare(D, A, C, 14, '#fbbf24');
      }

      if (q.showDiagonals) {
        drawLine(A, C, '#fbbf24', 2);
        drawLine(B, D, '#f43f5e', 2);
        if (q.type === 'rhombus' || q.type === 'square') {
          drawRightAngleSquare({ x: cx, y: cy }, A, B, 13, '#34d399');
        }
        if (q.type !== 'trapezoid') {
          drawPointMarker({ x: cx, y: cy }, '#fff', 'O (середина диагоналей)');
        }
      }

      if (q.showMidline) {
        if (q.type === 'trapezoid') {
          const M = { x: (A.x + B.x) / 2, y: (A.y + B.y) / 2 };
          const N = { x: (D.x + C.x) / 2, y: (D.y + C.y) / 2 };
          drawLine(M, N, '#34d399', 3.5);
          drawPointMarker(M, '#34d399', 'M', -8);
          drawPointMarker(N, '#34d399', 'N', -8);
          drawSegmentLabel(M, N, `Средняя линия m = (a+b)/2 = ${Math.round(dist(M, N))}`, '#6ee7b7', -14);
        }
        if (q.type === 'parallelogram' || q.type === 'trapezoid') {
          const foot = { x: B.x, y: A.y };
          drawLine(B, foot, '#34d399', 2, true);
          drawRightAngleSquare(foot, B, D, 12, '#34d399');
          drawSegmentLabel(B, foot, `h = ${q.height}`, '#34d399', -18);
        }
      }

      [
        { p: A, l: 'A', dy: 20 },
        { p: B, l: 'B', dy: -16 },
        { p: C, l: 'C', dy: -16 },
        { p: D, l: 'D', dy: 20 }
      ].forEach(it => {
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 14px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(it.l, it.p.x, it.p.y + it.dy);
      });

      const perim = dist(A,B) + dist(B,C) + dist(C,D) + dist(D,A);
      let area = w * h;
      if (q.type === 'rhombus') area = (w * h) / 2;
      if (q.type === 'square') area = Math.min(w, h) ** 2;
      if (q.type === 'trapezoid') area = ((dist(A, D) + dist(B, C)) / 2) * h;

      updateMetrics({
        'Диагональ d₁ (AC)': `${Math.round(dist(A, C))} px`,
        'Диагональ d₂ (BD)': `${Math.round(dist(B, D))} px`,
        'Периметр P': `${Math.round(perim)} px`,
        'Площадь S': `${Math.round(area / 100)} ед²`
      }, 'Свойства Четырёхугольников');
    }

    // ------------------------------------------
    // 7. AREAS & PERIMETER SCENE
    // ------------------------------------------
    function renderAreasPerimeterScene() {
      const ar = state.areas;
      const cx = canvas.width / 2;
      const cy = canvas.height / 2 + 20;
      const a = ar.baseA, h = ar.heightH, sk = ar.skewX, t = ar.cutMorph;

      if (ar.shape === 'parallelogram') {
        const x0 = cx - a / 2;
        const yBot = cy + h / 2, yTop = cy - h / 2;

        ctx.beginPath();
        ctx.moveTo(x0 + sk, yBot);
        ctx.lineTo(x0 + a, yBot);
        ctx.lineTo(x0 + a + sk, yTop);
        ctx.lineTo(x0 + sk, yTop);
        ctx.closePath();
        ctx.fillStyle = 'rgba(56, 189, 248, 0.25)';
        ctx.fill();
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 2.5;
        ctx.stroke();

        const shift = t * a;
        ctx.beginPath();
        ctx.moveTo(x0 + shift, yBot);
        ctx.lineTo(x0 + sk + shift, yBot);
        ctx.lineTo(x0 + sk + shift, yTop);
        ctx.closePath();
        ctx.fillStyle = 'rgba(244, 63, 94, 0.45)';
        ctx.fill();
        ctx.strokeStyle = '#f43f5e';
        ctx.lineWidth = 2.5;
        ctx.stroke();

        drawRightAngleSquare({ x: x0 + sk, y: yBot }, { x: x0 + sk, y: yTop }, { x: x0 + a, y: yBot }, 13, '#34d399');

        ctx.fillStyle = '#fff';
        ctx.font = 'bold 15px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(`Основание a = ${a}`, x0 + a / 2 + sk / 2, yBot + 28);
        ctx.fillStyle = '#34d399';
        ctx.fillText(`Высота h = ${h}`, x0 + sk - 42, cy);

        const sideB = Math.hypot(sk, h);
        updateMetrics({
          'Основание a': `${a}`,
          'Высота h': `${h}`,
          'Боковая сторона b': `${sideB.toFixed(1)}`,
          'Периметр P = 2(a+b)': `${Math.round(2 * (a + sideB))}`,
          'Площадь S = a · h': `${Math.round((a * h) / 100)} ед² ✨`
        }, 'Площадь Параллелограмма');
      } else if (ar.shape === 'triangle') {
        const x0 = cx - a / 2, yBot = cy + h / 2, yTop = cy - h / 2;
        const A = { x: x0, y: yBot }, B = { x: x0 + a, y: yBot }, C = { x: x0 + sk, y: yTop };

        ctx.beginPath();
        ctx.moveTo(A.x, A.y); ctx.lineTo(B.x, B.y); ctx.lineTo(C.x, C.y);
        ctx.closePath();
        ctx.fillStyle = 'rgba(56, 189, 248, 0.3)';
        ctx.fill();
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 2.5;
        ctx.stroke();

        drawLine(C, { x: C.x, y: yBot }, '#34d399', 2, true);
        drawRightAngleSquare({ x: C.x, y: yBot }, C, B, 12, '#34d399');

        if (t > 0.01) {
          const midBC = { x: (B.x + C.x) / 2, y: (B.y + C.y) / 2 };
          const ang = t * Math.PI;
          const rotPt = (P) => {
            const dx = P.x - midBC.x, dy = P.y - midBC.y;
            return { x: midBC.x + dx * Math.cos(ang) - dy * Math.sin(ang), y: midBC.y + dx * Math.sin(ang) + dy * Math.cos(ang) };
          };
          const A2 = rotPt(A), B2 = rotPt(B), C2 = rotPt(C);
          ctx.beginPath();
          ctx.moveTo(A2.x, A2.y); ctx.lineTo(B2.x, B2.y); ctx.lineTo(C2.x, C2.y);
          ctx.closePath();
          ctx.fillStyle = 'rgba(251, 191, 36, 0.32)';
          ctx.fill();
          ctx.strokeStyle = '#fbbf24';
          ctx.lineWidth = 2;
          ctx.setLineDash([5, 5]);
          ctx.stroke();
          ctx.setLineDash([]);
        }

        updateMetrics({
          'Основание a': `${a}`,
          'Высота h': `${h}`,
          'Площадь параллелограмма': `${Math.round((a * h) / 100)} ед²`,
          'Площадь треугольника ½ah': `${Math.round((a * h) / 200)} ед² ✨`
        }, 'Площадь Треугольника');
      } else if (ar.shape === 'trapezoid') {
        const b = ar.baseB;
        const x0 = cx - (a + b) / 2, yBot = cy + h / 2, yTop = cy - h / 2;
        const A = { x: x0, y: yBot }, D = { x: x0 + a, y: yBot }, B = { x: x0 + sk * 0.5, y: yTop }, C = { x: x0 + sk * 0.5 + b, y: yTop };

        ctx.beginPath();
        ctx.moveTo(A.x, A.y); ctx.lineTo(B.x, B.y); ctx.lineTo(C.x, C.y); ctx.lineTo(D.x, D.y);
        ctx.closePath();
        ctx.fillStyle = 'rgba(56, 189, 248, 0.3)';
        ctx.fill();
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 2.5;
        ctx.stroke();

        if (t > 0.01) {
          const midCD = { x: (C.x + D.x) / 2, y: (C.y + D.y) / 2 };
          const ang = t * Math.PI;
          const rotPt = (P) => {
            const dx = P.x - midCD.x, dy = P.y - midCD.y;
            return { x: midCD.x + dx * Math.cos(ang) - dy * Math.sin(ang), y: midCD.y + dx * Math.sin(ang) + dy * Math.cos(ang) };
          };
          const pts = [A, B, C, D].map(rotPt);
          ctx.beginPath();
          ctx.moveTo(pts[0].x, pts[0].y); ctx.lineTo(pts[1].x, pts[1].y); ctx.lineTo(pts[2].x, pts[2].y); ctx.lineTo(pts[3].x, pts[3].y);
          ctx.closePath();
          ctx.fillStyle = 'rgba(52, 211, 153, 0.3)';
          ctx.fill();
          ctx.strokeStyle = '#34d399';
          ctx.lineWidth = 2;
          ctx.stroke();
        }

        updateMetrics({
          'Основания a и b': `a = ${a}, b = ${b}`,
          'Средняя линия (a+b)/2': `${(a + b) / 2}`,
          'Высота h': `${h}`,
          'Площадь S = m · h': `${Math.round(((a + b) / 2 * h) / 100)} ед² ✨`
        }, 'Площадь Трапеции');
      } else {
        const d1 = a + 40, d2 = h + 30;
        if (t > 0.01) {
          ctx.save();
          ctx.globalAlpha = t;
          ctx.fillStyle = 'rgba(251, 191, 36, 0.15)';
          ctx.strokeStyle = '#fbbf24';
          ctx.lineWidth = 2;
          ctx.setLineDash([6, 6]);
          ctx.fillRect(cx - d1 / 2, cy - d2 / 2, d1, d2);
          ctx.strokeRect(cx - d1 / 2, cy - d2 / 2, d1, d2);
          ctx.restore();
        }

        ctx.beginPath();
        ctx.moveTo(cx - d1 / 2, cy);
        ctx.lineTo(cx, cy - d2 / 2);
        ctx.lineTo(cx + d1 / 2, cy);
        ctx.lineTo(cx, cy + d2 / 2);
        ctx.closePath();
        ctx.fillStyle = 'rgba(52, 211, 153, 0.32)';
        ctx.fill();
        ctx.strokeStyle = '#34d399';
        ctx.lineWidth = 3;
        ctx.stroke();

        drawLine({ x: cx - d1 / 2, y: cy }, { x: cx + d1 / 2, y: cy }, '#38bdf8', 2);
        drawLine({ x: cx, y: cy - d2 / 2 }, { x: cx, y: cy + d2 / 2 }, '#f43f5e', 2);
        drawRightAngleSquare({ x: cx, y: cy }, { x: cx + d1 / 2, y: cy }, { x: cx, y: cy - d2 / 2 }, 13, '#fff');

        updateMetrics({
          'Диагональ d₁': `${d1}`,
          'Диагональ d₂': `${d2}`,
          'Площадь коробки d₁·d₂': `${Math.round((d1 * d2) / 100)} ед²`,
          'Площадь ромба ½d₁d₂': `${Math.round((d1 * d2) / 200)} ед² ✨`
        }, 'Площадь Ромба');
      }
    }

    // ------------------------------------------
    // 8. CIRCLES & HELPER METHODS SCENE (FULLY SIGNED SIDES & EXTENDED TANGENTS!)
    // ------------------------------------------
    function renderCirclesHelperScene() {
      const cc = state.circleChord;
      const cx = canvas.width / 2 - 40;
      const cy = canvas.height / 2 + 10;
      const R = cc.radius;

      if (cc.subMode === 'tangent_anatomy') {
        const O = { x: cx - 35, y: cy };
        const M = cc.extM;

        // Ensure M is strictly outside the circle
        const dOM = dist(O, M);
        if (dOM < R + 25) {
          const ang = Math.atan2(M.y - O.y, M.x - O.x);
          M.x = O.x + (R + 25) * Math.cos(ang);
          M.y = O.y + (R + 25) * Math.sin(ang);
        }

        // Draw Main Circle
        ctx.beginPath();
        ctx.arc(O.x, O.y, R, 0, 2 * Math.PI);
        ctx.fillStyle = 'rgba(56, 189, 248, 0.06)';
        ctx.fill();
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 2.8;
        ctx.stroke();

        // 1. Chord CD (Хорда CD) on the left side of circle
        const C_pt = { x: O.x + R * Math.cos(2.15), y: O.y + R * Math.sin(2.15) };
        const D_pt = { x: O.x + R * Math.cos(3.65), y: O.y + R * Math.sin(3.65) };
        drawLine(C_pt, D_pt, '#c084fc', 3);
        drawPointMarker(C_pt, '#c084fc', 'C', -10);
        drawPointMarker(D_pt, '#c084fc', 'D', -10);
        drawSegmentLabel(C_pt, D_pt, `Хорда CD = ${Math.round(dist(C_pt, D_pt))}`, '#c084fc', -18);

        // 2. Secant line (Секущая прямая) passing through bottom of circle
        const S1 = { x: O.x + R * Math.cos(1.15), y: O.y + R * Math.sin(1.15) };
        const S2 = { x: O.x + R * Math.cos(2.0), y: O.y + R * Math.sin(2.0) };
        const sdx = S2.x - S1.x, sdy = S2.y - S1.y, slen = Math.hypot(sdx, sdy) || 1;
        const secStart = { x: S1.x - (sdx / slen) * 70, y: S1.y - (sdy / slen) * 70 };
        const secEnd = { x: S2.x + (sdx / slen) * 70, y: S2.y + (sdy / slen) * 70 };
        drawLine(secStart, secEnd, '#22d3ee', 2, true);
        drawSegmentLabel(S1, S2, 'Секущая прямая', '#22d3ee', 18);

        // 3. Exact Tangents from M to circle O!
        const distOM = dist(O, M);
        const baseAng = Math.atan2(M.y - O.y, M.x - O.x);
        const alpha = Math.acos(Math.min(1, R / distOM));

        const T1 = { x: O.x + R * Math.cos(baseAng - alpha), y: O.y + R * Math.sin(baseAng - alpha) };
        const T2 = { x: O.x + R * Math.cos(baseAng + alpha), y: O.y + R * Math.sin(baseAng + alpha) };

        // Extend tangent rays beyond T1 and T2 so they look like true infinite tangent lines!
        const extendRay = (from, to, extLen) => {
          const dx = to.x - from.x, dy = to.y - from.y, l = Math.hypot(dx, dy) || 1;
          return { x: to.x + (dx / l) * extLen, y: to.y + (dy / l) * extLen };
        };
        const T1_ext = extendRay(M, T1, 95);
        const T2_ext = extendRay(M, T2, 95);

        // Extended parts of tangent lines
        drawLine(T1, T1_ext, 'rgba(244, 63, 94, 0.55)', 2.5, true);
        drawLine(T2, T2_ext, 'rgba(244, 63, 94, 0.55)', 2.5, true);

        // Main Tangent segments MA and MB
        drawLine(M, T1, '#f43f5e', 3.5);
        drawLine(M, T2, '#f43f5e', 3.5);

        // Radii OA and OB perpendicular to tangents
        drawLine(O, T1, '#34d399', 2.8);
        drawLine(O, T2, '#34d399', 2.8);

        // Center-to-M bisector line MO
        drawLine(O, M, '#fbbf24', 2, true);

        // Right angle 90° markers at points of tangency A and B
        drawRightAngleSquare(T1, O, M, 15, '#34d399');
        drawRightAngleSquare(T2, O, M, 15, '#34d399');

        // Equal tangent tick marks
        drawTickMarks(M, T1, 2, '#fff');
        drawTickMarks(M, T2, 2, '#fff');

        // Signed lengths on every segment!
        const lenTan = Math.round(dist(M, T1));
        drawSegmentLabel(M, T1, `Касательная MA = ${lenTan}`, '#fda4af', -18);
        drawSegmentLabel(M, T2, `Касательная MB = ${lenTan}`, '#fda4af', 18);
        drawSegmentLabel(O, T1, `Радиус OA = R = ${R}`, '#6ee7b7', 16);
        drawSegmentLabel(O, T2, `Радиус OB = R = ${R}`, '#6ee7b7', -16);
        drawSegmentLabel(O, M, `Биссектриса MO = ${Math.round(distOM)}`, '#fde68a', -14);

        drawPointMarker(O, '#fff', 'Центр O', -14);
        drawPointMarker(T1, '#34d399', 'A (точка касания, 90°)', -14);
        drawPointMarker(T2, '#34d399', 'B (точка касания, 90°)', 16);
        drawDraggableHandle(M);

        updateMetrics({
          'Радиус OA = OB = R': `${R} px`,
          'Касательные MA = MB': `${lenTan} px (строго равны!)`,
          'Угол радиуса и касательной': '∠OAM = ∠OBM = 90° 📐',
          'Гипотенуза MO': `${Math.round(distOM)} px (√(R² + MA²))`
        }, 'Касательные, Хорда и Радиус');
      } else if (cc.subMode === 'inscribed_right') {
        const { angleA, angleB, angleP } = cc;
        const O = { x: cx + 20, y: cy };
        const A = { x: O.x + R * Math.cos(angleA), y: O.y + R * Math.sin(angleA) };
        const B = { x: O.x + R * Math.cos(angleB), y: O.y + R * Math.sin(angleB) };
        const P = { x: O.x + R * Math.cos(angleP), y: O.y + R * Math.sin(angleP) };

        ctx.beginPath();
        ctx.arc(O.x, O.y, R, 0, 2 * Math.PI);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
        ctx.lineWidth = 2.5;
        ctx.stroke();

        // Tangent line at point A to show tangent-chord angle!
        const tanDir = { x: -Math.sin(angleA), y: Math.cos(angleA) };
        const tanP1 = { x: A.x - tanDir.x * 95, y: A.y - tanDir.y * 95 };
        const tanP2 = { x: A.x + tanDir.x * 95, y: A.y + tanDir.y * 95 };
        drawLine(tanP1, tanP2, '#c084fc', 2.5, true);
        drawSegmentLabel(A, tanP2, 'Касательная в т. A', '#c084fc', -15);

        // Central angle AOB & Median OP
        drawLine(O, A, '#38bdf8', 2.5);
        drawLine(O, B, '#38bdf8', 2.5);
        drawLine(O, P, '#34d399', 2.5, true);

        // Inscribed triangle APB
        ctx.beginPath();
        ctx.moveTo(P.x, P.y); ctx.lineTo(A.x, A.y); ctx.lineTo(B.x, B.y);
        ctx.closePath();
        ctx.fillStyle = 'rgba(244, 63, 94, 0.16)';
        ctx.fill();
        drawLine(P, A, '#f43f5e', 2.8);
        drawLine(P, B, '#f43f5e', 2.8);
        drawLine(A, B, '#fbbf24', 3.2);

        // Sign all sides of triangle APB and radii!
        drawSegmentLabel(P, A, `Сторона AP = ${Math.round(dist(P, A))}`, '#fda4af', -16);
        drawSegmentLabel(P, B, `Сторона BP = ${Math.round(dist(P, B))}`, '#fda4af', 16);
        drawSegmentLabel(A, B, `Хорда AB = ${Math.round(dist(A, B))}`, '#fde68a', 18);
        drawSegmentLabel(O, P, `R = ${R}`, '#6ee7b7', 12);

        const diff = Math.abs(angleB - angleA);
        const centralDeg = Math.min(diff, 2 * Math.PI - diff) * 180 / Math.PI;
        const inscribedDeg = getTriangleAngles(P, A, B).angA;

        drawAngleArc(P, A, B, 30, '#f43f5e', `${inscribedDeg.toFixed(0)}°`);

        if (Math.abs(inscribedDeg - 90) < 1.5) {
          drawRightAngleSquare(P, A, B, 15, '#34d399');
          drawTickMarks(O, A, 1, '#34d399');
          drawTickMarks(O, B, 1, '#34d399');
          drawTickMarks(O, P, 1, '#34d399');
        }

        drawPointMarker(O, '#fff', 'Центр O', 14);
        drawDraggableHandle({ ...A, label: 'A', color: '#fbbf24' });
        drawDraggableHandle({ ...B, label: 'B', color: '#fbbf24' });
        drawDraggableHandle({ ...P, label: 'P (потяни!)', color: '#f43f5e' });

        updateMetrics({
          'Центральный ∠AOB': `${centralDeg.toFixed(1)}°`,
          'Вписанный ∠APB': `${inscribedDeg.toFixed(1)}° (½ ∠AOB)`,
          'Стороны AP и BP': `${Math.round(dist(P, A))} и ${Math.round(dist(P, B))}`,
          'Медиана при 90°': 'PO = OA = OB = R = ½AB ✨'
        }, 'Вписанный угол и Медиана');
      } else if (cc.subMode === 'quads_in_out') {
        // 1. LEFT: INSCRIBED QUADRILATERAL (Вписанный четырёхугольник ABCD)
        const c1 = { x: canvas.width * 0.25, y: cy + 10 };
        const r1 = 122;
        ctx.beginPath();
        ctx.arc(c1.x, c1.y, r1, 0, 2 * Math.PI);
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 2.5;
        ctx.stroke();

        const angs = [2.4, 3.85, 5.4, 0.75]; // A, B, C, D counter-clockwise/clockwise
        const pts1 = angs.map(a => ({ x: c1.x + r1 * Math.cos(a), y: c1.y + r1 * Math.sin(a) }));
        ctx.beginPath();
        pts1.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
        ctx.closePath();
        ctx.fillStyle = 'rgba(56, 189, 248, 0.16)';
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2.5;
        ctx.stroke();

        // Sign all 4 sides a, b, c, d and vertices A, B, C, D of Inscribed Quad!
        const [pA, pB, pC, pD] = pts1;
        drawSegmentLabel(pA, pB, `a = ${Math.round(dist(pA, pB))}`, '#7dd3fc', -15);
        drawSegmentLabel(pB, pC, `b = ${Math.round(dist(pB, pC))}`, '#7dd3fc', -15);
        drawSegmentLabel(pC, pD, `c = ${Math.round(dist(pC, pD))}`, '#7dd3fc', -15);
        drawSegmentLabel(pD, pA, `d = ${Math.round(dist(pD, pA))}`, '#7dd3fc', -15);

        drawAngleArc(pA, pD, pB, 24, '#f43f5e', '∠A');
        drawAngleArc(pC, pB, pD, 24, '#f43f5e', '∠C');
        drawPointMarker(pA, '#fff', 'A', 12);
        drawPointMarker(pB, '#fff', 'B', -12);
        drawPointMarker(pC, '#fff', 'C', -12);
        drawPointMarker(pD, '#fff', 'D', 12);

        ctx.fillStyle = '#fff';
        ctx.font = 'bold 13px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('1. Вписанный четырёхугольник ABCD:', c1.x, c1.y - r1 - 30);
        ctx.fillStyle = '#fda4af';
        ctx.fillText('Сумма противоположных углов: ∠A + ∠C = 180°, ∠B + ∠D = 180°', c1.x, c1.y + r1 + 32);

        // 2. RIGHT: EXACT CIRCUMSCRIBED QUADRILATERAL (Описанный четырёхугольник с касательными и подписанными сторонами!)
        const c2 = { x: canvas.width * 0.71, y: cy + 10 };
        const r2 = 98;
        ctx.beginPath();
        ctx.arc(c2.x, c2.y, r2, 0, 2 * Math.PI);
        ctx.fillStyle = 'rgba(52, 211, 153, 0.14)';
        ctx.fill();
        ctx.strokeStyle = '#34d399';
        ctx.lineWidth = 2.5;
        ctx.stroke();

        // 4 Exact angles of tangency on the circle: T1 (bottom), T2 (left), T3 (top), T4 (right)
        const phi = [1.52, 2.95, 4.65, 6.08]; // radians
        const T = phi.map(ang => ({
          x: c2.x + r2 * Math.cos(ang),
          y: c2.y + r2 * Math.sin(ang),
          ang
        }));

        // Compute the 4 exact intersection vertices of adjacent tangent lines!
        const V = [];
        for (let k = 0; k < 4; k++) {
          const a1 = phi[k];
          const a2 = k < 3 ? phi[k + 1] : phi[0] + 2 * Math.PI;
          const midA = (a1 + a2) / 2;
          const halfDiff = (a2 - a1) / 2;
          const distV = r2 / Math.cos(halfDiff);
          V.push({
            x: c2.x + distV * Math.cos(midA),
            y: c2.y + distV * Math.sin(midA)
          });
        }
        // Vertices: V[0]=A (bottom-left), V[1]=B (top-left), V[2]=C (top-right), V[3]=D (bottom-right)
        // Tangent points:
        // T[0] is on DA (bottom), T[1] is on AB (left), T[2] is on BC (top), T[3] is on CD (right)

        // Draw perpendicular radii to all 4 tangency points T1, T2, T3, T4!
        T.forEach((tPt, idx) => {
          drawLine(c2, tPt, 'rgba(52, 211, 153, 0.65)', 1.8, true);
          const nextV = V[idx];
          drawRightAngleSquare(tPt, c2, nextV, 11, '#34d399');
        });

        // Draw extended tangent lines beyond vertices so student sees they are tangent lines!
        const drawExtTangent = (vStart, vEnd) => {
          const dx = vEnd.x - vStart.x, dy = vEnd.y - vStart.y, l = Math.hypot(dx, dy) || 1;
          const p0 = { x: vStart.x - (dx / l) * 28, y: vStart.y - (dy / l) * 28 };
          const p1 = { x: vEnd.x + (dx / l) * 28, y: vEnd.y + (dy / l) * 28 };
          drawLine(p0, p1, 'rgba(255, 255, 255, 0.28)', 2, true);
        };
        drawExtTangent(V[0], V[1]);
        drawExtTangent(V[1], V[2]);
        drawExtTangent(V[2], V[3]);
        drawExtTangent(V[3], V[0]);

        // Color-code the 4 pairs of equal tangent segments from each vertex!
        // From A (V[0]): segments A-T[0] and A-T[1] (Red)
        drawLine(V[0], T[0], '#f43f5e', 4);
        drawLine(V[0], T[1], '#f43f5e', 4);
        // From B (V[1]): segments B-T[1] and B-T[2] (Blue)
        drawLine(V[1], T[1], '#38bdf8', 4);
        drawLine(V[1], T[2], '#38bdf8', 4);
        // From C (V[2]): segments C-T[2] and C-T[3] (Emerald)
        drawLine(V[2], T[2], '#34d399', 4);
        drawLine(V[2], T[3], '#34d399', 4);
        // From D (V[3]): segments D-T[3] and D-T[0] (Amber)
        drawLine(V[3], T[3], '#fbbf24', 4);
        drawLine(V[3], T[0], '#fbbf24', 4);

        // Tangency points T1..T4
        T.forEach((tPt, idx) => {
          drawPointMarker(tPt, '#34d399', `T${idx + 1}`, -10);
        });

        // Vertices A, B, C, D
        const vLabels = ['A', 'B', 'C', 'D'];
        V.forEach((vPt, idx) => {
          drawPointMarker(vPt, '#fff', vLabels[idx], idx === 0 || idx === 3 ? 14 : -14);
        });

        // Side lengths: a = AB, b = BC, c = CD, d = DA
        const sideA = Math.round(dist(V[0], V[1]));
        const sideB = Math.round(dist(V[1], V[2]));
        const sideC = Math.round(dist(V[2], V[3]));
        const sideD = Math.round(dist(V[3], V[0]));

        drawSegmentLabel(V[0], V[1], `Сторона a (AB) = ${sideA}`, '#fda4af', -22);
        drawSegmentLabel(V[1], V[2], `Сторона b (BC) = ${sideB}`, '#7dd3fc', -20);
        drawSegmentLabel(V[2], V[3], `Сторона c (CD) = ${sideC}`, '#6ee7b7', -22);
        drawSegmentLabel(V[3], V[0], `Сторона d (AD) = ${sideD}`, '#fde68a', -20);

        ctx.fillStyle = '#fff';
        ctx.font = 'bold 13px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('2. Описанный 4-угольник (все стороны — касательные в T₁..T₄):', c2.x, c2.y - r2 - 48);
        ctx.fillStyle = '#6ee7b7';
        ctx.fillText(`a + c = ${sideA} + ${sideC} = ${sideA + sideC}   |   b + d = ${sideB} + ${sideD} = ${sideB + sideD} (РАВНЫ!)`, c2.x, c2.y + r2 + 48);

        updateMetrics({
          'Стороны a и c': `a=${sideA}, c=${sideC} (a+c = ${sideA + sideC})`,
          'Стороны b и d': `b=${sideB}, d=${sideD} (b+d = ${sideB + sideD})`,
          'Закон описанного 4-уг.': 'a + c = b + d ✅',
          'Закон вписанного 4-уг.': '∠A + ∠C = 180° ✅'
        }, 'Четырёхугольники и Окружность');
      } else {
        const t = cc.unrollStep;
        const rSmall = 75;
        const startX = cx - 230;
        const yWheel = cy - 85;
        const rollDist = t * 2 * Math.PI * rSmall;
        const wheelCenter = { x: startX + rollDist, y: yWheel };
        const fullLen = 2 * Math.PI * rSmall;

        drawLine({ x: startX, y: yWheel + rSmall }, { x: startX + fullLen, y: yWheel + rSmall }, 'rgba(255,255,255,0.2)', 2, true);
        drawLine({ x: startX, y: yWheel + rSmall }, { x: startX + rollDist, y: yWheel + rSmall }, '#f43f5e', 4);

        ctx.beginPath();
        ctx.arc(wheelCenter.x, wheelCenter.y, rSmall, 0, 2 * Math.PI);
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 3;
        ctx.stroke();

        const spokeAng = Math.PI / 2 + t * 2 * Math.PI;
        drawLine(wheelCenter, { x: wheelCenter.x + rSmall * Math.cos(spokeAng), y: wheelCenter.y + rSmall * Math.sin(spokeAng) }, '#fbbf24', 2.5);

        ctx.fillStyle = '#fff';
        ctx.font = 'bold 13px sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText(`1. Прокатывание колеса (R=${rSmall}): Длина окружности C = 2πR = ${Math.round(fullLen)} px`, startX, yWheel - rSmall - 18);

        const nSectors = 16;
        const yRect = cy + 125;
        const dAng = (2 * Math.PI) / nSectors;
        const sectorWidth = (Math.PI * rSmall) / (nSectors / 2);

        for (let i = 0; i < nSectors; i++) {
          const angCircle = i * dAng;
          const isTopRow = i % 2 === 1;
          const colIdx = Math.floor(i / 2);
          const rectApexX = startX + 210 + colIdx * sectorWidth + (isTopRow ? sectorWidth / 2 : 0);
          const rectApexY = isTopRow ? (yRect + rSmall / 2) : (yRect - rSmall / 2);
          const targetRot = isTopRow ? -Math.PI / 2 : Math.PI / 2;

          const curApexX = (startX + rSmall) * (1 - t) + rectApexX * t;
          const curApexY = yRect * (1 - t) + rectApexY * t;
          const curMidAng = (angCircle + dAng / 2) * (1 - t) + targetRot * t;

          ctx.beginPath();
          ctx.moveTo(curApexX, curApexY);
          ctx.arc(curApexX, curApexY, rSmall, curMidAng - dAng / 2, curMidAng + dAng / 2);
          ctx.closePath();
          ctx.fillStyle = i % 2 === 0 ? 'rgba(52, 211, 153, 0.45)' : 'rgba(56, 189, 248, 0.45)';
          ctx.fill();
          ctx.strokeStyle = '#fff';
          ctx.lineWidth = 1;
          ctx.stroke();
        }

        ctx.fillStyle = '#6ee7b7';
        ctx.fillText(`2. 16 долек круга складываются в прямоугольник (ширина = πR, высота = R) ➔ Площадь S = πR · R = πR²!`, startX, yRect + rSmall + 28);

        updateMetrics({
          'Число π': '3.14159265...',
          'Длина окружности C': '2πR = πD',
          'Ширина из долек': '½ C = πR',
          'Площадь круга S': 'πR · R = πR² ✨'
        }, 'Длина 2πR и Площадь πR²');
      }
    }

    // ------------------------------------------
    // 9. TRIGONOMETRY & ANGLE MEMORIZATION SCENE
    // ------------------------------------------
    function renderTrigonometryScene() {
      const deg = state.trig.angleDeg;
      const rad = (deg * Math.PI) / 180;
      const sinVal = Math.sin(rad);
      const cosVal = Math.cos(rad);
      const tanVal = deg === 90 ? Infinity : Math.tan(rad);

      const cx = canvas.width * 0.34;
      const cy = canvas.height * 0.54;
      const R = 185;

      drawLine({ x: cx - R - 40, y: cy }, { x: cx + R + 50, y: cy }, 'rgba(255,255,255,0.25)', 1.5);
      drawLine({ x: cx, y: cy + R + 40 }, { x: cx, y: cy - R - 50 }, 'rgba(255,255,255,0.25)', 1.5);

      ctx.fillStyle = '#94a3b8';
      ctx.font = 'bold 12px sans-serif';
      ctx.fillText('Ось X (Косинус — прилежащий)', cx + R - 30, cy + 20);
      ctx.fillText('Ось Y (Синус — высота)', cx + 10, cy - R - 25);

      ctx.beginPath();
      ctx.arc(cx, cy, R, 0, 2 * Math.PI);
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
      ctx.lineWidth = 2;
      ctx.stroke();

      const P = { x: cx + R * cosVal, y: cy - R * sinVal };
      const Px = { x: P.x, y: cy };
      const O = { x: cx, y: cy };

      ctx.beginPath();
      ctx.moveTo(O.x, O.y); ctx.lineTo(Px.x, Px.y); ctx.lineTo(P.x, P.y);
      ctx.closePath();
      ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
      ctx.fill();

      if (deg > 2 && deg < 88) {
        drawRightAngleSquare(Px, O, P, 14, '#fff');
        drawAngleArc(O, Px, P, 42, '#fbbf24', `α = ${deg}°`);
      }

      drawLine(O, Px, '#38bdf8', 5);
      drawLine(Px, P, '#f43f5e', 5);
      drawLine(O, P, '#34d399', 3.5);

      drawPointMarker(P, '#fff', `P (cos ${deg}°, sin ${deg}°)`, -12);

      ctx.font = 'bold 14px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillStyle = '#38bdf8';
      ctx.fillText(`cos α = ${cosVal.toFixed(3)}`, (O.x + Px.x) / 2, cy + 24);
      ctx.fillStyle = '#f43f5e';
      ctx.fillText(`sin α = ${sinVal.toFixed(3)}`, Px.x + 55, (O.y + P.y) / 2);
      ctx.fillStyle = '#34d399';
      ctx.fillText('Гипотенуза c = R = 1', (O.x + P.x) / 2 - 24, (O.y + P.y) / 2 - 14);

      const rx = canvas.width * 0.73;
      const ry = canvas.height * 0.52;

      ctx.fillStyle = 'rgba(17, 24, 39, 0.85)';
      ctx.strokeStyle = '#334155';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(rx - 175, ry - 195, 350, 380, 16);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#fbbf24';
      ctx.font = 'bold 15px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('🖐️ Правило Левой Руки и Корней', rx, ry - 165);
      ctx.fillStyle = '#cbd5e1';
      ctx.font = '12px sans-serif';
      ctx.fillText('sin α = √(номер пальца от 0 до 4) / 2', rx, ry - 143);
      ctx.fillText('cos α = √(номер пальца от 4 до 0) / 2', rx, ry - 125);

      const stdAngles = [
        { deg: 0, idx: 0, sinStr: '√0/2 = 0', cosStr: '√4/2 = 1' },
        { deg: 30, idx: 1, sinStr: '√1/2 = 1/2', cosStr: '√3/2' },
        { deg: 45, idx: 2, sinStr: '√2/2', cosStr: '√2/2' },
        { deg: 60, idx: 3, sinStr: '√3/2', cosStr: '√1/2 = 1/2' },
        { deg: 90, idx: 4, sinStr: '√4/2 = 1', cosStr: '√0/2 = 0' }
      ];

      const palmOrigin = { x: rx - 115, y: ry + 135 };
      const rayLen = 195;

      stdAngles.forEach(item => {
        const aRad = (item.deg * Math.PI) / 180;
        const tip = {
          x: palmOrigin.x + rayLen * Math.cos(aRad),
          y: palmOrigin.y - rayLen * Math.sin(aRad)
        };
        const isCurrent = Math.abs(deg - item.deg) < 1;

        drawLine(palmOrigin, tip, isCurrent ? '#fbbf24' : 'rgba(148, 163, 184, 0.4)', isCurrent ? 4 : 2);
        ctx.beginPath();
        ctx.arc(tip.x, tip.y, isCurrent ? 14 : 10, 0, 2 * Math.PI);
        ctx.fillStyle = isCurrent ? '#fbbf24' : '#1e293b';
        ctx.fill();
        ctx.strokeStyle = isCurrent ? '#fff' : '#64748b';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.fillStyle = isCurrent ? '#000' : '#fff';
        ctx.font = 'bold 11px sans-serif';
        ctx.fillText(`${item.deg}°`, tip.x, tip.y + 1);

        ctx.textAlign = 'left';
        ctx.fillStyle = isCurrent ? '#fde68a' : '#94a3b8';
        ctx.font = isCurrent ? 'bold 12px monospace' : '11px monospace';
        ctx.fillText(`sin=${item.sinStr}, cos=${item.cosStr}`, tip.x + 18, tip.y + 3);
        ctx.textAlign = 'center';
      });

      const exactMatch = stdAngles.find(it => it.deg === deg);
      updateMetrics({
        'Угол α': `${deg}°`,
        'Синус (sin α = a/c)': exactMatch ? `${exactMatch.sinStr} (${sinVal.toFixed(3)})` : sinVal.toFixed(4),
        'Косинус (cos α = b/c)': exactMatch ? `${exactMatch.cosStr} (${cosVal.toFixed(3)})` : cosVal.toFixed(4),
        'Тангенс (tg α = a/b)': deg === 90 ? 'Не определён (∞)' : tanVal.toFixed(4),
        'Тождество sin²+cos²': `${(sinVal*sinVal + cosVal*cosVal).toFixed(2)} = 1 ✨`
      }, 'Тригонометрия');
    }

    // ==========================================
    // 3D ENGINE (PROJECTION & SCENES)
    // ==========================================
    function project3D(v, width, height) {
      const cosX = Math.cos(state.camera.rotX), sinX = Math.sin(state.camera.rotX);
      const cosY = Math.cos(state.camera.rotY), sinY = Math.sin(state.camera.rotY);

      let x1 = v.x * cosY + v.z * sinY;
      let y1 = v.y;
      let z1 = -v.x * sinY + v.z * cosY;

      let x2 = x1;
      let y2 = y1 * cosX - z1 * sinX;
      let z2 = y1 * sinX + z1 * cosX;

      const cameraDist = 4.2 / state.camera.zoom;
      const fov = 650;
      const sz = z2 + cameraDist;
      const scale = sz > 0.1 ? fov / sz : 1;

      return {
        x: width / 2 + x2 * scale,
        y: height / 2 - y2 * scale,
        depth: z2
      };
    }

    function get3DGeometry(shape) {
      if (shape === 'cube') {
        const s = 1.0;
        const vertices = [
          { x: -s, y: -s, z: -s }, { x: s, y: -s, z: -s }, { x: s, y: s, z: -s }, { x: -s, y: s, z: -s },
          { x: -s, y: -s, z: s },  { x: s, y: -s, z: s },  { x: s, y: s, z: s },  { x: -s, y: s, z: s }
        ];
        const faces = [
          [0, 1, 2, 3], [4, 5, 6, 7], [0, 4, 7, 3],
          [1, 5, 6, 2], [3, 2, 6, 7], [0, 1, 5, 4]
        ];
        const colors = ['#f43f5e', '#38bdf8', '#34d399', '#fbbf24', '#818cf8', '#22d3ee'];
        return { vertices, faces, colors, V: 8, E: 12, F: 6, name: 'Куб (Гексаэдр)' };
      } else if (shape === 'tetrahedron') {
        const a = 1.35;
        const vertices = [
          { x: a, y: a, z: a }, { x: -a, y: -a, z: a },
          { x: -a, y: a, z: -a }, { x: a, y: -a, z: -a }
        ];
        const faces = [[0, 1, 2], [0, 1, 3], [0, 2, 3], [1, 2, 3]];
        const colors = ['#f43f5e', '#38bdf8', '#34d399', '#fbbf24'];
        return { vertices, faces, colors, V: 4, E: 6, F: 4, name: 'Правильный Тетраэдр' };
      } else if (shape === 'octahedron') {
        const s = 1.45;
        const vertices = [
          { x: s, y: 0, z: 0 }, { x: -s, y: 0, z: 0 },
          { x: 0, y: s, z: 0 }, { x: 0, y: -s, z: 0 },
          { x: 0, y: 0, z: s }, { x: 0, y: 0, z: -s }
        ];
        const faces = [
          [0, 2, 4], [2, 1, 4], [1, 3, 4], [3, 0, 4],
          [0, 2, 5], [2, 1, 5], [1, 3, 5], [3, 0, 5]
        ];
        const colors = ['#f43f5e', '#38bdf8', '#34d399', '#fbbf24', '#818cf8', '#ec4899', '#22d3ee', '#a855f7'];
        return { vertices, faces, colors, V: 6, E: 12, F: 8, name: 'Октаэдр' };
      } else if (shape === 'dodecahedron') {
        const phi = (1 + Math.sqrt(5)) / 2, invPhi = 1 / phi, s = 0.75;
        const vertices = [];
        for (let x of [-1, 1]) for (let y of [-1, 1]) for (let z of [-1, 1]) vertices.push({ x: x*s, y: y*s, z: z*s });
        for (let y of [-invPhi, invPhi]) for (let z of [-phi, phi]) vertices.push({ x: 0, y: y*s, z: z*s });
        for (let x of [-invPhi, invPhi]) for (let y of [-phi, phi]) vertices.push({ x: x*s, y: y*s, z: 0 });
        for (let x of [-phi, phi]) for (let z of [-invPhi, invPhi]) vertices.push({ x: x*s, y: 0, z: z*s });
        const faces = [
          [14, 12, 0, 8, 4], [5, 9, 1, 12, 14], [6, 10, 2, 13, 15], [15, 13, 3, 11, 7],
          [10, 8, 0, 16, 2], [3, 17, 1, 9, 11], [6, 18, 4, 8, 10], [11, 9, 5, 19, 7],
          [17, 16, 0, 12, 1], [3, 13, 2, 16, 17], [5, 14, 4, 18, 19], [19, 18, 6, 15, 7]
        ];
        const colors = ['#f43f5e', '#38bdf8', '#34d399', '#fbbf24', '#818cf8', '#22d3ee', '#ec4899', '#a855f7', '#10b981', '#f59e0b', '#6366f1', '#06b6d4'];
        return { vertices, faces, colors, V: 20, E: 30, F: 12, name: 'Додекаэдр (12 пятиугольников)' };
      } else if (shape === 'icosahedron') {
        const phi = (1 + Math.sqrt(5)) / 2;
        const s = 0.78;
        const vertices = [];
        for (let y of [-1, 1]) for (let z of [-phi, phi]) vertices.push({ x: 0, y: y * s, z: z * s });
        for (let x of [-1, 1]) for (let y of [-phi, phi]) vertices.push({ x: x * s, y: y * s, z: 0 });
        for (let x of [-phi, phi]) for (let z of [-1, 1]) vertices.push({ x: x * s, y: 0, z: z * s });
        const faces = [
          [0, 2, 8], [0, 2, 10], [0, 4, 6], [0, 4, 8], [0, 6, 10],
          [1, 3, 9], [1, 3, 11], [1, 4, 6], [1, 4, 9], [1, 6, 11],
          [2, 5, 7], [2, 5, 8], [2, 7, 10], [3, 5, 7], [3, 5, 9],
          [3, 7, 11], [4, 8, 9], [5, 8, 9], [6, 10, 11], [7, 10, 11]
        ];
        const colors = ['#38bdf8', '#06b6d4', '#34d399', '#818cf8', '#f43f5e', '#fbbf24', '#a855f7', '#ec4899'];
        return { vertices, faces, colors, V: 12, E: 30, F: 20, name: 'Икосаэдр (20 треугольников)' };
      } else if (shape === 'cylinder') {
        const n = 16, r = 1.0, h = 1.3, vertices = [];
        for (let i = 0; i < n; i++) {
          const th = (2 * Math.PI * i) / n;
          vertices.push({ x: r * Math.cos(th), y: h, z: r * Math.sin(th) });
          vertices.push({ x: r * Math.cos(th), y: -h, z: r * Math.sin(th) });
        }
        const faces = [];
        for (let i = 0; i < n; i++) {
          const nx = (i + 1) % n;
          faces.push([i * 2, nx * 2, nx * 2 + 1, i * 2 + 1]);
        }
        const colors = faces.map((_, idx) => idx % 2 === 0 ? '#38bdf8' : '#818cf8');
        return { vertices, faces, colors, V: n * 2, E: n * 3, F: n + 2, name: 'Цилиндр' };
      } else if (shape === 'cone') {
        const n = 16, r = 1.1, h = 1.4, vertices = [{ x: 0, y: h, z: 0 }];
        for (let i = 0; i < n; i++) {
          const th = (2 * Math.PI * i) / n;
          vertices.push({ x: r * Math.cos(th), y: -h, z: r * Math.sin(th) });
        }
        const faces = [];
        for (let i = 0; i < n; i++) faces.push([0, 1 + i, 1 + ((i + 1) % n)]);
        const colors = faces.map((_, idx) => idx % 2 === 0 ? '#fbbf24' : '#f59e0b');
        return { vertices, faces, colors, V: n + 1, E: n * 2, F: n + 1, name: 'Конус' };
      } else {
        const rings = 10, sectors = 14, r = 1.2, vertices = [];
        for (let i = 0; i <= rings; i++) {
          const phi = (Math.PI * i) / rings;
          for (let j = 0; j < sectors; j++) {
            const th = (2 * Math.PI * j) / sectors;
            vertices.push({ x: r * Math.sin(phi) * Math.cos(th), y: r * Math.cos(phi), z: r * Math.sin(phi) * Math.sin(th) });
          }
        }
        const faces = [];
        for (let i = 0; i < rings; i++) {
          for (let j = 0; j < sectors; j++) {
            faces.push([i * sectors + j, i * sectors + ((j + 1) % sectors), (i + 1) * sectors + ((j + 1) % sectors), (i + 1) * sectors + j]);
          }
        }
        const colors = faces.map((_, idx) => idx % 2 === 0 ? '#34d399' : '#059669');
        return { vertices, faces, colors, V: rings * sectors, E: rings * sectors * 2, F: rings * sectors, name: 'Сфера' };
      }
    }

    function render3D() {
      drawSubtleGrid();
      if (state.camera.autoRotate) state.camera.rotY += 0.005;
      if (state.mode3d === 'platonic_solids') renderPlatonicSolids3D();
      else if (state.mode3d === 'gallery' || state.mode3d === 'euler_poly') renderStandard3DPoly(state.currentShape3d);
      else if (state.mode3d === 'revolve') renderRevolve3D();
      else if (state.mode3d === 'sections') renderSectionPlane3D();
      else if (state.mode3d === 'unfolding') renderUnfolding3D();
      else if (state.mode3d === 'circles_angles_3d') renderCirclesAngles3D();
    }

    function renderCirclesAngles3D() {
      const c3 = state.circle3d;
      const R = 1.45;
      const w = canvas.width, h = canvas.height;

      // Optional 3D wireframe sphere (meridians & parallels) around the equatorial circle
      if (c3.showSphere) {
        const nLat = 6, nLon = 12, segs = 36;
        // Latitude rings
        for (let i = 1; i < nLat; i++) {
          const phi = (Math.PI * i) / nLat;
          if (Math.abs(phi - Math.PI / 2) < 0.05) continue; // skip equator (drawn bold below)
          ctx.beginPath();
          for (let j = 0; j <= segs; j++) {
            const th = (2 * Math.PI * j) / segs;
            const p = project3D({ x: R * Math.sin(phi) * Math.cos(th), y: R * Math.cos(phi), z: R * Math.sin(phi) * Math.sin(th) }, w, h);
            if (j === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
          }
          ctx.strokeStyle = 'rgba(148, 163, 184, 0.14)';
          ctx.lineWidth = 1;
          ctx.stroke();
        }
        // Longitude meridians
        for (let j = 0; j < nLon; j++) {
          const th = (Math.PI * j) / nLon;
          ctx.beginPath();
          for (let i = 0; i <= segs; i++) {
            const phi = (2 * Math.PI * i) / segs;
            const p = project3D({ x: R * Math.sin(phi) * Math.cos(th), y: R * Math.cos(phi), z: R * Math.sin(phi) * Math.sin(th) }, w, h);
            if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
          }
          ctx.strokeStyle = 'rgba(148, 163, 184, 0.14)';
          ctx.lineWidth = 1;
          ctx.stroke();
        }
      }

      // Main 3D Circle in horizontal XZ plane (y = 0)
      const nCircle = 72;
      ctx.beginPath();
      for (let i = 0; i <= nCircle; i++) {
        const th = (2 * Math.PI * i) / nCircle;
        const p = project3D({ x: R * Math.cos(th), y: 0, z: R * Math.sin(th) }, w, h);
        if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
      }
      ctx.fillStyle = 'rgba(56, 189, 248, 0.08)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
      ctx.lineWidth = 2.8;
      ctx.stroke();

      // Angles for A, B, and P on the 3D circle
      const halfArc = ((c3.centralDeg / 2) * Math.PI) / 180;
      const angA = -halfArc;
      const angB = halfArc;

      // Ensure P is outside the minor arc [-halfArc, +halfArc]
      let pDeg = c3.pointPDeg;
      if (pDeg < c3.centralDeg / 2 + 12) pDeg = c3.centralDeg / 2 + 12;
      if (pDeg > 360 - c3.centralDeg / 2 - 12) pDeg = 360 - c3.centralDeg / 2 - 12;
      const angP = (pDeg * Math.PI) / 180;

      const O3 = { x: 0, y: 0, z: 0 };
      const A3 = { x: R * Math.cos(angA), y: 0, z: R * Math.sin(angA) };
      const B3 = { x: R * Math.cos(angB), y: 0, z: R * Math.sin(angB) };
      const P3 = { x: R * Math.cos(angP), y: 0, z: R * Math.sin(angP) };

      const O = project3D(O3, w, h);
      const A = project3D(A3, w, h);
      const B = project3D(B3, w, h);
      const P = project3D(P3, w, h);

      // Highlighted 3D Arc AB (Дуга AB)
      ctx.beginPath();
      const arcSteps = 32;
      for (let i = 0; i <= arcSteps; i++) {
        const th = angA + ((angB - angA) * i) / arcSteps;
        const p = project3D({ x: R * Math.cos(th), y: 0, z: R * Math.sin(th) }, w, h);
        if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
      }
      ctx.strokeStyle = '#fbbf24';
      ctx.lineWidth = 5;
      ctx.stroke();

      if (state.uiLayers.showAngleVals) {
        const midArcPt = project3D({ x: R * 1.18, y: 0, z: 0 }, w, h);
        ctx.fillStyle = '#fbbf24';
        ctx.font = 'bold 13px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(`◡AB = ${c3.centralDeg}°`, midArcPt.x, midArcPt.y);
      }

      const insDeg = c3.centralDeg / 2;

      // 1. Draw 3D Central Angle Sector A-O-B (Blue)
      if (c3.showCentralAngle) {
        if (state.uiLayers.showFaces3D) {
          ctx.beginPath();
          ctx.moveTo(O.x, O.y);
          for (let i = 0; i <= 24; i++) {
            const th = angA + ((angB - angA) * i) / 24;
            const p = project3D({ x: R * 0.35 * Math.cos(th), y: 0, z: R * 0.35 * Math.sin(th) }, w, h);
            ctx.lineTo(p.x, p.y);
          }
          ctx.closePath();
          ctx.fillStyle = 'rgba(56, 189, 248, 0.38)';
          ctx.fill();
          ctx.strokeStyle = '#38bdf8';
          ctx.lineWidth = 2;
          ctx.stroke();
        }
        if (state.uiLayers.showEdges3D) {
          drawLine(O, A, '#38bdf8', 3.2);
          drawLine(O, B, '#38bdf8', 3.2);
        }
        if (c3.showChordLabels) {
          drawSegmentLabel(O, A, 'R', '#7dd3fc', -13);
          drawSegmentLabel(O, B, 'R', '#7dd3fc', 13);
        }
      }

      if (state.uiLayers.showEdges3D) {
        drawLine(A, B, 'rgba(251, 191, 36, 0.65)', 2.2, true);
      }
      if (c3.showChordLabels) {
        drawSegmentLabel(A, B, c3.centralDeg === 180 ? 'Диаметр AB' : 'Хорда AB', '#fde68a', 15);
      }

      // 2. Draw 3D Inscribed Angle Sector at P (Rose)
      if (c3.showInscribedAngle) {
        const uPA = { x: A3.x - P3.x, y: 0, z: A3.z - P3.z };
        const uPB = { x: B3.x - P3.x, y: 0, z: B3.z - P3.z };
        const lenPA = Math.hypot(uPA.x, uPA.z) || 1;
        const lenPB = Math.hypot(uPB.x, uPB.z) || 1;
        uPA.x /= lenPA; uPA.z /= lenPA;
        uPB.x /= lenPB; uPB.z /= lenPB;

        if (state.uiLayers.showFaces3D) {
          ctx.beginPath();
          ctx.moveTo(P.x, P.y);
          for (let i = 0; i <= 20; i++) {
            const f = i / 20;
            let dx = uPA.x * (1 - f) + uPB.x * f;
            let dz = uPA.z * (1 - f) + uPB.z * f;
            const dl = Math.hypot(dx, dz) || 1;
            dx = (dx / dl) * (R * 0.38);
            dz = (dz / dl) * (R * 0.38);
            const p = project3D({ x: P3.x + dx, y: 0, z: P3.z + dz }, w, h);
            ctx.lineTo(p.x, p.y);
          }
          ctx.closePath();
          ctx.fillStyle = 'rgba(244, 63, 94, 0.42)';
          ctx.fill();
          ctx.strokeStyle = '#f43f5e';
          ctx.lineWidth = 2;
          ctx.stroke();
        }

        if (state.uiLayers.showEdges3D) {
          drawLine(P, A, '#f43f5e', 3.2);
          drawLine(P, B, '#f43f5e', 3.2);
        }
        if (c3.showChordLabels) {
          drawSegmentLabel(P, A, 'PA', '#fda4af', -13);
          drawSegmentLabel(P, B, 'PB', '#fda4af', 13);
        }
      }

      // Optional extra inscribed angles P1 and P2
      if (c3.showMultiP) {
        const angP2 = ((pDeg > 180 ? pDeg - 65 : pDeg + 65) * Math.PI) / 180;
        const P2_3 = { x: R * Math.cos(angP2), y: 0, z: R * Math.sin(angP2) };
        const P2 = project3D(P2_3, w, h);
        drawLine(P2, A, '#34d399', 2.2, true);
        drawLine(P2, B, '#34d399', 2.2, true);
        drawPointMarker(P2, '#34d399', state.uiLayers.showAngleVals ? `P₁ (${insDeg.toFixed(1)}°)` : 'P₁', -12);

        if (c3.centralDeg === 180 && c3.showSphere) {
          const PTop3 = { x: 0, y: R, z: 0 };
          const PTop = project3D(PTop3, w, h);
          drawLine(PTop, A, '#c084fc', 2.5, true);
          drawLine(PTop, B, '#c084fc', 2.5, true);
          drawPointMarker(PTop, '#c084fc', state.uiLayers.showAngleVals ? 'P₂ (90°)' : 'P₂', -14);
        }
      }

      if (c3.showCentralAngle) {
        drawPointMarker(O, '#38bdf8', state.uiLayers.showAngleVals ? `O (∠AOB = ${c3.centralDeg}°)` : 'O', -16);
      }
      drawPointMarker(A, '#fbbf24', 'A', 12);
      drawPointMarker(B, '#fbbf24', 'B', 12);
      if (c3.showInscribedAngle) {
        drawPointMarker(P, '#f43f5e', state.uiLayers.showAngleVals ? `P (∠APB = ${insDeg.toFixed(1)}°)` : 'P', 16);
      }

      if (state.uiLayers.showCanvasCard) {
        ctx.fillStyle = 'rgba(17, 24, 39, 0.92)';
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        ctx.roundRect(16, 54, 385, 108, 12);
        ctx.fill();
        ctx.stroke();

        ctx.textAlign = 'left';
        ctx.font = 'bold 13px sans-serif';
        ctx.fillStyle = '#38bdf8';
        ctx.fillText('⭕ ВПИСАННЫЙ И ЦЕНТРАЛЬНЫЙ УГОЛ В 3D', 28, 74);
        ctx.font = '12px sans-serif';
        ctx.fillStyle = '#7dd3fc';
        ctx.fillText(`• Центральный угол ∠AOB (из центра O) = ${c3.centralDeg}°`, 28, 96);
        ctx.fillStyle = '#fda4af';
        ctx.fillText(`• Вписанный угол ∠APB (с окружности) = ½ · ${c3.centralDeg}° = ${insDeg.toFixed(1)}°`, 28, 116);
        ctx.fillStyle = '#6ee7b7';
        ctx.fillText(c3.centralDeg === 180 ? '• Хорда AB — диаметр (180°) ➔ вписанный угол СТРОГО 90°!' : '• Покрути 3D-сцену мышкой и подвигай точку P ползунком!', 28, 138);
      }

      updateMetrics({
        'Дуга ◡AB': `${c3.centralDeg}°`,
        'Центральный ∠AOB': `${c3.centralDeg}° (равен дуге)`,
        'Вписанный ∠APB': `${insDeg.toFixed(1)}° (½ дуги) ✨`,
        'Отношение ∠AOB / ∠APB': 'Строго 2 : 1'
      }, 'Углы в 3D-окружности');
    }

    function renderPlatonicSolids3D() {

          { key: 'icosahedron', label: '5. Икосаэдр (20)', sub: '💧 Вода (5×60°=300°)', ox: 155, oy: 135, scale: 0.45 }

            return { x: cx + (p.x - canvas.width / 2), y: cy + (p.y - canvas.height / 2), depth: p.depth };
          });

          const faceList = geom.faces.map((f, idx) => {
            let avgZ = 0;
            f.forEach(vIdx => avgZ += proj[vIdx].depth);

          });
          faceList.sort((a, b) => a.depth - b.depth);

          faceList.forEach(item => {
            ctx.beginPath();
            item.face.forEach((vIdx, i) => {
              const p = proj[vIdx];
              if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
            });
            ctx.closePath();
            ctx.fillStyle = item.color;
            ctx.globalAlpha = 0.42;
            ctx.fill();
            ctx.globalAlpha = 1.0;
            ctx.strokeStyle = 'rgba(255,255,255,0.55)';
            ctx.lineWidth = 1.3;

          });

          ctx.fillStyle = '#fff';
          ctx.font = 'bold 13px sans-serif';

        updateMetrics({
          'Всего тел во Вселенной': 'Строго 5 ✨',

          'Стихии Платона': 'Огонь, Земля, Воздух, Вода, Эфир',
          'Формула Эйлера V-E+F': 'Везде = 2!'
        }, 'Парад 5 Платоновых Тел');

      }

      // Single selected Platonic solid + optional Dual solid inside (connecting face centers!)
      renderStandard3DPoly(pl.selected);

      if (pl.showDual) {

        });

        const projC = centroids.map(c => project3D(c, canvas.width, canvas.height));

        // Two faces share an edge in the outer solid iff their centroids are connected in the dual solid!
        for (let i = 0; i < geom.faces.length; i++) {
          for (let j = i + 1; j < geom.faces.length; j++) {
            const f1 = geom.faces[i], f2 = geom.faces[j];
            let shared = 0;
            f1.forEach(v => { if (f2.includes(v)) shared++; });
            if (shared === 2) {
              drawLine(projC[i], projC[j], '#fbbf24', 2.6);

        projC.forEach(p => {
          ctx.beginPath();
          ctx.arc(p.x, p.y, 4.5, 0, 2 * Math.PI);
          ctx.fillStyle = '#fbbf24';
          ctx.fill();
        });

      // Top-left Visual Legend Card for Platonic Solid on Canvas
      const metaMap = {
        tetrahedron: { el: '🔥 Стихия Платона: ОГОНЬ', angle: 'В вершине: 3 треугольника × 60° = 180° (< 360°)', dual: 'Двойственное внутри: Тетраэдр (4 грани ➔ 4 вершины)' },
        cube:        { el: '🌍 Стихия Платона: ЗЕМЛЯ', angle: 'В вершине: 3 квадрата × 90° = 270° (< 360°)', dual: 'Двойственное внутри (жёлтое): Октаэдр (6 граней ➔ 6 вершин)' },
        octahedron:  { el: '💨 Стихия Платона: ВОЗДУХ', angle: 'В вершине: 4 треугольника × 60° = 240° (< 360°)', dual: 'Двойственное внутри (жёлтое): Куб (8 граней ➔ 8 вершин)' },
        dodecahedron:{ el: '🌌 Стихия Платона: КОСМОС (Вселенная)', angle: 'В вершине: 3 пятиугольника × 108° = 324° (< 360°)', dual: 'Двойственное внутри (жёлтое): Икосаэдр (12 граней ➔ 12 вершин)' },
        icosahedron: { el: '💧 Стихия Платона: ВОДА', angle: 'В вершине: 5 треугольников × 60° = 300° (< 360°)', dual: 'Двойственное внутри (жёлтое): Додекаэдр (20 граней ➔ 20 вершин)' }
      };
      const mInfo = metaMap[pl.selected];
      if (mInfo && state.uiLayers.showCanvasCard) {
        ctx.fillStyle = 'rgba(17, 24, 39, 0.92)';
        ctx.strokeStyle = '#fbbf24';
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        ctx.roundRect(16, 16, 415, 110, 12);
        ctx.fill();
        ctx.stroke();

        ctx.textAlign = 'left';
        ctx.font = 'bold 13px sans-serif';
        ctx.fillStyle = '#fbbf24';
        ctx.fillText(`🏛️ ПЛАТОНОВО ТЕЛО: ${geom.name.toUpperCase()}`, 28, 36);
        ctx.font = '12px sans-serif';
        ctx.fillStyle = '#fde68a';
        ctx.fillText(`• ${mInfo.el}`, 28, 58);
        ctx.fillStyle = '#7dd3fc';
        ctx.fillText(`• Откуда берётся: ${mInfo.angle}`, 28, 78);
        ctx.fillStyle = '#6ee7b7';
        ctx.fillText(`• ${mInfo.dual}`, 28, 98);
      }
    }

    function renderStandard3DPoly(shapeName) {
      const geom = get3DGeometry(shapeName);
      const proj = geom.vertices.map(v => project3D(v, canvas.width, canvas.height));

      const faceList = geom.faces.map((f, idx) => {
        let avgZ = 0;
        f.forEach(vIdx => avgZ += proj[vIdx].depth);
        return { face: f, depth: avgZ / f.length, color: geom.colors[idx % geom.colors.length] };
      });
      faceList.sort((a, b) => a.depth - b.depth);

      if (state.renderStyle3d !== 'wireframe' && state.uiLayers.showFaces3D) {
        faceList.forEach(item => {
          ctx.beginPath();
          item.face.forEach((vIdx, i) => {
            const p = proj[vIdx];
            if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
          });
          ctx.closePath();
          ctx.fillStyle = item.color;
          ctx.globalAlpha = state.renderStyle3d === 'solid_translucent' ? 0.35 : 0.85;
          ctx.fill();
          ctx.globalAlpha = 1.0;
          if (state.uiLayers.showEdges3D) {
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
            ctx.lineWidth = 1.5;
            ctx.stroke();
          }
        });
      } else if (state.uiLayers.showEdges3D) {
        geom.faces.forEach(face => {
          ctx.beginPath();
          face.forEach((vIdx, i) => {
            const p = proj[vIdx];
            if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
          });
          ctx.closePath();
          ctx.strokeStyle = '#38bdf8';
          ctx.lineWidth = 2;
          ctx.stroke();
        });
      }

      if (state.uiLayers.showVertices3D) {
        proj.forEach(p => {
          ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, 2 * Math.PI);
          ctx.fillStyle = '#fff'; ctx.fill();
        });
      }

      updateMetrics({
        'Фигура': geom.name,
        'Вершины (V)': geom.V,
        'Рёбра (E)': geom.E,
        'Грани (F)': geom.F,
        'Эйлер V - E + F': `${geom.V - geom.E + geom.F} ✨`
      }, 'Стереометрия 3D');
    }

    function renderRevolve3D() {
      const maxAngle = (state.revolveAngle * Math.PI) / 180;
      const steps = Math.max(4, Math.floor((state.revolveAngle / 360) * 24));
      const height = 1.3, radius = 1.1;

      const topAxis = project3D({ x: 0, y: height * 1.4, z: 0 }, canvas.width, canvas.height);
      const botAxis = project3D({ x: 0, y: -height * 1.4, z: 0 }, canvas.width, canvas.height);
      drawLine(topAxis, botAxis, '#f43f5e', 2.5, true);

      let profile2D = [];
      if (state.revolveShape === 'triangle') {
        profile2D = [{ x: 0, y: height }, { x: radius, y: -height }, { x: 0, y: -height }];
      } else if (state.revolveShape === 'rectangle') {
        profile2D = [{ x: 0, y: height }, { x: radius, y: height }, { x: radius, y: -height }, { x: 0, y: -height }];
      } else {
        for (let a = -Math.PI / 2; a <= Math.PI / 2; a += Math.PI / 8) {
          profile2D.push({ x: radius * Math.cos(a), y: radius * Math.sin(a) });
        }
      }

      for (let s = 0; s < steps; s++) {
        const th1 = (s / steps) * maxAngle;
        const th2 = ((s + 1) / steps) * maxAngle;
        for (let i = 0; i < profile2D.length - 1; i++) {
          const ptA = profile2D[i], ptB = profile2D[i + 1];
          const p1 = project3D({ x: ptA.x * Math.cos(th1), y: ptA.y, z: ptA.x * Math.sin(th1) }, canvas.width, canvas.height);
          const p2 = project3D({ x: ptA.x * Math.cos(th2), y: ptA.y, z: ptA.x * Math.sin(th2) }, canvas.width, canvas.height);
          const p3 = project3D({ x: ptB.x * Math.cos(th2), y: ptB.y, z: ptB.x * Math.sin(th2) }, canvas.width, canvas.height);
          const p4 = project3D({ x: ptB.x * Math.cos(th1), y: ptB.y, z: ptB.x * Math.sin(th1) }, canvas.width, canvas.height);

          ctx.beginPath();
          ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.lineTo(p3.x, p3.y); ctx.lineTo(p4.x, p4.y);
          ctx.closePath();
          ctx.fillStyle = s % 2 === 0 ? 'rgba(56, 189, 248, 0.35)' : 'rgba(99, 102, 241, 0.35)';
          ctx.fill();
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
          ctx.stroke();
        }
      }

      ctx.beginPath();
      profile2D.forEach((pt, i) => {
        const p = project3D({ x: pt.x * Math.cos(maxAngle), y: pt.y, z: pt.x * Math.sin(maxAngle) }, canvas.width, canvas.height);
        if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
      });
      ctx.closePath();
      ctx.fillStyle = 'rgba(251, 191, 36, 0.7)';
      ctx.fill();
      ctx.strokeStyle = '#fbbf24';
      ctx.lineWidth = 2.5;
      ctx.stroke();

      updateMetrics({
        'Тело вращения': state.revolveShape === 'triangle' ? 'Конус' : (state.revolveShape === 'rectangle' ? 'Цилиндр' : 'Шар'),
        'Угол поворота': `${state.revolveAngle}°`,
        'Ось вращения': 'Красная ось Y',
        'Формула объёма': state.revolveShape === 'triangle' ? 'V = ⅓ πR²H' : (state.revolveShape === 'rectangle' ? 'V = πR²H' : 'V = 4/3 πR³')
      }, 'Тела Вращения');
    }

    function renderSectionPlane3D() {
      const shapeKey = (state.domain === 'quests' && state.questId === 'quest_cube_hex')
        ? 'cube'
        : (state.currentShape3d === 'sphere' ? 'cube' : state.currentShape3d);
      const geom = get3DGeometry(shapeKey);
      const vertices = geom.vertices;

      // Extract unique edges from geom.faces
      const edgeSet = new Set();
      const edges = [];
      geom.faces.forEach(face => {
        for (let k = 0; k < face.length; k++) {
          const a = face[k], b = face[(k + 1) % face.length];
          const key = a < b ? `${a}_${b}` : `${b}_${a}`;
          if (!edgeSet.has(key)) {
            edgeSet.add(key);
            edges.push([a, b]);
          }
        }
      });

      const proj = vertices.map(v => project3D(v, canvas.width, canvas.height));

      // Draw translucent faces of the 3D figure for volume context
      geom.faces.forEach((face, idx) => {
        ctx.beginPath();
        face.forEach((vIdx, i) => {
          const p = proj[vIdx];
          if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
        });
        ctx.closePath();
        ctx.fillStyle = geom.colors[idx % geom.colors.length];
        ctx.globalAlpha = 0.12;
        ctx.fill();
        ctx.globalAlpha = 1.0;
      });

      edges.forEach(([i, j]) => drawLine(proj[i], proj[j], 'rgba(255, 255, 255, 0.42)', 1.6));

      // Plane normal (nx, ny, nz) normalized
      const pitch = state.sectionPlane.pitch, D = state.sectionPlane.height;
      const rawNx = Math.sin(pitch), rawNy = 1.0, rawNz = 0.75 * Math.sin(pitch);
      const nLen = Math.hypot(rawNx, rawNy, rawNz) || 1;
      const nx = rawNx / nLen, ny = rawNy / nLen, nz = rawNz / nLen;

      const rawCutPoints = [];
      edges.forEach(([i, j]) => {
        const v1 = vertices[i], v2 = vertices[j];
        const val1 = nx * v1.x + ny * v1.y + nz * v1.z - D;
        const val2 = nx * v2.x + ny * v2.y + nz * v2.z - D;
        if (val1 * val2 <= 0 && Math.abs(val1 - val2) > 1e-5) {
          const t = val1 / (val1 - val2);
          if (t >= -1e-4 && t <= 1.0001) {
            rawCutPoints.push({
              x: v1.x + t * (v2.x - v1.x),
              y: v1.y + t * (v2.y - v1.y),
              z: v1.z + t * (v2.z - v1.z)
            });
          }
        }
      });

      // Deduplicate intersection points (when plane passes through a vertex)
      const cutPoints = [];
      rawCutPoints.forEach(pt => {
        if (!cutPoints.some(q => Math.hypot(pt.x - q.x, pt.y - q.y, pt.z - q.z) < 0.03)) {
          cutPoints.push(pt);
        }
      });

      if (cutPoints.length >= 3) {
        let cx3 = 0, cy3 = 0, cz3 = 0;
        cutPoints.forEach(p => { cx3 += p.x; cy3 += p.y; cz3 += p.z; });
        cx3 /= cutPoints.length; cy3 /= cutPoints.length; cz3 /= cutPoints.length;

        // Orthonormal basis (u, w) on the cutting plane for exact cyclic sorting in 3D
        const ux = cutPoints[0].x - cx3, uy = cutPoints[0].y - cy3, uz = cutPoints[0].z - cz3;
        const wx = ny * uz - nz * uy, wy = nz * ux - nx * uz, wz = nx * uy - ny * ux;

        cutPoints.sort((a, b) => {
          const ax = a.x - cx3, ay = a.y - cy3, az = a.z - cz3;
          const bx = b.x - cx3, by = b.y - cy3, bz = b.z - cz3;
          const angA = Math.atan2(ax * wx + ay * wy + az * wz, ax * ux + ay * uy + az * uz);
          const angB = Math.atan2(bx * wx + by * wy + bz * wz, bx * ux + by * uy + bz * uz);
          return angA - angB;
        });

        const projCut = cutPoints.map(p => project3D(p, canvas.width, canvas.height));
        ctx.beginPath();
        projCut.forEach((p, idx) => idx === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
        ctx.closePath();
        ctx.fillStyle = 'rgba(52, 211, 153, 0.68)';
        ctx.fill();
        ctx.strokeStyle = '#34d399';
        ctx.lineWidth = 3.2;
        ctx.stroke();

        projCut.forEach(p => {
          ctx.beginPath();
          ctx.arc(p.x, p.y, 5, 0, 2 * Math.PI);
          ctx.fillStyle = '#fff';
          ctx.fill();
        });
      }

      const nV = cutPoints.length;
      let shapeLabel = 'Нет пересечения';
      if (shapeKey === 'cylinder' || shapeKey === 'cone') {
        shapeLabel = nV >= 8 ? (Math.abs(pitch) < 0.08 ? 'Круг ⭕' : 'Эллипс / Парабола 🥚') : (nV >= 3 ? `Срез (${nV} т.)` : 'Нет среза');
      } else {
        shapeLabel = nV === 3 ? 'Треугольник 🔺'
          : (nV === 4 ? 'Четырёхугольник 🔲'
          : (nV === 5 ? 'Пятиугольник ⬟'
          : (nV === 6 ? 'Шестиугольник ⬡ ✨'
          : (nV > 6 ? `${nV}-угольник ✨` : 'Нет среза'))));
      }

      updateMetrics({
        'Тело': geom.name,
        'Вершин в сечении': nV,
        'Фигура сечения': shapeLabel,
        'Высота / Наклон': `${D.toFixed(2)} / ${pitch.toFixed(2)}`
      }, `Сечение: ${geom.name}`);

      if (state.domain === 'quests' && state.questId === 'quest_cube_hex') {
        const el = document.getElementById('quest-cut-status');
        if (el) {
          el.innerText = nV === 6 ? '🎉 ПОБЕДА! В сечении куба получен шестиугольник!' : `Сейчас: ${shapeLabel}. Ищи 6 вершин!`;
          el.className = 'quest-status' + (nV === 6 ? ' success' : '');
        }
      }
    }

    function renderUnfolding3D() {
      const fold = (1 - state.unfoldProgress) * (Math.PI / 2);
      const s = 0.8;
      const drawPoly = (pts, col) => {
        ctx.beginPath();
        pts.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
        ctx.closePath();
        ctx.fillStyle = col;
        ctx.globalAlpha = 0.55;
        ctx.fill();
        ctx.globalAlpha = 1.0;
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.stroke();
      };

      drawPoly([{ x: -s, y: -s, z: -s }, { x: s, y: -s, z: -s }, { x: s, y: -s, z: s }, { x: -s, y: -s, z: s }].map(v => project3D(v, canvas.width, canvas.height)), '#38bdf8');
      drawPoly([{ x: -s, y: -s, z: s }, { x: s, y: -s, z: s }, { x: s, y: -s + 2*s*Math.sin(fold), z: s + 2*s*Math.cos(fold) }, { x: -s, y: -s + 2*s*Math.sin(fold), z: s + 2*s*Math.cos(fold) }].map(v => project3D(v, canvas.width, canvas.height)), '#f43f5e');
      drawPoly([{ x: -s, y: -s, z: -s }, { x: s, y: -s, z: -s }, { x: s, y: -s + 2*s*Math.sin(fold), z: -s - 2*s*Math.cos(fold) }, { x: -s, y: -s + 2*s*Math.sin(fold), z: -s - 2*s*Math.cos(fold) }].map(v => project3D(v, canvas.width, canvas.height)), '#34d399');
      drawPoly([{ x: -s, y: -s, z: -s }, { x: -s, y: -s, z: s }, { x: -s - 2*s*Math.cos(fold), y: -s + 2*s*Math.sin(fold), z: s }, { x: -s - 2*s*Math.cos(fold), y: -s + 2*s*Math.sin(fold), z: -s }].map(v => project3D(v, canvas.width, canvas.height)), '#fbbf24');
      drawPoly([{ x: s, y: -s, z: -s }, { x: s, y: -s, z: s }, { x: s + 2*s*Math.cos(fold), y: -s + 2*s*Math.sin(fold), z: s }, { x: s + 2*s*Math.cos(fold), y: -s + 2*s*Math.sin(fold), z: -s }].map(v => project3D(v, canvas.width, canvas.height)), '#818cf8');

      updateMetrics({
        'Раскрытие': `${Math.round(state.unfoldProgress * 100)}%`,
        'Угол сгиба': `${((1 - state.unfoldProgress) * 90).toFixed(1)}°`,
        'Площадь поверхности': 'S = 6 · a²',
        'Объём куба': 'V = a³'
      }, 'Развертка Куба');
    }

    function updateMetrics(dataObj, title) {
      const grid = document.getElementById('stat-grid');
      const titleEl = document.getElementById('overlay-title');
      if (title) titleEl.innerText = title;
      let html = '';
      for (const [k, v] of Object.entries(dataObj)) {
        html += `<div class="stat-item"><div class="stat-name">${k}</div><div class="stat-val">${v}</div></div>`;
      }
