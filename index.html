        db.dimProgress += 0.009 * db.animDir;
        if (db.dimProgress >= 4.0) { db.dimProgress = 4.0; db.animDir = -1; }
        else if (db.dimProgress <= 0.0) { db.dimProgress = 0.0; db.animDir = 1; }
        const sl = document.getElementById('dim-bridge-slider');
        if (sl) sl.value = db.dimProgress;
        const vl = document.getElementById('dim-prog-val');
        if (vl) vl.innerText = db.dimProgress.toFixed(2) + ' D';
      }

      if (db.autoWRotate) {
        db.wAngle += 0.012;
      }

      const p = db.dimProgress;
      const t1 = Math.max(0, Math.min(1, p));       // 0D -> 1D extrusion along X
      const t2 = Math.max(0, Math.min(1, p - 1));   // 1D -> 2D extrusion along Z
      const t3 = Math.max(0, Math.min(1, p - 2));   // 2D -> 3D extrusion along Y
      const t4 = Math.max(0, Math.min(1, p - 3));   // 3D -> 4D extrusion along W

      const s = 0.88;

      if (db.family === 'hypercube') {
        // 16 vertices of a 4D hypercube (tesseract), each labeled by binary bits (b0, b1, b2, b3) in {0, 1}^4
        // As t1, t2, t3, t4 grow from 0 to 1, each dimension smoothly unfolds from a single point!
        const verts3D = [];
        for (let i = 0; i < 16; i++) {
          const b0 = (i & 1) ? 1 : -1;
          const b1 = (i & 2) ? 1 : -1;
          const b2 = (i & 4) ? 1 : -1;
          const b3 = (i & 8) ? 1 : -1;

          // Base coordinates before 4D rotation
          let x = (b0 === -1 ? -s * t1 : s * t1);
          let z = (b1 === -1 ? -s * t2 : s * t2);
          let y = (b2 === -1 ? -s * t3 : s * t3);
          let wCoord = (b3 === -1 ? -s * t4 : s * t4);

          // When in 4D (t4 > 0.01), rotate in XW and ZW planes + stereographic/Schlegel-like 4D->3D projection
          if (t4 > 0.001) {
            const cosW = Math.cos(db.wAngle * t4), sinW = Math.sin(db.wAngle * t4);
            const xRot = x * cosW - wCoord * sinW;
            const wRot = x * sinW + wCoord * cosW;
            const persp4D = 1.0 / (2.35 - wRot * 0.55);
            x = xRot * persp4D * 1.85;
            y = y * persp4D * 1.85;
            z = z * persp4D * 1.85;
          }

          verts3D.push({ x, y, z, b0, b1, b2, b3 });
        }

        const proj = verts3D.map(v => project3D(v, w, h));

        // Draw 2D square faces when t2 > 0.05
        if (t2 > 0.05 && state.uiLayers.showFaces3D) {
          const baseCubeFaces = [
            [0, 1, 3, 2], [4, 5, 7, 6],
            [0, 1, 5, 4], [2, 3, 7, 6],
            [0, 2, 6, 4], [1, 3, 7, 5]
          ];
          const fColors = ['#38bdf8', '#34d399', '#f43f5e', '#fbbf24', '#818cf8', '#22d3ee'];
          const maxFaces = t3 > 0.02 ? 6 : 1;
          for (let fIdx = 0; fIdx < maxFaces; fIdx++) {
            const f = baseCubeFaces[fIdx];
            ctx.beginPath();
            f.forEach((vIdx, k) => k === 0 ? ctx.moveTo(proj[vIdx].x, proj[vIdx].y) : ctx.lineTo(proj[vIdx].x, proj[vIdx].y));
            ctx.closePath();
            ctx.fillStyle = fColors[fIdx % fColors.length];
            ctx.globalAlpha = fIdx === 0 ? 0.28 : 0.18 * t3;
            ctx.fill();
            ctx.globalAlpha = 1.0;
          }
          if (t4 > 0.05) {
            for (let fIdx = 0; fIdx < 6; fIdx++) {
              const f = baseCubeFaces[fIdx].map(idx => idx + 8);
              ctx.beginPath();
              f.forEach((vIdx, k) => k === 0 ? ctx.moveTo(proj[vIdx].x, proj[vIdx].y) : ctx.lineTo(proj[vIdx].x, proj[vIdx].y));
              ctx.closePath();
              ctx.fillStyle = '#c084fc';
              ctx.globalAlpha = 0.14 * t4;
              ctx.fill();
              ctx.globalAlpha = 1.0;
            }
          }
        }

        // Draw 1D edges for each dimension step with distinct colors!
        if (state.uiLayers.showEdges3D) {
          for (let i = 0; i < 16; i++) {
            for (let bit = 0; bit < 4; bit++) {
              const j = i ^ (1 << bit);
              if (i < j) {
                if (bit === 0 && t1 < 0.01) continue;
                if (bit === 1 && t2 < 0.01) continue;
                if (bit === 2 && t3 < 0.01) continue;
                if (bit === 3 && t4 < 0.01) continue;
                // Only draw higher-bit copies when their parent dimension is active
                if (i >= 2 && t2 < 0.01) continue;
                if (i >= 4 && t3 < 0.01) continue;
                if (i >= 8 && t4 < 0.01) continue;

                const edgeColors = ['#38bdf8', '#34d399', '#fbbf24', '#c084fc'];
                const lw = bit === 3 ? 2.4 : 3.2;
                drawLine(proj[i], proj[j], edgeColors[bit], lw, bit === 3);
              }
            }
          }
        }

        // Draw active 0D vertices
        const activeVertCount = p < 0.05 ? 1 : (p < 1.05 ? 2 : (p < 2.05 ? 4 : (p < 3.05 ? 8 : 16)));
        for (let i = 0; i < activeVertCount; i++) {
          const col = i < 2 ? '#f43f5e' : (i < 4 ? '#34d399' : (i < 8 ? '#fbbf24' : '#c084fc'));
          drawPointMarker(proj[i], col, activeVertCount <= 8 ? `V${i + 1}` : '', -10);
        }

        // Visual summary banner at top-left of canvas
        const stIdx = Math.min(4, Math.round(p));
        const counts = [
          { name: '0D: Точка', v: 1, e: 0, f: 0, c: 0 },
          { name: '1D: Отрезок (сдвиг точки)', v: 2, e: 1, f: 0, c: 0 },
          { name: '2D: Квадрат (сдвиг отрезка)', v: 4, e: 4, f: 1, c: 0 },
          { name: '3D: Куб (8 точек, 12 линий, 6 плоскостей!)', v: 8, e: 12, f: 6, c: 1 },
          { name: '4D: Тессеракт (16 точек, 32 линии, 24 плоск., 8 кубов!)', v: 16, e: 32, f: 24, c: 8 }
        ][stIdx];

        updateMetrics({
          'Семейство (2ⁿ)': counts.name,
          '0D Точек (вершин)': `${counts.v} шт. (2^${stIdx})`,
          '1D Линий (рёбер)': `${counts.e} шт.`,
          '2D Плоскостей (граней)': `${counts.f} шт.${stIdx === 3 ? ' (у куба 6, не 4!)' : ''}`,
          '3D Объёмов (ячеек)': `${counts.c} шт. ✨`
        }, 'Мост Мерностей: Гиперкубы');
      } else {
        // SIMPLEX FAMILY: Point (1) -> Segment (2) -> Triangle (3) -> Tetrahedron (4) -> Pentachoron (5)
        // Every new dimension adds exactly ONE new vertex outside the previous space and connects it to all existing vertices!
        const v0 = { x: -s * t1, y: -0.55 * t3, z: -0.5 * t2 };
        const v1 = { x: s * t1, y: -0.55 * t3, z: -0.5 * t2 };
        const v2 = { x: 0, y: -0.55 * t3, z: s * 1.05 * t2 };
        const v3 = { x: 0, y: s * 1.15 * t3, z: 0 };
        // 5th vertex in 4D (placed at center of tetrahedron and rotated via wAngle!)
        const v4 = {
          x: 0.32 * Math.cos(db.wAngle) * t4,
          y: 0.15 * Math.sin(db.wAngle * 0.8) * t4,
          z: 0.32 * Math.sin(db.wAngle) * t4
        };

        const rawVerts = [v0, v1, v2, v3, v4];
        const proj = rawVerts.map(v => project3D(v, w, h));

        const nActive = p < 0.05 ? 1 : (p < 1.05 ? 2 : (p < 2.05 ? 3 : (p < 3.05 ? 4 : 5)));

        // Draw 2D triangular faces
        if (t2 > 0.05 && state.uiLayers.showFaces3D) {
          const triFaces = [[0, 1, 2], [0, 1, 3], [1, 2, 3], [0, 2, 3]];
          const tCols = ['#34d399', '#38bdf8', '#f43f5e', '#fbbf24'];
          const maxF = t3 > 0.02 ? 4 : 1;
          for (let fIdx = 0; fIdx < maxF; fIdx++) {
            const [a, b, c] = triFaces[fIdx];
            ctx.beginPath();
            ctx.moveTo(proj[a].x, proj[a].y);
            ctx.lineTo(proj[b].x, proj[b].y);
            ctx.lineTo(proj[c].x, proj[c].y);
            ctx.closePath();
            ctx.fillStyle = tCols[fIdx];
            ctx.globalAlpha = fIdx === 0 ? 0.32 : 0.24 * t3;
            ctx.fill();
            ctx.globalAlpha = 1.0;
          }
        }

        // Draw all pairs of edges (complete graph K_n!)
        if (state.uiLayers.showEdges3D) {
          for (let i = 0; i < nActive; i++) {
            for (let j = i + 1; j < nActive; j++) {
              const col = j === 1 ? '#38bdf8' : (j === 2 ? '#34d399' : (j === 3 ? '#fbbf24' : '#c084fc'));
              drawLine(proj[i], proj[j], col, j === 4 ? 2.5 : 3.5, j === 4);
            }
          }
        }

        // Draw vertices
        for (let i = 0; i < nActive; i++) {
          const vCols = ['#f43f5e', '#38bdf8', '#34d399', '#fbbf24', '#c084fc'];
          const vNames = ['A (0D)', 'B (1D)', 'C (2D)', 'D (3D вершина)', 'E (4D вершина!)'];
          drawPointMarker(proj[i], vCols[i], vNames[i], i === 3 ? -14 : 14);
        }

        const stIdx = Math.min(4, Math.round(p));
        const sCounts = [
          { name: '0D: Точка', v: 1, e: 0, f: 0, c: 0 },
          { name: '1D: Отрезок (2 точки)', v: 2, e: 1, f: 0, c: 0 },
          { name: '2D: Треугольник (3 точки, 3 линии)', v: 3, e: 3, f: 1, c: 0 },
          { name: '3D: Тетраэдр (4 точки, 6 линий, 4 плоскости!)', v: 4, e: 6, f: 4, c: 1 },
          { name: '4D: Пятиячейник (5 точек, 10 линий, 10 плоск., 5 тетраэдров!)', v: 5, e: 10, f: 10, c: 5 }
        ][stIdx];

        updateMetrics({
          'Семейство Симплексов': sCounts.name,
          '0D Точек (n + 1)': `${sCounts.v} шт.`,
          '1D Линий (рёбер)': `${sCounts.e} шт.`,
          '2D Плоскостей (граней)': `${sCounts.f} шт.${stIdx === 3 ? ' (4 плоскости = Тетраэдр!)' : ''}`,
          '3D Объёмов (ячеек)': `${sCounts.c} шт. ✨`
        }, 'Мост Мерностей: Симплексы');
      }

      if (state.domain === 'quests' && state.questId === 'quest_dimensions') {
        const el = document.getElementById('quest-dim-status');
        if (el) {
          const ok = p >= 3.85;
          el.innerText = ok
            ? `🎉 ПОБЕДА! Ты построил мост от 0D-точки до 4D-${db.family === 'hypercube' ? 'Тессеракта (16 точек, 8 кубов)' : 'Пятиячейника (5 точек, 5 тетраэдров)'}!`
            : `Сейчас: ${p.toFixed(1)}D (${db.family === 'hypercube' ? 'Семейство Куба' : 'Семейство Симплекса'}). Доведи ползунок до 4D!`;
          el.className = 'quest-status' + (ok ? ' success' : '');
        }
      }
    }

    function renderAxiomsPerp3DScene() {
      const st = state.stereoTheory;
      const w = canvas.width, h = canvas.height;
      const s = 1.45;

      // Base horizontal plane alpha (at y = -0.35)
      const yPlane = -0.35;
      const alphaPts = [
        { x: -s, y: yPlane, z: -s },
        { x: s, y: yPlane, z: -s },
        { x: s, y: yPlane, z: s },
        { x: -s, y: yPlane, z: s }
      ];

      if (st.subMode === 'axioms') {
        if (st.planeWay === '2planes_line') {
          // Axiom III: Two planes alpha and beta intersecting along a common line l!
          drawPlanePatch3D(alphaPts, '#38bdf8', 0.25, '#38bdf8', w, h);
          const betaPts = [
            { x: -s * 0.8, y: yPlane - 0.9, z: -s },
            { x: s * 0.8, y: yPlane + 1.1, z: -s },
            { x: s * 0.8, y: yPlane + 1.1, z: s },
            { x: -s * 0.8, y: yPlane - 0.9, z: s }
          ];
          drawPlanePatch3D(betaPts, '#f43f5e', 0.25, '#f43f5e', w, h);

          const L1 = project3D({ x: -0.1, y: yPlane, z: -s * 1.15 }, w, h);
          const L2 = project3D({ x: -0.1, y: yPlane, z: s * 1.15 }, w, h);
          drawLine(L1, L2, '#fbbf24', 4.5);
          drawSegmentLabel(L1, L2, 'Общая прямая пересечения l = α ∩ β (Аксиома III)', '#fde68a', -18);

          updateMetrics({
            'Аксиома III (A₃)': 'α ∩ β = прямая l ✨',
            'Общие точки плоскостей': 'Все лежат на прямой l',
            'Образ в жизни': 'Сгиб раскрытой книги / угол комнаты',
            'Применение': 'Построение сечений многогранников'
          }, 'Аксиома III: Две плоскости');
        } else {
          const pAlpha = drawPlanePatch3D(alphaPts, '#38bdf8', 0.24, '#38bdf8', w, h);
          if (state.uiLayers.showLabels) {
            ctx.fillStyle = '#7dd3fc';
            ctx.font = 'bold 14px sans-serif';
            ctx.fillText('Плоскость α (единственная!)', pAlpha[0].x + 25, pAlpha[0].y - 10);
          }

          const A = project3D({ x: -0.8, y: yPlane, z: 0.6 }, w, h);
          const B = project3D({ x: 0.85, y: yPlane, z: 0.3 }, w, h);
          const C = project3D({ x: -0.1, y: yPlane, z: -0.85 }, w, h);

          if (st.planeWay === '3points') {
            // Axiom I & II: 3 non-collinear points A, B, C + line AB lying completely in alpha
            drawLine(A, B, '#fbbf24', 3.5);
            drawLine(B, C, 'rgba(255,255,255,0.4)', 2, true);
            drawLine(A, C, 'rgba(255,255,255,0.4)', 2, true);
            drawSegmentLabel(A, B, 'Аксиома II: A ∈ α, B ∈ α ➔ прямая AB ⊂ α', '#fde68a', 18);
            drawPointMarker(A, '#f43f5e', 'Точка A ∈ α', 14);
            drawPointMarker(B, '#34d399', 'Точка B ∈ α', 14);
            drawPointMarker(C, '#fbbf24', 'Точка C ∈ α (Аксиома I: 3 точки)', -14);
          } else if (st.planeWay === 'line_point') {
            const L1 = project3D({ x: -1.1, y: yPlane, z: 0.5 }, w, h);
            const L2 = project3D({ x: 1.1, y: yPlane, z: 0.2 }, w, h);
            drawLine(L1, L2, '#34d399', 4);
            drawSegmentLabel(L1, L2, 'Прямая a ⊂ α', '#6ee7b7', 16);
            drawPointMarker(C, '#fbbf24', 'Точка M ∉ a (задаёт плоскость α вместе с a!)', -14);
          } else if (st.planeWay === '2intersect') {
            const O = project3D({ x: 0, y: yPlane, z: 0 }, w, h);
            drawLine(project3D({ x: -1.1, y: yPlane, z: -0.7 }, w, h), project3D({ x: 1.1, y: yPlane, z: 0.7 }, w, h), '#f43f5e', 3.8);
            drawLine(project3D({ x: -1.1, y: yPlane, z: 0.7 }, w, h), project3D({ x: 1.1, y: yPlane, z: -0.7 }, w, h), '#fbbf24', 3.8);
            drawPointMarker(O, '#fff', 'Точка пересечения a ∩ b = O', -16);
          } else {
            const A1 = project3D({ x: -1.1, y: yPlane, z: -0.45 }, w, h);
            const A2 = project3D({ x: 1.1, y: yPlane, z: -0.45 }, w, h);
            const B1 = project3D({ x: -1.1, y: yPlane, z: 0.55 }, w, h);
            const B2 = project3D({ x: 1.1, y: yPlane, z: 0.55 }, w, h);
            drawLine(A1, A2, '#34d399', 3.8);
            drawLine(B1, B2, '#34d399', 3.8);
            drawSegmentLabel(A1, A2, 'Прямая a', '#6ee7b7', -14);
            drawSegmentLabel(B1, B2, 'Прямая b (b ∥ a ➔ задают плоскость α!)', '#6ee7b7', 16);
          }

          updateMetrics({
            'Аксиома I (A₁)': '3 точки вне одной прямой ➔ 1 плоскость',
            'Аксиома II (A₂)': '2 точки прямой в α ➔ вся прямая в α',
            'Способ задания α': st.planeWay === '3points' ? 'Три точки A, B, C' : (st.planeWay === 'line_point' ? 'Прямая a и точка M' : (st.planeWay === '2intersect' ? 'Пересекающиеся a ∩ b' : 'Параллельные a ∥ b')),
            'Жёсткость в 3D': 'Единственная плоскость ✨'
          }, 'Аксиомы Стереометрии');
        }
      } else if (st.subMode === 'parallel') {
        // Two parallel planes alpha (bottom) and beta (top) with pairs of intersecting parallel lines a1||a2 and b1||b2!
        const y1 = -0.75, y2 = 0.65;
        drawPlanePatch3D([
          { x: -s, y: y1, z: -s }, { x: s, y: y1, z: -s }, { x: s, y: y1, z: s }, { x: -s, y: y1, z: s }
        ], '#38bdf8', 0.22, '#38bdf8', w, h);

        drawPlanePatch3D([
          { x: -s, y: y2, z: -s }, { x: s, y: y2, z: -s }, { x: s, y: y2, z: s }, { x: -s, y: y2, z: s }
        ], '#34d399', 0.22, '#34d399', w, h);

        // Intersecting lines in bottom plane alpha
        drawLine(project3D({ x: -1.1, y: y1, z: -0.5 }, w, h), project3D({ x: 1.1, y: y1, z: 0.5 }, w, h), '#f43f5e', 3.5);
        drawLine(project3D({ x: -1.0, y: y1, z: 0.7 }, w, h), project3D({ x: 1.0, y: y1, z: -0.7 }, w, h), '#fbbf24', 3.5);
        drawPointMarker(project3D({ x: 0, y: y1, z: 0 }, w, h), '#fff', 'Плоскость α: a₁ ∩ b₁', 14);

        // Parallel intersecting lines in top plane beta
        drawLine(project3D({ x: -1.1, y: y2, z: -0.5 }, w, h), project3D({ x: 1.1, y: y2, z: 0.5 }, w, h), '#f43f5e', 3.5);
        drawLine(project3D({ x: -1.0, y: y2, z: 0.7 }, w, h), project3D({ x: 1.0, y: y2, z: -0.7 }, w, h), '#fbbf24', 3.5);
        drawPointMarker(project3D({ x: 0, y: y2, z: 0 }, w, h), '#fff', 'Плоскость β ∥ α: a₂ ∥ a₁, b₂ ∥ b₁', -14);

        updateMetrics({
          'Прямая ∥ плоскости': 'a ∥ b (где b ⊂ α) ➔ a ∥ α',
          'Плоскость ∥ плоскости': 'a₁∥a₂ и b₁∥b₂ (a₁∩b₁) ➔ α ∥ β',
          'Свойство секущей γ': 'Пересекает α и β по ∥ прямым!',
          'Отрезки ∥ прямых между α и β': 'Всегда равны ✨'
        }, 'Параллельность в 3D');
      } else if (st.subMode === 'skew_lines') {
        // 2.4 Skew lines theorem: line b in plane alpha, line a pierces plane alpha at point M not on b!
        drawPlanePatch3D(alphaPts, '#38bdf8', 0.22, '#38bdf8', w, h);

        const B1 = project3D({ x: -1.15, y: yPlane, z: 0.55 }, w, h);
        const B2 = project3D({ x: 1.15, y: yPlane, z: 0.55 }, w, h);
        drawLine(B1, B2, '#38bdf8', 4);
        drawSegmentLabel(B1, B2, 'Прямая b ⊂ α (лежит в плоскости)', '#7dd3fc', 16);

        // Line a piercing plane alpha at M(0.2, yPlane, -0.35)
        const M3 = { x: 0.2, y: yPlane, z: -0.35 };
        const A_top = project3D({ x: -0.5, y: 1.15, z: -0.8 }, w, h);
        const A_mid = project3D(M3, w, h);
        const A_bot = project3D({ x: 0.75, y: -1.25, z: 0.0 }, w, h);

        drawLine(A_top, A_mid, '#f43f5e', 4);
        drawLine(A_mid, A_bot, 'rgba(244, 63, 94, 0.5)', 3, true);
        drawSegmentLabel(A_top, A_mid, 'Скрещивающаяся прямая a (a ∩ α = M)', '#fda4af', -18);
        drawPointMarker(A_mid, '#fbbf24', 'Точка прокола M ∉ b ➔ a и b скрещиваются!', -14);

        updateMetrics({
          'Условие 1': 'Прямая b лежит в плоскости α (b ⊂ α)',
          'Условие 2': 'Прямая a пересекает α в точке M',
          'Условие 3 (Главное!)': 'Точка M НЕ лежит на прямой b (M ∉ b)',
          'Вывод (Признак)': 'a и b — СКРЕЩИВАЮЩИЕСЯ! ✨'
        }, '2.4 Скрещивающиеся Прямые');
      } else if (st.subMode === 'perp') {
        // 3.1 Line perpendicular to plane (l perp a and l perp b at O) + 3.3 Perpendicular planes
        drawPlanePatch3D(alphaPts, '#38bdf8', 0.22, '#38bdf8', w, h);

        // Vertical plane beta passing through normal l
        const betaVert = [
          { x: -0.95, y: yPlane, z: 0 },
          { x: 0.95, y: yPlane, z: 0 },
          { x: 0.95, y: 1.1, z: 0 },
          { x: -0.95, y: 1.1, z: 0 }
        ];
        drawPlanePatch3D(betaVert, '#c084fc', 0.18, 'rgba(192, 132, 252, 0.6)', w, h);

        const O = project3D({ x: 0, y: yPlane, z: 0 }, w, h);
        const TopL = project3D({ x: 0, y: 1.25, z: 0 }, w, h);
        const A1 = project3D({ x: -1.1, y: yPlane, z: -0.6 }, w, h);
        const A2 = project3D({ x: 1.1, y: yPlane, z: 0.6 }, w, h);
        const B1 = project3D({ x: -1.0, y: yPlane, z: 0.7 }, w, h);
        const B2 = project3D({ x: 1.0, y: yPlane, z: -0.7 }, w, h);

        drawLine(A1, A2, '#34d399', 3);
        drawLine(B1, B2, '#fbbf24', 3);
        drawLine(O, TopL, '#f43f5e', 4.5);

        drawRightAngleSquare(O, TopL, A2, 14, '#34d399');
        drawRightAngleSquare(O, TopL, B2, 14, '#fbbf24');

        drawSegmentLabel(O, TopL, 'Перпендикуляр l ⊥ α (и l ⊂ β ➔ β ⊥ α)', '#fda4af', -18);
        drawPointMarker(O, '#fff', 'O (l ⊥ a и l ⊥ b ➔ l ⊥ α!)', 16);

        updateMetrics({
          'Признак l ⊥ α': 'l ⊥ a и l ⊥ b (где a ∩ b в α)',
          'Свойство l ⊥ α': 'l перпендикулярна ЛЮБОЙ прямой в α!',
          'Признак β ⊥ α': 'Плоскость β проходит через l ⊥ α',
          'Угол между α и β': 'Строго 90° 📐'
        }, '3.1–3.3 Перпендикулярность');
      } else if (st.subMode === 'ttp') {
        // 3.4 Theorem of Three Perpendiculars (TTP) interactive 3D!
        drawPlanePatch3D(alphaPts, '#38bdf8', 0.22, '#38bdf8', w, h);

        const H3 = { x: -0.55, y: yPlane, z: -0.35 };
        const A3 = { x: -0.55, y: 1.15, z: -0.35 }; // Perpendicular AH to plane alpha
        const M3 = { x: 0.45, y: yPlane, z: 0.25 };  // Foot of oblique AM

        const H = project3D(H3, w, h);
        const A = project3D(A3, w, h);
        const M = project3D(M3, w, h);

        // Direction of projection HM in XZ plane
        const dxHM = M3.x - H3.x, dzHM = M3.z - H3.z;
        const baseAng = Math.atan2(dzHM, dxHM);
        const rotRad = (st.ttpAngleDeg * Math.PI) / 180;
        const lineAng = baseAng + rotRad;

        const L_p1 = project3D({ x: M3.x - 0.95 * Math.cos(lineAng), y: yPlane, z: M3.z - 0.95 * Math.sin(lineAng) }, w, h);
        const L_p2 = project3D({ x: M3.x + 0.95 * Math.cos(lineAng), y: yPlane, z: M3.z + 0.95 * Math.sin(lineAng) }, w, h);

        // 1. Perpendicular AH (Red)
        drawLine(A, H, '#f43f5e', 4);
        drawRightAngleSquare(H, A, M, 13, '#f43f5e');
        // 2. Projection HM (Emerald)
        drawLine(H, M, '#34d399', 4);
        // 3. Oblique AM (Blue)
        drawLine(A, M, '#38bdf8', 4);
        // 4. Line a in plane alpha through M (Amber)
        drawLine(L_p1, L_p2, '#fbbf24', 3.8);

        const is90 = Math.abs(st.ttpAngleDeg - 90) < 2;
        if (is90) {
          drawRightAngleSquare(M, H, L_p2, 15, '#34d399');
          drawRightAngleSquare(M, A, L_p2, 15, '#38bdf8');
        }

        drawSegmentLabel(A, H, '1) Перпендикуляр AH ⊥ α', '#fda4af', -18);
        drawSegmentLabel(H, M, '2) Проекция HM', '#6ee7b7', 16);
        drawSegmentLabel(A, M, '3) Наклонная AM', '#7dd3fc', -18);
        drawSegmentLabel(M, L_p2, `Прямая a ⊂ α (${st.ttpAngleDeg}°)`, '#fde68a', 16);

        drawPointMarker(A, '#f43f5e', 'A (вершина)', -12);
        drawPointMarker(H, '#34d399', 'H (основание перпендикуляра)', 14);
        drawPointMarker(M, '#fbbf24', is90 ? 'M (90° с проекцией ⟺ 90° с наклонной!)' : 'M (основание наклонной)', 14);

        updateMetrics({
          '1. Перпендикуляр к α': 'AH ⊥ α (90°)',
          '2. Наклонная и Проекция': 'AM (наклонная), HM (проекция)',
          'Угол (a, проекция HM)': `${st.ttpAngleDeg}°`,
          'По ТТП угол (a, наклонная AM)': is90 ? 'Строго 90° (Перпендикулярны!) ✨' : 'Не равен 90°'
        }, '3.4 Теорема о Трёх Перпендикулярах');
      } else {
        // 3.2 Classic EGE Plot: Regular Pyramid (SA perp BC) OR Cube Diagonal (B1D perp AC)
        if (st.egeShape === 'pyramid') {
          const A3 = { x: -1.1, y: -0.65, z: 0.7 };
          const B3 = { x: 1.0, y: -0.65, z: 0.85 };
          const C3 = { x: 0.35, y: -0.65, z: -1.05 };
          const S3 = { x: 0.08, y: 1.2, z: 0.16 };
          const O3 = { x: 0.08, y: -0.65, z: 0.16 };
          const M3 = { x: (B3.x + C3.x) / 2, y: -0.65, z: (B3.z + C3.z) / 2 };

          drawPlanePatch3D([A3, B3, C3], '#38bdf8', 0.2, 'rgba(255,255,255,0.5)', w, h);
          const pA = project3D(A3, w, h), pB = project3D(B3, w, h), pC = project3D(C3, w, h);
          const pS = project3D(S3, w, h), pO = project3D(O3, w, h), pM = project3D(M3, w, h);

          drawLine(pS, pB, 'rgba(255,255,255,0.45)', 2);
          drawLine(pS, pC, 'rgba(255,255,255,0.45)', 2);

          // Highlight Height SO, Projection AM (median/altitude of base), Oblique SA, and opposite edge BC!
          drawLine(pS, pO, '#f43f5e', 3.5, true);
          drawLine(pA, pM, '#34d399', 3.5);
          drawLine(pS, pM, 'rgba(52, 211, 153, 0.5)', 2, true);
          drawLine(pS, pA, '#38bdf8', 4.5);
          drawLine(pB, pC, '#fbbf24', 4.5);

          drawRightAngleSquare(pO, pS, pM, 12, '#f43f5e');
          drawRightAngleSquare(pM, pA, pB, 14, '#34d399');
          drawRightAngleSquare(pM, pS, pB, 14, '#fbbf24');

          drawSegmentLabel(pS, pA, 'Боковое ребро SA (наклонная)', '#7dd3fc', -18);
          drawSegmentLabel(pA, pM, 'Проекция AM ⊥ BC', '#6ee7b7', 16);
          drawSegmentLabel(pB, pC, 'Скрещивающееся ребро BC (BC ⊥ SA, 90°!)', '#fde68a', 18);

          drawPointMarker(pS, '#fff', 'Вершина S', -12);
          drawPointMarker(pO, '#f43f5e', 'O (высота SO)', 14);
          drawPointMarker(pM, '#fbbf24', 'M (середина BC: AM ⊥ BC ➔ SA ⊥ BC!)', 14);

          updateMetrics({
            'Сюжет ЕГЭ №1': 'Правильная пирамида SABC',
            'Проекция SA на дно': 'Медиана и высота AM ⊥ BC',
            'Следствие по ТТП': 'Скрещивающиеся SA ⊥ BC (90°!) ✨',
            'Также перпендикулярны': 'BC ⊥ всей плоскости (SAM)!'
          }, '3.2 Сюжет ЕГЭ: Пирамида');
        } else {
          // Cube B1D perp AC
          const sc = 0.95;
          const V = [
            { x: -sc, y: -sc, z: sc },  // 0: A
            { x: sc, y: -sc, z: sc },   // 1: B
            { x: sc, y: -sc, z: -sc },  // 2: C
            { x: -sc, y: -sc, z: -sc }, // 3: D
            { x: -sc, y: sc, z: sc },   // 4: A1
            { x: sc, y: sc, z: sc },    // 5: B1
            { x: sc, y: sc, z: -sc },   // 6: C1
            { x: -sc, y: sc, z: -sc }   // 7: D1
          ];
          const pV = V.map(v => project3D(v, w, h));
          const edges = [[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]];
          edges.forEach(([i, j]) => drawLine(pV[i], pV[j], 'rgba(255,255,255,0.3)', 1.6));

          // Triangle AB1C (plane perpendicular to B1D!)
          drawPlanePatch3D([V[0], V[5], V[2]], '#34d399', 0.22, '#34d399', w, h);

          // Projection BD on bottom face, AC on bottom face, and main diagonal B1D!
          drawLine(pV[1], pV[3], '#38bdf8', 3, true); // BD
          drawLine(pV[0], pV[2], '#fbbf24', 4);       // AC
          drawLine(pV[5], pV[3], '#f43f5e', 4.5);     // B1D

          const centerBot = project3D({ x: 0, y: -sc, z: 0 }, w, h);
          drawRightAngleSquare(centerBot, pV[1], pV[2], 13, '#34d399');

          drawSegmentLabel(pV[5], pV[3], 'Диагональ куба B₁D ⊥ (AB₁C)', '#fda4af', -18);
          drawSegmentLabel(pV[0], pV[2], 'Диагональ дна AC ⊥ BD ➔ AC ⊥ B₁D!', '#fde68a', 18);

          drawPointMarker(pV[0], '#fff', 'A', 12);
          drawPointMarker(pV[1], '#fff', 'B', 12);
          drawPointMarker(pV[2], '#fff', 'C', 12);
          drawPointMarker(pV[3], '#fff', 'D', -12);
          drawPointMarker(pV[5], '#f43f5e', 'B₁', -12);

          updateMetrics({
            'Сюжет ЕГЭ №2': 'Диагональ куба B₁D и плоскость (AB₁C)',
            'Проекция B₁D на дно': 'Диагональ квадрата BD ⊥ AC',
            'По ТТП': 'B₁D ⊥ AC, B₁D ⊥ AB₁, B₁D ⊥ B₁C',
            'Супер-факт для ЕГЭ': 'B₁D ⊥ плоскости (AB₁C) под 90°! ✨'
          }, '3.2 Сюжет ЕГЭ: Куб');
        }
      }
    }

    function renderDistancesAngles3DScene() {
      const da = state.stereoDistAng;
      const w = canvas.width, h = canvas.height;
      const s = 1.45;
      const yPlane = -0.5;
      const alphaPts = [
        { x: -s, y: yPlane, z: -s },
        { x: s, y: yPlane, z: -s },
        { x: s, y: yPlane, z: s },
        { x: -s, y: yPlane, z: s }
      ];

      if (da.subMode === 'point_plane') {
        drawPlanePatch3D(alphaPts, '#38bdf8', 0.22, '#38bdf8', w, h);
        const H3 = { x: 0, y: yPlane, z: 0 };
        const A3 = { x: 0, y: yPlane + da.heightH, z: 0 };
        const M3 = { x: 0.9, y: yPlane, z: 0.55 };

        const pH = project3D(H3, w, h);
        const pA = project3D(A3, w, h);
        const pM = project3D(M3, w, h);

        drawLine(pA, pM, 'rgba(255,255,255,0.45)', 2.5, true);
        drawLine(pH, pM, 'rgba(56,189,248,0.5)', 2, true);
        drawLine(pA, pH, '#f43f5e', 4.5);
        drawRightAngleSquare(pH, pA, pM, 14, '#f43f5e');

        drawSegmentLabel(pA, pH, `Расстояние d = AH = ${da.heightH.toFixed(2)} (перпендикуляр!)`, '#fda4af', -18);
        drawSegmentLabel(pA, pM, `Наклонная AM = ${Math.hypot(da.heightH, 1.05).toFixed(2)} > d`, '#cbd5e1', 16);

        drawPointMarker(pA, '#fbbf24', 'Точка A', -14);
        drawPointMarker(pH, '#f43f5e', 'H (проекция A на α, 90°)', 14);

        updateMetrics({
          'Расстояние ρ(A, α)': `Перпендикуляр AH = ${da.heightH.toFixed(2)}`,
          'Сравнение с наклонной': 'Перпендикуляр всегда короче наклонной!',
          'Метод объёмов (ЕГЭ)': 'd = 3V / S_основания ✨',
          'Между ∥ плоскостями': 'Равно длине общего перпендикуляра'
        }, '4.1–4.2 Расстояние до Плоскости');
      } else if (da.subMode === 'skew_dist') {
        // 4.3 Distance between skew lines in a cube (e.g., edge AA1 and diagonal B1D1 or BC)
        const sc = 0.95;
        const V = [
          { x: -sc, y: -sc, z: sc },  { x: sc, y: -sc, z: sc },
          { x: sc, y: -sc, z: -sc }, { x: -sc, y: -sc, z: -sc },
          { x: -sc, y: sc, z: sc },   { x: sc, y: sc, z: sc },
          { x: sc, y: sc, z: -sc },  { x: -sc, y: sc, z: -sc }
        ];
        const pV = V.map(v => project3D(v, w, h));
        const edges = [[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]];
        edges.forEach(([i, j]) => drawLine(pV[i], pV[j], 'rgba(255,255,255,0.28)', 1.5));

        // Skew lines: vertical edge AA1 (V[0]-V[4]) and bottom-right edge BC (V[1]-V[2])
        drawLine(pV[0], pV[4], '#f43f5e', 4.5);
        drawLine(pV[1], pV[2], '#38bdf8', 4.5);
        // Common perpendicular AB (V[0]-V[1]): AB perp AA1 and AB perp BC!
        drawLine(pV[0], pV[1], '#34d399', 4.5);
        drawRightAngleSquare(pV[0], pV[4], pV[1], 14, '#34d399');
        drawRightAngleSquare(pV[1], pV[0], pV[2], 14, '#34d399');

        drawSegmentLabel(pV[0], pV[4], 'Прямая a (ребро AA₁)', '#fda4af', -18);
        drawSegmentLabel(pV[1], pV[2], 'Прямая b (ребро BC)', '#7dd3fc', 18);
        drawSegmentLabel(pV[0], pV[1], 'Общий перпендикуляр AB (AB ⊥ a и AB ⊥ b!)', '#6ee7b7', 18);

        updateMetrics({
          'Скрещивающиеся прямые': 'AA₁ и BC в кубе',
          'Общий перпендикуляр': 'Ребро AB (AB ⊥ AA₁ и AB ⊥ BC)',
          'Способ 2 (ЕГЭ)': 'Расстояние от a до ∥ плоскости (BCC₁)',
          'Способ 3 (Проекция)': 'Проекция на ⊥ плоскость (ABCD) ✨'
        }, '4.3 Расстояние Скрещивающихся');
      } else if (da.subMode === 'skew_angle') {
        // 5.1 Angle between skew lines via parallel translation slider!
        drawPlanePatch3D(alphaPts, '#38bdf8', 0.18, '#38bdf8', w, h);

        // Line b in bottom plane alpha
        const B1 = project3D({ x: -1.1, y: yPlane, z: 0.4 }, w, h);
        const B2 = project3D({ x: 1.1, y: yPlane, z: -0.4 }, w, h);
        drawLine(B1, B2, '#38bdf8', 4);
        drawSegmentLabel(B1, B2, 'Прямая b ⊂ α', '#7dd3fc', 16);

        // Original skew line a floating above plane at y = +0.75
        const yHigh = 0.75;
        const A1_orig = project3D({ x: -1.0, y: yHigh, z: -0.6 }, w, h);
        const A2_orig = project3D({ x: 1.0, y: yHigh, z: 0.6 }, w, h);
        drawLine(A1_orig, A2_orig, 'rgba(244, 63, 94, 0.45)', 3, true);
        drawSegmentLabel(A1_orig, A2_orig, 'Исходная прямая a (вверху)', '#fda4af', -16);

        // Translated line a' sliding down to plane alpha (t from 0 to 1)
        const t = da.shiftSkewT;
        const yCur = yHigh * (1 - t) + yPlane * t;
        const A1_cur = project3D({ x: -1.0, y: yCur, z: -0.6 }, w, h);
        const A2_cur = project3D({ x: 1.0, y: yCur, z: 0.6 }, w, h);
        const O_cur = project3D({ x: 0, y: yCur, z: 0 }, w, h);

        drawLine(A1_cur, A2_cur, '#f43f5e', 4);
        drawSegmentLabel(A1_cur, A2_cur, t > 0.95 ? "Перенесённая прямая a' ∥ a (пересекла b!)" : "Параллельный перенос a' ∥ a...", '#f43f5e', -18);

        if (t > 0.9) {
          drawAngleArc(O_cur, A2_cur, B2, 38, '#34d399', 'φ = 52°');
          drawPointMarker(O_cur, '#fff', 'Точка встречи O: угол φ ∈ (0°; 90°]!', 16);
        }

        updateMetrics({
          'Шаг 1': 'Переносим a параллельно самой себе (a′ ∥ a)',
          'Шаг 2': 'Совмещаем в одну точку O с прямой b',
          'Шаг 3 (Важно!)': 'Берём ОСТРЫЙ (или 90°) угол φ ∈ (0°; 90°]',
          'Если cos φ < 0': 'Берём модуль |cos φ| (острый угол!) ✨'
        }, '5.1 Угол Скрещивающихся Прямых');
      } else if (da.subMode === 'line_plane_ang') {
        // 5.2 Angle between line and plane = angle between oblique AM and its projection HM!
        drawPlanePatch3D(alphaPts, '#38bdf8', 0.22, '#38bdf8', w, h);

        const phiRad = (da.inclineDeg * Math.PI) / 180;
        const L_oblique = 1.65;
        const projLen = L_oblique * Math.cos(phiRad);
        const perpH = L_oblique * Math.sin(phiRad);

        const M3 = { x: -0.7, y: yPlane, z: 0.25 };
        const H3 = { x: M3.x + projLen, y: yPlane, z: M3.z - 0.25 };
        const A3 = { x: H3.x, y: yPlane + perpH, z: H3.z };

        const pM = project3D(M3, w, h);
        const pH = project3D(H3, w, h);
        const pA = project3D(A3, w, h);

        drawLine(pA, pH, '#f43f5e', 3.8, true);
        drawLine(pM, pH, '#34d399', 4);
        drawLine(pM, pA, '#fbbf24', 4.5);
        drawRightAngleSquare(pH, pA, pM, 14, '#f43f5e');
        drawAngleArc(pM, pH, pA, 44, '#fbbf24', `φ = ${da.inclineDeg}°`);

        drawSegmentLabel(pM, pA, 'Наклонная прямая AM', '#fde68a', -18);
        drawSegmentLabel(pM, pH, 'Ортогональная проекция HM на α', '#6ee7b7', 18);
        drawSegmentLabel(pA, pH, `Перпендикуляр AH`, '#fda4af', 16);

        drawPointMarker(pM, '#fff', 'Точка прокола M', 14);
        drawPointMarker(pH, '#34d399', 'H (90°)', 14);
        drawPointMarker(pA, '#fbbf24', 'A', -12);

        updateMetrics({
          'Угол (AM, α)': `Равен углу ∠AMH = ${da.inclineDeg}°`,
          'Формула синуса': `sin φ = AH / AM = ${Math.sin(phiRad).toFixed(3)}`,
          'Проекция HM': `AM · cos φ = ${projLen.toFixed(2)}`,
          'Перпендикуляр AH': `AM · sin φ = ${perpH.toFixed(2)} ✨`
        }, '5.2 Угол Прямой и Плоскости');
      } else if (da.subMode === 'dihedral_ang') {
        // 5.3 Dihedral angle between two planes alpha and beta (Linear angle AOB perp edge l)
        drawPlanePatch3D(alphaPts, '#38bdf8', 0.24, '#38bdf8', w, h);

        const phiRad = (da.inclineDeg * Math.PI) / 180;
        const wFlap = 1.55;
        const xEdge = -0.65;
        const betaPts = [
          { x: xEdge, y: yPlane, z: -s },
          { x: xEdge + wFlap * Math.cos(phiRad), y: yPlane + wFlap * Math.sin(phiRad), z: -s },
          { x: xEdge + wFlap * Math.cos(phiRad), y: yPlane + wFlap * Math.sin(phiRad), z: s },
          { x: xEdge, y: yPlane, z: s }
        ];
        drawPlanePatch3D(betaPts, '#c084fc', 0.28, '#c084fc', w, h);

        // Common edge l
        const E1 = project3D({ x: xEdge, y: yPlane, z: -s * 1.1 }, w, h);
        const E2 = project3D({ x: xEdge, y: yPlane, z: s * 1.1 }, w, h);
        drawLine(E1, E2, '#fbbf24', 4.5);
        drawSegmentLabel(E1, E2, 'Общее ребро пересечения l = α ∩ β', '#fde68a', -18);

        // Linear angle rays OA perp l in alpha, OB perp l in beta!
        const O3 = { x: xEdge, y: yPlane, z: 0.1 };
        const A3 = { x: xEdge + 1.15, y: yPlane, z: 0.1 };
        const B3 = { x: xEdge + 1.15 * Math.cos(phiRad), y: yPlane + 1.15 * Math.sin(phiRad), z: 0.1 };

        const pO = project3D(O3, w, h);
        const pA = project3D(A3, w, h);
        const pB = project3D(B3, w, h);

        drawLine(pO, pA, '#38bdf8', 4);
        drawLine(pO, pB, '#f43f5e', 4);
        drawRightAngleSquare(pO, E2, pA, 12, '#38bdf8');
        drawRightAngleSquare(pO, E2, pB, 12, '#f43f5e');
        drawAngleArc(pO, pA, pB, 42, '#34d399', `φ = ${da.inclineDeg}°`);

        drawSegmentLabel(pO, pA, 'Луч OA ⊥ l (в α)', '#7dd3fc', 16);
        drawSegmentLabel(pO, pB, 'Луч OB ⊥ l (в β)', '#fda4af', -16);
        drawPointMarker(pO, '#fff', 'Вершина линейного угла O ∈ l', 16);

        updateMetrics({
          'Общее ребро плоскостей': 'Прямая l = α ∩ β',
          'Как строить угол φ': 'Два перпендикуляра OA ⊥ l и OB ⊥ l!',
          'Линейный угол ∠AOB': `φ = ${da.inclineDeg}°`,
          'Через нормали плоскостей': 'cos φ = |n₁ · n₂| / (|n₁||n₂|) ✨'
        }, '5.3 Угол Между Плоскостями');
      } else {
        // 5.4 Area of Orthogonal Projection: S_proj = S_fig * cos(phi)!
        drawPlanePatch3D(alphaPts, '#38bdf8', 0.2, '#38bdf8', w, h);

        const phiRad = (da.inclineDeg * Math.PI) / 180;
        const cosPhi = Math.cos(phiRad);
        const sOrig = 100.0;
        const sProj = sOrig * cosPhi;

        // Triangle with base AB on plane alpha (along Z) and apex C tilted at angle phi!
        const A3 = { x: -0.75, y: yPlane, z: 0.85 };
        const B3 = { x: -0.75, y: yPlane, z: -0.85 };
        const lenH = 1.65;
        const C3_fig = { x: -0.75 + lenH * cosPhi, y: yPlane + lenH * Math.sin(phiRad), z: 0 };
        const C3_proj = { x: -0.75 + lenH * cosPhi, y: yPlane, z: 0 };

        // Draw Shadow/Projection Triangle A-B-C_proj on plane alpha (Emerald)
        drawPlanePatch3D([A3, B3, C3_proj], '#34d399', 0.42, '#34d399', w, h);

        // Draw Tilted Polygon/Triangle A-B-C_fig in 3D space (Rose/Amber)
        drawPlanePatch3D([A3, B3, C3_fig], '#f43f5e', 0.45, '#fbbf24', w, h);

        const pA = project3D(A3, w, h), pB = project3D(B3, w, h);
        const pC_fig = project3D(C3_fig, w, h), pC_proj = project3D(C3_proj, w, h);
        const pMidAB = project3D({ x: -0.75, y: yPlane, z: 0 }, w, h);

        // Vertical projection ray C_fig -> C_proj
        drawLine(pC_fig, pC_proj, '#fbbf24', 3, true);
        drawRightAngleSquare(pC_proj, pC_fig, pMidAB, 13, '#34d399');

        // Altitudes of figure and projection showing h_proj = h * cos(phi)
        drawLine(pMidAB, pC_fig, '#f43f5e', 3.5);
        drawLine(pMidAB, pC_proj, '#34d399', 3.5);
        if (da.inclineDeg > 5) {
          drawAngleArc(pMidAB, pC_proj, pC_fig, 38, '#fbbf24', `φ = ${da.inclineDeg}°`);
        }

        drawSegmentLabel(pMidAB, pC_fig, `Фигура: S = ${sOrig.toFixed(0)} ед²`, '#fda4af', -18);
        drawSegmentLabel(pMidAB, pC_proj, `Проекция (тень): Sпр = S·cos φ = ${sProj.toFixed(1)} ед²`, '#6ee7b7', 18);

        drawPointMarker(pC_fig, '#fbbf24', 'Вершина C наклонной фигуры', -14);
        drawPointMarker(pC_proj, '#34d399', "C' (проекция C на плоскость α)", 14);

        updateMetrics({
          'Площадь фигуры S': `${sOrig.toFixed(1)} ед²`,
          'Угол наклона φ и cos φ': `${da.inclineDeg}° (cos φ = ${cosPhi.toFixed(3)})`,
          'Площадь проекции S·cos φ': `${sProj.toFixed(1)} ед² ✨`,
          'Обратная формула (сечение)': 'S_сечения = S_проекции / cos φ'
        }, '5.4 Площадь Ортогональной Проекции');
      }
    }

    function renderVolumesSurfaces3D() {
      const vs = state.volSurf3d;
      const w = canvas.width, h = canvas.height;
      // Scale math units (1..5) to 3D viewport coordinates (-1.4..+1.4)
      const scale3 = 0.34;
      const a = vs.paramR;
      const H = vs.shape === 'sphere' ? 2 * a : vs.paramH;
      const fill = vs.fillLevel;

      const r3 = a * scale3;
      const h3 = H * scale3;
      const yBot = -h3 / 2;
      const yTop = h3 / 2;
      const yWater = yBot + h3 * fill;

      const draw3DFace = (pts3, fillColor, alpha, strokeColor = 'rgba(255,255,255,0.45)', lw = 1.5) => {
        const proj = pts3.map(p => project3D(p, w, h));
        ctx.beginPath();
        proj.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
        ctx.closePath();
        if (state.uiLayers.showFaces3D && alpha > 0) {
          ctx.fillStyle = fillColor;
          ctx.globalAlpha = alpha;
          ctx.fill();
          ctx.globalAlpha = 1.0;
        }
        if (state.uiLayers.showEdges3D) {
          ctx.strokeStyle = strokeColor;
          ctx.lineWidth = lw;
          ctx.stroke();
        }
      };

      const baseAlpha = vs.highlightPart === 'lateral' ? 0.08 : (vs.highlightPart === 'base' ? 0.65 : 0.35);
      const latAlpha = vs.highlightPart === 'base' ? 0.08 : (vs.highlightPart === 'lateral' ? 0.55 : 0.28);

      let sBase = 0, sLat = 0, sTotal = 0, vol = 0, extraInfo = '';

      if (vs.shape === 'box' || vs.shape === 'prism') {
        const nSides = vs.shape === 'box' ? 4 : 6;
        const startAng = vs.shape === 'box' ? Math.PI / 4 : 0;
        const radPoly = vs.shape === 'box' ? r3 * 0.85 : r3;

        const botRing = [], topRing = [], waterRing = [];
        for (let i = 0; i < nSides; i++) {
          const th = startAng + (2 * Math.PI * i) / nSides;
          const x = radPoly * Math.cos(th), z = radPoly * Math.sin(th);
          botRing.push({ x, y: yBot, z });
          topRing.push({ x, y: yTop, z });
          waterRing.push({ x, y: yWater, z });
        }

        // Draw Water Volume inside up to yWater
        if (fill > 0.01 && state.uiLayers.showFaces3D) {
          for (let i = 0; i < nSides; i++) {
            const nx = (i + 1) % nSides;
            draw3DFace([botRing[i], botRing[nx], waterRing[nx], waterRing[i]], '#06b6d4', 0.38, 'rgba(34,211,238,0.5)', 1);
          }
          draw3DFace(waterRing, '#22d3ee', 0.48, '#22d3ee', 2);
        }

        // Draw Base & Top (S_осн) in Emerald
        draw3DFace(botRing, '#34d399', baseAlpha, '#34d399', 2.2);
        draw3DFace(topRing, '#34d399', baseAlpha, '#34d399', 2.2);

        // Draw Lateral Faces (S_бок) in Blue
        for (let i = 0; i < nSides; i++) {
          const nx = (i + 1) % nSides;
          draw3DFace([botRing[i], botRing[nx], topRing[nx], topRing[i]], '#38bdf8', latAlpha, 'rgba(255,255,255,0.45)', 1.6);
        }

        // Dimension labels
        const pB0 = project3D(botRing[0], w, h);
        const pB1 = project3D(botRing[1], w, h);
        const pT1 = project3D(topRing[1], w, h);
        drawSegmentLabel(pB0, pB1, `Сторона a = ${a.toFixed(1)}`, '#6ee7b7', 16);
        drawSegmentLabel(pB1, pT1, `Высота H = ${H.toFixed(1)}`, '#7dd3fc', 18);

        if (vs.shape === 'box') {
          sBase = a * a;
          sLat = 4 * a * H;
          sTotal = 2 * sBase + sLat;
          vol = sBase * H;
          extraInfo = `Две крышки 2·Sосн = ${(2*sBase).toFixed(1)}`;
        } else {
          sBase = (3 * Math.sqrt(3) / 2) * a * a;
          sLat = 6 * a * H;
          sTotal = 2 * sBase + sLat;
          vol = sBase * H;
          extraInfo = `Периметр P = ${(6*a).toFixed(1)}`;
        }
      } else if (vs.shape === 'pyramid') {
        const halfA = r3 * 0.72;
        const botRing = [
          { x: -halfA, y: yBot, z: -halfA },
          { x: halfA, y: yBot, z: -halfA },
          { x: halfA, y: yBot, z: halfA },
          { x: -halfA, y: yBot, z: halfA }
        ];
        const apex = { x: 0, y: yTop, z: 0 };
        const centerBot = { x: 0, y: yBot, z: 0 };
        const midSide = { x: halfA, y: yBot, z: 0 };

        // Optional Bounding Prism to visually prove V_pyramid = 1/3 V_prism!
        if (vs.showBoundingCylinder) {
          const topRing = botRing.map(p => ({ x: p.x, y: yTop, z: p.z }));
          for (let i = 0; i < 4; i++) {
            const nx = (i + 1) % 4;
            drawLine(project3D(botRing[i], w, h), project3D(topRing[i], w, h), 'rgba(251, 191, 36, 0.35)', 1.5, true);
            drawLine(project3D(topRing[i], w, h), project3D(topRing[nx], w, h), 'rgba(251, 191, 36, 0.35)', 1.5, true);
          }
        }

        // Water fill inside pyramid
        if (fill > 0.01 && state.uiLayers.showFaces3D) {
          const kW = 1 - fill;
          const wRing = botRing.map(p => ({
            x: p.x * kW,
            y: yWater,
            z: p.z * kW
          }));
          for (let i = 0; i < 4; i++) {
            const nx = (i + 1) % 4;
            draw3DFace([botRing[i], botRing[nx], wRing[nx], wRing[i]], '#06b6d4', 0.38, 'rgba(34,211,238,0.4)', 1);
          }
          draw3DFace(wRing, '#22d3ee', 0.5, '#22d3ee', 2);
        }

        // Base square (S_осн)
        draw3DFace(botRing, '#34d399', baseAlpha, '#34d399', 2.4);

        // 4 Lateral triangular faces (S_бок)
        for (let i = 0; i < 4; i++) {
          const nx = (i + 1) % 4;
          draw3DFace([botRing[i], botRing[nx], apex], '#38bdf8', latAlpha, 'rgba(255,255,255,0.5)', 1.8);
        }

        // Highlight Inner Height H (red) and Slant Apothem l (amber) forming right triangle!
        const pApex = project3D(apex, w, h);
        const pCenter = project3D(centerBot, w, h);
        const pMid = project3D(midSide, w, h);

        drawLine(pApex, pCenter, '#f43f5e', 3.2);
        drawLine(pCenter, pMid, '#34d399', 2.5, true);
        drawLine(pApex, pMid, '#fbbf24', 3.5);
        drawRightAngleSquare(pCenter, pApex, pMid, 12, '#f43f5e');

        const apothem = Math.hypot(H, a / 2);
        drawSegmentLabel(pApex, pCenter, `Высота H = ${H.toFixed(1)}`, '#fda4af', -18);
        drawSegmentLabel(pApex, pMid, `Апофема l = ${apothem.toFixed(2)}`, '#fde68a', 18);
        drawSegmentLabel(project3D(botRing[1], w, h), project3D(botRing[2], w, h), `Сторона a = ${a.toFixed(1)}`, '#6ee7b7', 16);

        sBase = a * a;
        sLat = 2 * a * apothem;
        sTotal = sBase + sLat;
        vol = (1 / 3) * sBase * H;
        extraInfo = `Апофема l = ${apothem.toFixed(2)}`;
      } else if (vs.shape === 'cylinder' || vs.shape === 'cone') {
        const nSeg = 24;
        const botRing = [], topRing = [], waterRing = [];
        for (let i = 0; i < nSeg; i++) {
          const th = (2 * Math.PI * i) / nSeg;
          const x = r3 * Math.cos(th), z = r3 * Math.sin(th);
          botRing.push({ x, y: yBot, z });
          if (vs.shape === 'cylinder') {
            topRing.push({ x, y: yTop, z });
            waterRing.push({ x, y: yWater, z });
          } else {
            topRing.push({ x: 0, y: yTop, z: 0 });
            const kW = 1 - fill;
            waterRing.push({ x: x * kW, y: yWater, z: z * kW });
          }
        }

        // Optional Bounding Cylinder for Cone
        if (vs.shape === 'cone' && vs.showBoundingCylinder) {
          const cylTop = botRing.map(p => ({ x: p.x, y: yTop, z: p.z }));
          for (let i = 0; i < nSeg; i += 2) {
            const nx = (i + 2) % nSeg;
            drawLine(project3D(cylTop[i], w, h), project3D(cylTop[nx], w, h), 'rgba(251, 191, 36, 0.35)', 1.5, true);
          }
          drawLine(project3D(botRing[0], w, h), project3D(cylTop[0], w, h), 'rgba(251, 191, 36, 0.4)', 1.5, true);
          drawLine(project3D(botRing[12], w, h), project3D(cylTop[12], w, h), 'rgba(251, 191, 36, 0.4)', 1.5, true);
        }

        // Water Fill
        if (fill > 0.01 && state.uiLayers.showFaces3D) {
          draw3DFace(waterRing, '#22d3ee', 0.45, '#22d3ee', 2);
        }

        // Base Circle(s)
        draw3DFace(botRing, '#34d399', baseAlpha, '#34d399', 2.2);
        if (vs.shape === 'cylinder') {
          draw3DFace(topRing, '#34d399', baseAlpha, '#34d399', 2.2);
        }

        // Lateral strips
        for (let i = 0; i < nSeg; i++) {
          const nx = (i + 1) % nSeg;
          draw3DFace([botRing[i], botRing[nx], topRing[nx], topRing[i]], '#38bdf8', latAlpha * 0.75, 'rgba(255,255,255,0.18)', 1);
        }

        const pCenterBot = project3D({ x: 0, y: yBot, z: 0 }, w, h);
        const pCenterTop = project3D({ x: 0, y: yTop, z: 0 }, w, h);
        const pEdgeBot = project3D(botRing[0], w, h);
        const pEdgeTop = project3D(topRing[0], w, h);

        drawLine(pCenterBot, pEdgeBot, '#34d399', 3);
        drawLine(pCenterBot, pCenterTop, '#f43f5e', 3);
        drawLine(pEdgeBot, pEdgeTop, '#fbbf24', 3.5);
        drawRightAngleSquare(pCenterBot, pCenterTop, pEdgeBot, 12, '#f43f5e');

        drawSegmentLabel(pCenterBot, pEdgeBot, `R = ${a.toFixed(1)}`, '#6ee7b7', 15);
        drawSegmentLabel(pCenterBot, pCenterTop, `H = ${H.toFixed(1)}`, '#fda4af', -18);

        if (vs.shape === 'cylinder') {
          sBase = Math.PI * a * a;
          sLat = 2 * Math.PI * a * H;
          sTotal = 2 * sBase + sLat;
          vol = sBase * H;
          extraInfo = `Две крышки 2πR² = ${(2*sBase).toFixed(1)}`;
        } else {
          const slantL = Math.hypot(a, H);
          drawSegmentLabel(pEdgeBot, pEdgeTop, `Образующая l = ${slantL.toFixed(2)}`, '#fde68a', 18);
          sBase = Math.PI * a * a;
          sLat = Math.PI * a * slantL;
          sTotal = sBase + sLat;
          vol = (1 / 3) * sBase * H;
          extraInfo = `Образующая l = ${slantL.toFixed(2)}`;
        }
      } else {
        // SPHERE + Archimedes Bounding Cylinder (H = 2R)
        const radS = r3 * 0.95;
        if (vs.showBoundingCylinder) {
          const nSeg = 24;
          const bRing = [], tRing = [];
          for (let i = 0; i < nSeg; i++) {
            const th = (2 * Math.PI * i) / nSeg;
            bRing.push({ x: radS * Math.cos(th), y: -radS, z: radS * Math.sin(th) });
            tRing.push({ x: radS * Math.cos(th), y: radS, z: radS * Math.sin(th) });
          }
          draw3DFace(bRing, '#fbbf24', 0.1, 'rgba(251, 191, 36, 0.45)', 1.5);
          draw3DFace(tRing, '#fbbf24', 0.1, 'rgba(251, 191, 36, 0.45)', 1.5);
          drawLine(project3D(bRing[0], w, h), project3D(tRing[0], w, h), 'rgba(251, 191, 36, 0.45)', 1.5, true);
          drawLine(project3D(bRing[12], w, h), project3D(tRing[12], w, h), 'rgba(251, 191, 36, 0.45)', 1.5, true);
        }

        // Draw Sphere latitudes & longitudes
        const rings = 10, sectors = 16;
        for (let i = 0; i < rings; i++) {
          const phi1 = (Math.PI * i) / rings;
          const phi2 = (Math.PI * (i + 1)) / rings;
          for (let j = 0; j < sectors; j++) {
            const th1 = (2 * Math.PI * j) / sectors;
            const th2 = (2 * Math.PI * (j + 1)) / sectors;
            const quad = [
              { x: radS * Math.sin(phi1) * Math.cos(th1), y: radS * Math.cos(phi1), z: radS * Math.sin(phi1) * Math.sin(th1) },
              { x: radS * Math.sin(phi1) * Math.cos(th2), y: radS * Math.cos(phi1), z: radS * Math.sin(phi1) * Math.sin(th2) },
              { x: radS * Math.sin(phi2) * Math.cos(th2), y: radS * Math.cos(phi2), z: radS * Math.sin(phi2) * Math.sin(th2) },
              { x: radS * Math.sin(phi2) * Math.cos(th1), y: radS * Math.cos(phi2), z: radS * Math.sin(phi2) * Math.sin(th1) }
            ];
            const isFilled = (1 - i / rings) <= fill;
            draw3DFace(quad, isFilled ? '#06b6d4' : '#38bdf8', isFilled ? 0.42 : 0.18, 'rgba(255,255,255,0.22)', 1);
          }
        }

        const pO = project3D({ x: 0, y: 0, z: 0 }, w, h);
        const pR = project3D({ x: radS, y: 0, z: 0 }, w, h);
        drawLine(pO, pR, '#f43f5e', 3.5);
        drawSegmentLabel(pO, pR, `Радиус R = ${a.toFixed(1)}`, '#fda4af', -15);
        drawPointMarker(pO, '#fff', 'Центр O', 14);

        sBase = Math.PI * a * a; // Great circle area pi*R^2
        sLat = 4 * Math.PI * a * a;
        sTotal = sLat;
        vol = (4 / 3) * Math.PI * a * a * a;
        extraInfo = `Ровно 4 круга: 4·πR²`;
      }

      updateMetrics({
        'Площадь основания Sосн': `${sBase.toFixed(2)} ед²`,
        'Боковая поверхность Sбок': `${sLat.toFixed(2)} ед² (${extraInfo})`,
        'Полная поверхность Sполн': `${sTotal.toFixed(2)} ед²`,
        'Объём фигуры V': `${vol.toFixed(2)} ед³ ✨`
      }, 'Объём и Поверхность 3D');
    }

    function renderPlatonicSolids3D() {
      const pl = state.platonic;
      if (pl.selected === 'all5') {
        // Parade of all 5 Platonic solids arranged on canvas!
        const items = [
          { key: 'tetrahedron', label: '1. Тетраэдр (4)', sub: '🔥 Огонь (3×60°=180°)', ox: -280, oy: -105, scale: 0.42 },
          { key: 'cube', label: '2. Куб (6)', sub: '🌍 Земля (3×90°=270°)', ox: 0, oy: -105, scale: 0.45 },
          { key: 'octahedron', label: '3. Октаэдр (8)', sub: '💨 Воздух (4×60°=240°)', ox: 280, oy: -105, scale: 0.45 },
          { key: 'dodecahedron', label: '4. Додекаэдр (12)', sub: '🌌 Космос (3×108°=324°)', ox: -155, oy: 135, scale: 0.45 },
          { key: 'icosahedron', label: '5. Икосаэдр (20)', sub: '💧 Вода (5×60°=300°)', ox: 155, oy: 135, scale: 0.45 }
        ];

        items.forEach(it => {
          const geom = get3DGeometry(it.key);
          const cx = canvas.width / 2 + it.ox;
          const cy = canvas.height / 2 + it.oy;
          const proj = geom.vertices.map(v => {
            const p = project3D({ x: v.x * it.scale, y: v.y * it.scale, z: v.z * it.scale }, canvas.width, canvas.height);
            return { x: cx + (p.x - canvas.width / 2), y: cy + (p.y - canvas.height / 2), depth: p.depth };
          });

          const faceList = geom.faces.map((f, idx) => {
            let avgZ = 0;
            f.forEach(vIdx => avgZ += proj[vIdx].depth);
            return { face: f, depth: avgZ / f.length, color: geom.colors[idx % geom.colors.length] };
          });
          faceList.sort((a, b) => a.depth - b.depth);

          faceList.forEach(item => {
            ctx.beginPath();
            item.face.forEach((vIdx, i) => {
              const p = proj[vIdx];
              if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
            });
            ctx.closePath();
            ctx.fillStyle = item.color;
            ctx.globalAlpha = 0.42;
            ctx.fill();
            ctx.globalAlpha = 1.0;
            ctx.strokeStyle = 'rgba(255,255,255,0.55)';
            ctx.lineWidth = 1.3;
            ctx.stroke();
          });

          ctx.fillStyle = '#fff';
          ctx.font = 'bold 13px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(it.label, cx, cy + 95);
          ctx.fillStyle = '#fde68a';
          ctx.font = '11.5px sans-serif';
          ctx.fillText(it.sub, cx, cy + 113);
        });

        updateMetrics({
          'Всего тел во Вселенной': 'Строго 5 ✨',
          'Условие существования': 'Сумма углов в вершине < 360°',
          'Стихии Платона': 'Огонь, Земля, Воздух, Вода, Эфир',
          'Формула Эйлера V-E+F': 'Везде = 2!'
        }, 'Парад 5 Платоновых Тел');
        return;
      }

      // Single selected Platonic solid + optional Dual solid inside (connecting face centers!)
      renderStandard3DPoly(pl.selected);

      const geom = get3DGeometry(pl.selected);
      if (pl.showDual) {
        // Compute face centroids of the outer Platonic solid
        const centroids = geom.faces.map(face => {
          let sx = 0, sy = 0, sz = 0;
          face.forEach(vIdx => {
            sx += geom.vertices[vIdx].x;
            sy += geom.vertices[vIdx].y;
            sz += geom.vertices[vIdx].z;
          });
          return { x: sx / face.length, y: sy / face.length, z: sz / face.length };
        });

        const projC = centroids.map(c => project3D(c, canvas.width, canvas.height));

        // Two faces share an edge in the outer solid iff their centroids are connected in the dual solid!
        for (let i = 0; i < geom.faces.length; i++) {
          for (let j = i + 1; j < geom.faces.length; j++) {
            const f1 = geom.faces[i], f2 = geom.faces[j];
            let shared = 0;
            f1.forEach(v => { if (f2.includes(v)) shared++; });
            if (shared === 2) {
              drawLine(projC[i], projC[j], '#fbbf24', 2.6);
            }
          }
        }

        projC.forEach(p => {
          ctx.beginPath();
          ctx.arc(p.x, p.y, 4.5, 0, 2 * Math.PI);
          ctx.fillStyle = '#fbbf24';
          ctx.fill();
        });
      }

      // Top-left Visual Legend Card for Platonic Solid on Canvas
      const metaMap = {
        tetrahedron: { el: '🔥 Стихия Платона: ОГОНЬ', angle: 'В вершине: 3 треугольника × 60° = 180° (< 360°)', dual: 'Двойственное внутри: Тетраэдр (4 грани ➔ 4 вершины)' },
        cube:        { el: '🌍 Стихия Платона: ЗЕМЛЯ', angle: 'В вершине: 3 квадрата × 90° = 270° (< 360°)', dual: 'Двойственное внутри (жёлтое): Октаэдр (6 граней ➔ 6 вершин)' },
        octahedron:  { el: '💨 Стихия Платона: ВОЗДУХ', angle: 'В вершине: 4 треугольника × 60° = 240° (< 360°)', dual: 'Двойственное внутри (жёлтое): Куб (8 граней ➔ 8 вершин)' },
        dodecahedron:{ el: '🌌 Стихия Платона: КОСМОС (Вселенная)', angle: 'В вершине: 3 пятиугольника × 108° = 324° (< 360°)', dual: 'Двойственное внутри (жёлтое): Икосаэдр (12 граней ➔ 12 вершин)' },
        icosahedron: { el: '💧 Стихия Платона: ВОДА', angle: 'В вершине: 5 треугольников × 60° = 300° (< 360°)', dual: 'Двойственное внутри (жёлтое): Додекаэдр (20 граней ➔ 20 вершин)' }
      };
      const mInfo = metaMap[pl.selected];
      if (mInfo && state.uiLayers.showCanvasCard) {
        ctx.fillStyle = 'rgba(17, 24, 39, 0.92)';
        ctx.strokeStyle = '#fbbf24';
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        ctx.roundRect(16, 16, 415, 110, 12);
        ctx.fill();
        ctx.stroke();

        ctx.textAlign = 'left';
        ctx.font = 'bold 13px sans-serif';
        ctx.fillStyle = '#fbbf24';
        ctx.fillText(`🏛️ ПЛАТОНОВО ТЕЛО: ${geom.name.toUpperCase()}`, 28, 36);
        ctx.font = '12px sans-serif';
        ctx.fillStyle = '#fde68a';
        ctx.fillText(`• ${mInfo.el}`, 28, 58);
        ctx.fillStyle = '#7dd3fc';
        ctx.fillText(`• Откуда берётся: ${mInfo.angle}`, 28, 78);
        ctx.fillStyle = '#6ee7b7';
        ctx.fillText(`• ${mInfo.dual}`, 28, 98);
      }
    }

    function renderStandard3DPoly(shapeName) {
      const geom = get3DGeometry(shapeName);
      const proj = geom.vertices.map(v => project3D(v, canvas.width, canvas.height));

      const faceList = geom.faces.map((f, idx) => {
        let avgZ = 0;
        f.forEach(vIdx => avgZ += proj[vIdx].depth);
        return { face: f, depth: avgZ / f.length, color: geom.colors[idx % geom.colors.length] };
      });
      faceList.sort((a, b) => a.depth - b.depth);

      if (state.renderStyle3d !== 'wireframe' && state.uiLayers.showFaces3D) {
        faceList.forEach(item => {
          ctx.beginPath();
          item.face.forEach((vIdx, i) => {
            const p = proj[vIdx];
            if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
          });
          ctx.closePath();
          ctx.fillStyle = item.color;
          ctx.globalAlpha = state.renderStyle3d === 'solid_translucent' ? 0.35 : 0.85;
          ctx.fill();
          ctx.globalAlpha = 1.0;
          if (state.uiLayers.showEdges3D) {
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
            ctx.lineWidth = 1.5;
            ctx.stroke();
          }
        });
      } else if (state.uiLayers.showEdges3D) {
        geom.faces.forEach(face => {
          ctx.beginPath();
          face.forEach((vIdx, i) => {
            const p = proj[vIdx];
            if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
          });
          ctx.closePath();
          ctx.strokeStyle = '#38bdf8';
          ctx.lineWidth = 2;
          ctx.stroke();
        });
      }

      if (state.uiLayers.showVertices3D) {
        proj.forEach(p => {
          ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, 2 * Math.PI);
          ctx.fillStyle = '#fff'; ctx.fill();
        });
      }

      updateMetrics({
        'Фигура': geom.name,
        'Вершины (V)': geom.V,
        'Рёбра (E)': geom.E,
        'Грани (F)': geom.F,
        'Эйлер V - E + F': `${geom.V - geom.E + geom.F} ✨`
      }, 'Стереометрия 3D');
    }

    function renderRevolve3D() {
      const maxAngle = (state.revolveAngle * Math.PI) / 180;
      const steps = Math.max(4, Math.floor((state.revolveAngle / 360) * 24));
      const height = 1.3, radius = 1.1;

      const topAxis = project3D({ x: 0, y: height * 1.4, z: 0 }, canvas.width, canvas.height);
      const botAxis = project3D({ x: 0, y: -height * 1.4, z: 0 }, canvas.width, canvas.height);
      drawLine(topAxis, botAxis, '#f43f5e', 2.5, true);

      let profile2D = [];
      if (state.revolveShape === 'triangle') {
        profile2D = [{ x: 0, y: height }, { x: radius, y: -height }, { x: 0, y: -height }];
      } else if (state.revolveShape === 'rectangle') {
        profile2D = [{ x: 0, y: height }, { x: radius, y: height }, { x: radius, y: -height }, { x: 0, y: -height }];
      } else {
        for (let a = -Math.PI / 2; a <= Math.PI / 2; a += Math.PI / 8) {
          profile2D.push({ x: radius * Math.cos(a), y: radius * Math.sin(a) });
        }
      }

      for (let s = 0; s < steps; s++) {
        const th1 = (s / steps) * maxAngle;
        const th2 = ((s + 1) / steps) * maxAngle;
        for (let i = 0; i < profile2D.length - 1; i++) {
          const ptA = profile2D[i], ptB = profile2D[i + 1];
          const p1 = project3D({ x: ptA.x * Math.cos(th1), y: ptA.y, z: ptA.x * Math.sin(th1) }, canvas.width, canvas.height);
          const p2 = project3D({ x: ptA.x * Math.cos(th2), y: ptA.y, z: ptA.x * Math.sin(th2) }, canvas.width, canvas.height);
          const p3 = project3D({ x: ptB.x * Math.cos(th2), y: ptB.y, z: ptB.x * Math.sin(th2) }, canvas.width, canvas.height);
          const p4 = project3D({ x: ptB.x * Math.cos(th1), y: ptB.y, z: ptB.x * Math.sin(th1) }, canvas.width, canvas.height);

          ctx.beginPath();
          ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.lineTo(p3.x, p3.y); ctx.lineTo(p4.x, p4.y);
          ctx.closePath();
          ctx.fillStyle = s % 2 === 0 ? 'rgba(56, 189, 248, 0.35)' : 'rgba(99, 102, 241, 0.35)';
          ctx.fill();
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
          ctx.stroke();
        }
      }

      ctx.beginPath();
      profile2D.forEach((pt, i) => {
        const p = project3D({ x: pt.x * Math.cos(maxAngle), y: pt.y, z: pt.x * Math.sin(maxAngle) }, canvas.width, canvas.height);
        if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
      });
      ctx.closePath();
      ctx.fillStyle = 'rgba(251, 191, 36, 0.7)';
      ctx.fill();
      ctx.strokeStyle = '#fbbf24';
      ctx.lineWidth = 2.5;
      ctx.stroke();

      updateMetrics({
        'Тело вращения': state.revolveShape === 'triangle' ? 'Конус' : (state.revolveShape === 'rectangle' ? 'Цилиндр' : 'Шар'),
        'Угол поворота': `${state.revolveAngle}°`,
        'Ось вращения': 'Красная ось Y',
        'Формула объёма': state.revolveShape === 'triangle' ? 'V = ⅓ πR²H' : (state.revolveShape === 'rectangle' ? 'V = πR²H' : 'V = 4/3 πR³')
      }, 'Тела Вращения');
    }

    function renderSectionPlane3D() {
      const shapeKey = (state.domain === 'quests' && state.questId === 'quest_cube_hex')
        ? 'cube'
        : (state.currentShape3d === 'sphere' ? 'cube' : state.currentShape3d);
      const geom = get3DGeometry(shapeKey);
      const vertices = geom.vertices;

      // Extract unique edges from geom.faces
      const edgeSet = new Set();
      const edges = [];
      geom.faces.forEach(face => {
        for (let k = 0; k < face.length; k++) {
          const a = face[k], b = face[(k + 1) % face.length];
          const key = a < b ? `${a}_${b}` : `${b}_${a}`;
          if (!edgeSet.has(key)) {
            edgeSet.add(key);
            edges.push([a, b]);
          }
        }
      });

      const proj = vertices.map(v => project3D(v, canvas.width, canvas.height));

      // Draw translucent faces of the 3D figure for volume context
      geom.faces.forEach((face, idx) => {
        ctx.beginPath();
        face.forEach((vIdx, i) => {
          const p = proj[vIdx];
          if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
        });
        ctx.closePath();
        ctx.fillStyle = geom.colors[idx % geom.colors.length];
        ctx.globalAlpha = 0.12;
        ctx.fill();
        ctx.globalAlpha = 1.0;
      });

      edges.forEach(([i, j]) => drawLine(proj[i], proj[j], 'rgba(255, 255, 255, 0.42)', 1.6));

      // Plane normal (nx, ny, nz) normalized
      const pitch = state.sectionPlane.pitch, D = state.sectionPlane.height;
      const rawNx = Math.sin(pitch), rawNy = 1.0, rawNz = 0.75 * Math.sin(pitch);
      const nLen = Math.hypot(rawNx, rawNy, rawNz) || 1;
      const nx = rawNx / nLen, ny = rawNy / nLen, nz = rawNz / nLen;

      const rawCutPoints = [];
      edges.forEach(([i, j]) => {
        const v1 = vertices[i], v2 = vertices[j];
        const val1 = nx * v1.x + ny * v1.y + nz * v1.z - D;
        const val2 = nx * v2.x + ny * v2.y + nz * v2.z - D;
        if (val1 * val2 <= 0 && Math.abs(val1 - val2) > 1e-5) {
          const t = val1 / (val1 - val2);
          if (t >= -1e-4 && t <= 1.0001) {
            rawCutPoints.push({
              x: v1.x + t * (v2.x - v1.x),
              y: v1.y + t * (v2.y - v1.y),
              z: v1.z + t * (v2.z - v1.z)
            });
          }
        }
      });

      // Deduplicate intersection points (when plane passes through a vertex)
      const cutPoints = [];
      rawCutPoints.forEach(pt => {
        if (!cutPoints.some(q => Math.hypot(pt.x - q.x, pt.y - q.y, pt.z - q.z) < 0.03)) {
          cutPoints.push(pt);
        }
      });

      if (cutPoints.length >= 3) {
        let cx3 = 0, cy3 = 0, cz3 = 0;
        cutPoints.forEach(p => { cx3 += p.x; cy3 += p.y; cz3 += p.z; });
        cx3 /= cutPoints.length; cy3 /= cutPoints.length; cz3 /= cutPoints.length;

        // Orthonormal basis (u, w) on the cutting plane for exact cyclic sorting in 3D
        const ux = cutPoints[0].x - cx3, uy = cutPoints[0].y - cy3, uz = cutPoints[0].z - cz3;
        const wx = ny * uz - nz * uy, wy = nz * ux - nx * uz, wz = nx * uy - ny * ux;

        cutPoints.sort((a, b) => {
          const ax = a.x - cx3, ay = a.y - cy3, az = a.z - cz3;
          const bx = b.x - cx3, by = b.y - cy3, bz = b.z - cz3;
          const angA = Math.atan2(ax * wx + ay * wy + az * wz, ax * ux + ay * uy + az * uz);
          const angB = Math.atan2(bx * wx + by * wy + bz * wz, bx * ux + by * uy + bz * uz);
          return angA - angB;
        });

        const projCut = cutPoints.map(p => project3D(p, canvas.width, canvas.height));
        ctx.beginPath();
        projCut.forEach((p, idx) => idx === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
        ctx.closePath();
        ctx.fillStyle = 'rgba(52, 211, 153, 0.68)';
        ctx.fill();
        ctx.strokeStyle = '#34d399';
        ctx.lineWidth = 3.2;
        ctx.stroke();

        projCut.forEach(p => {
          ctx.beginPath();
          ctx.arc(p.x, p.y, 5, 0, 2 * Math.PI);
          ctx.fillStyle = '#fff';
          ctx.fill();
        });
      }

      const nV = cutPoints.length;
      let shapeLabel = 'Нет пересечения';
      if (shapeKey === 'cylinder' || shapeKey === 'cone') {
        shapeLabel = nV >= 8 ? (Math.abs(pitch) < 0.08 ? 'Круг ⭕' : 'Эллипс / Парабола 🥚') : (nV >= 3 ? `Срез (${nV} т.)` : 'Нет среза');
      } else {
        shapeLabel = nV === 3 ? 'Треугольник 🔺'
          : (nV === 4 ? 'Четырёхугольник 🔲'
          : (nV === 5 ? 'Пятиугольник ⬟'
          : (nV === 6 ? 'Шестиугольник ⬡ ✨'
          : (nV > 6 ? `${nV}-угольник ✨` : 'Нет среза'))));
      }

      updateMetrics({
        'Тело': geom.name,
        'Вершин в сечении': nV,
        'Фигура сечения': shapeLabel,
        'Высота / Наклон': `${D.toFixed(2)} / ${pitch.toFixed(2)}`
      }, `Сечение: ${geom.name}`);

      if (state.domain === 'quests' && state.questId === 'quest_cube_hex') {
        const el = document.getElementById('quest-cut-status');
        if (el) {
          el.innerText = nV === 6 ? '🎉 ПОБЕДА! В сечении куба получен шестиугольник!' : `Сейчас: ${shapeLabel}. Ищи 6 вершин!`;
          el.className = 'quest-status' + (nV === 6 ? ' success' : '');
        }
      }
    }

    function renderUnfolding3D() {
      const fold = (1 - state.unfoldProgress) * (Math.PI / 2);
      const s = 0.8;
      const drawPoly = (pts, col) => {
        ctx.beginPath();
        pts.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
        ctx.closePath();
        ctx.fillStyle = col;
        ctx.globalAlpha = 0.55;
        ctx.fill();
        ctx.globalAlpha = 1.0;
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.stroke();
      };

      drawPoly([{ x: -s, y: -s, z: -s }, { x: s, y: -s, z: -s }, { x: s, y: -s, z: s }, { x: -s, y: -s, z: s }].map(v => project3D(v, canvas.width, canvas.height)), '#38bdf8');
      drawPoly([{ x: -s, y: -s, z: s }, { x: s, y: -s, z: s }, { x: s, y: -s + 2*s*Math.sin(fold), z: s + 2*s*Math.cos(fold) }, { x: -s, y: -s + 2*s*Math.sin(fold), z: s + 2*s*Math.cos(fold) }].map(v => project3D(v, canvas.width, canvas.height)), '#f43f5e');
      drawPoly([{ x: -s, y: -s, z: -s }, { x: s, y: -s, z: -s }, { x: s, y: -s + 2*s*Math.sin(fold), z: -s - 2*s*Math.cos(fold) }, { x: -s, y: -s + 2*s*Math.sin(fold), z: -s - 2*s*Math.cos(fold) }].map(v => project3D(v, canvas.width, canvas.height)), '#34d399');
      drawPoly([{ x: -s, y: -s, z: -s }, { x: -s, y: -s, z: s }, { x: -s - 2*s*Math.cos(fold), y: -s + 2*s*Math.sin(fold), z: s }, { x: -s - 2*s*Math.cos(fold), y: -s + 2*s*Math.sin(fold), z: -s }].map(v => project3D(v, canvas.width, canvas.height)), '#fbbf24');
      drawPoly([{ x: s, y: -s, z: -s }, { x: s, y: -s, z: s }, { x: s + 2*s*Math.cos(fold), y: -s + 2*s*Math.sin(fold), z: s }, { x: s + 2*s*Math.cos(fold), y: -s + 2*s*Math.sin(fold), z: -s }].map(v => project3D(v, canvas.width, canvas.height)), '#818cf8');

      updateMetrics({
        'Раскрытие': `${Math.round(state.unfoldProgress * 100)}%`,
        'Угол сгиба': `${((1 - state.unfoldProgress) * 90).toFixed(1)}°`,
        'Площадь поверхности': 'S = 6 · a²',
        'Объём куба': 'V = a³'
      }, 'Развертка Куба');
    }

    function updateMetrics(dataObj, title) {
      const grid = document.getElementById('stat-grid');
      const titleEl = document.getElementById('overlay-title');
      if (title) titleEl.innerText = title;
      let html = '';
      for (const [k, v] of Object.entries(dataObj)) {
        html += `<div class="stat-item"><div class="stat-name">${k}</div><div class="stat-val">${v}</div></div>`;
      }
      grid.innerHTML = html;
    }

    function reset3DCamera() { state.camera.rotX = 0.45; state.camera.rotY = -0.65; state.camera.zoom = 1.0; }
    function toggleAutoRotate() {
      state.camera.autoRotate = !state.camera.autoRotate;
      const btn = document.getElementById('btn-autorotate');
      if (btn) {
        btn.style.background = state.camera.autoRotate ? 'var(--accent-blue)' : '';
        btn.style.color = state.camera.autoRotate ? '#000' : '#fff';
      }
    }
    function zoom3D(factor) { state.camera.zoom = Math.max(0.5, Math.min(2.5, state.camera.zoom * factor)); }

    // ==========================================
    // POINTER INTERACTION
    // ==========================================
    function getPointerPos(e) {
      const rect = canvas.getBoundingClientRect();
      const touch = (e.touches && e.touches[0]) || (e.changedTouches && e.changedTouches[0]);
      const clientX = touch ? touch.clientX : e.clientX;
      const clientY = touch ? touch.clientY : e.clientY;
      const scaleX = canvas.width / Math.max(1, rect.width);
      const scaleY = canvas.height / Math.max(1, rect.height);
      return {
        x: (clientX - rect.left) * scaleX,
        y: (clientY - rect.top) * scaleY
      };
    }

    function handlePointerDown(pos, hitRadius = 32) {
      if (state.domain === 'quests') {
        if (state.questId === 'quest_orthocenter' || state.questId === 'quest_euler_collapse') {
          for (let pt of [state.triangle.A, state.triangle.B, state.triangle.C]) {
            if (dist(pos, pt) < hitRadius) { state.draggedPoint = pt; return true; }
          }
        } else if (state.questId === 'quest_heron_bridge') {
          const cx = canvas.width / 2 - 20, yRiver = canvas.height / 2 + 55;
          const M = { x: cx + state.questsExtra.heronM_x, y: yRiver };
          if (dist(pos, M) < hitRadius + 10 || Math.abs(pos.y - yRiver) < 35) {
            state.draggedPoint = { type: 'heron_M', cx };
            state.questsExtra.heronM_x = Math.max(-220, Math.min(220, pos.x - cx));
            return true;
          }
        } else if (state.questId === 'quest_inscribed_quad') {
          if (dist(pos, state.questsExtra.quadD) < hitRadius + 6) {
            state.draggedPoint = state.questsExtra.quadD;
            return true;
          }
        } else if (state.questId === 'quest_perp_vectors') {
          const unit = 30;
          const ox = Math.round((canvas.width / 2 - 20) / unit) * unit;
          const oy = Math.round((canvas.height / 2 + 15) / unit) * unit;
          const O = { x: ox, y: oy };
          const tipA = { x: O.x + state.vectors2d.vecA.x, y: O.y + state.vectors2d.vecA.y };
          const tipB = { x: O.x + state.vectors2d.vecB.x, y: O.y + state.vectors2d.vecB.y };
          if (dist(pos, tipB) < hitRadius) { state.draggedPoint = { type: 'vec_tip', target: state.vectors2d.vecB, origin: O }; return true; }
          if (dist(pos, tipA) < hitRadius) { state.draggedPoint = { type: 'vec_tip', target: state.vectors2d.vecA, origin: O }; return true; }
        } else if (state.questId === 'quest_spider_cube' || state.questId === 'quest_shadow_3d' || state.questId === 'quest_dimensions') {
          state.camera.drag = true;
          state.camera.lastMouseX = pos.x;
          state.camera.lastMouseY = pos.y;
          state.camera.autoRotate = false;
          return true;
        } else if (state.questId === 'quest_thales') {
          const { radius, angleA, angleB, angleP } = state.circleChord;
          const O = { x: canvas.width / 2 - 20, y: canvas.height / 2 + 10 };
          const A = { x: O.x + radius * Math.cos(angleA), y: O.y + radius * Math.sin(angleA) };
          const B = { x: O.x + radius * Math.cos(angleB), y: O.y + radius * Math.sin(angleB) };
          const P = { x: O.x + radius * Math.cos(angleP), y: O.y + radius * Math.sin(angleP) };
          if (dist(pos, P) < hitRadius) { state.draggedPoint = { type: 'circle', id: 'P' }; return true; }
          if (dist(pos, A) < hitRadius) { state.draggedPoint = { type: 'circle', id: 'A' }; return true; }
          if (dist(pos, B) < hitRadius) { state.draggedPoint = { type: 'circle', id: 'B' }; return true; }
        } else if (state.questId === 'quest_cube_hex') {
          state.camera.drag = true;
          state.camera.lastMouseX = pos.x;
          state.camera.lastMouseY = pos.y;
          state.camera.autoRotate = false;
          return true;
        } else if (state.questId === 'quest_isoperimetric') {
          state.draggedPoint = { type: 'dido_scrub', startX: pos.x, startVal: state.dido.morphProgress };
          state.dido.autoAnimate = false;
          return true;
        }
      } else if (state.domain === '2d') {
        if (state.mode2d === 'vectors_2d') {
          const v2 = state.vectors2d;
          const unit = 30;
          const ox = Math.round((canvas.width / 2 - 20) / unit) * unit;
          const oy = Math.round((canvas.height / 2 + 15) / unit) * unit;

          if (v2.subMode === 'basics') {
            const A = { x: ox + v2.baseA.x, y: oy + v2.baseA.y };
            const B = { x: A.x + v2.vecA.x, y: A.y + v2.vecA.y };
            if (dist(pos, B) < hitRadius) { state.draggedPoint = { type: 'vec_basics_B', ox, oy }; return true; }
            if (dist(pos, A) < hitRadius) { state.draggedPoint = { type: 'vec_basics_A', ox, oy }; return true; }
          } else if (v2.subMode === 'addition') {
            const O = { x: ox - 70, y: oy + 40 };
            const tipA = { x: O.x + v2.vecA.x, y: O.y + v2.vecA.y };
            const tipB = { x: O.x + v2.vecB.x, y: O.y + v2.vecB.y };
            if (dist(pos, tipA) < hitRadius) { state.draggedPoint = { type: 'vec_tip', target: v2.vecA, origin: O }; return true; }
            if (dist(pos, tipB) < hitRadius) { state.draggedPoint = { type: 'vec_tip', target: v2.vecB, origin: O }; return true; }
          } else if (v2.subMode === 'sub_scalar') {
            const O1 = { x: ox - 160, y: oy + 30 };
            const tipA = { x: O1.x + v2.vecA.x, y: O1.y + v2.vecA.y };
            const tipB = { x: O1.x + v2.vecB.x, y: O1.y + v2.vecB.y };
            if (dist(pos, tipA) < hitRadius) { state.draggedPoint = { type: 'vec_tip', target: v2.vecA, origin: O1 }; return true; }
            if (dist(pos, tipB) < hitRadius) { state.draggedPoint = { type: 'vec_tip', target: v2.vecB, origin: O1 }; return true; }
          } else if (v2.subMode === 'dot_product') {
            const O = { x: ox, y: oy };
            const tipA = { x: O.x + v2.vecA.x, y: O.y + v2.vecA.y };
            const tipB = { x: O.x + v2.vecB.x, y: O.y + v2.vecB.y };
            if (dist(pos, tipA) < hitRadius) { state.draggedPoint = { type: 'vec_tip', target: v2.vecA, origin: O }; return true; }
            if (dist(pos, tipB) < hitRadius) { state.draggedPoint = { type: 'vec_tip', target: v2.vecB, origin: O }; return true; }
          } else if (v2.subMode === 'geom_apps') {
            const O = { x: ox - 140, y: oy + 110 };
            const A = { x: O.x + v2.vecA.x * 1.4, y: O.y + v2.vecA.y * 1.4 };
            const B = { x: O.x + v2.vecB.x * 1.6 + 110, y: O.y + v2.vecB.y * 0.4 - 20 };
            if (dist(pos, A) < hitRadius) { state.draggedPoint = { type: 'vec_geom_A', origin: O }; return true; }
            if (dist(pos, B) < hitRadius) { state.draggedPoint = { type: 'vec_geom_B', origin: O }; return true; }
          }
        }
        if (state.mode2d === 'triangles_lines' || state.mode2d === 'sine_cosine_laws') {
          for (let pt of [state.triangle.A, state.triangle.B, state.triangle.C]) {
            if (dist(pos, pt) < hitRadius) { state.draggedPoint = pt; return true; }
          }
        } else if (state.mode2d === 'circles_helper' && state.circleChord.subMode === 'tangent_anatomy') {
          if (dist(pos, state.circleChord.extM) < hitRadius) {
            state.draggedPoint = state.circleChord.extM;
            return true;
          }
        } else if (state.mode2d === 'inscribed_central_2d' || (state.mode2d === 'circles_helper' && state.circleChord.subMode === 'inscribed_right')) {
          const r = state.mode2d === 'inscribed_central_2d' ? 165 : state.circleChord.radius;
          const { angleA, angleB, angleP } = state.circleChord;
          const O = { x: canvas.width / 2 - 20, y: canvas.height / 2 + (state.mode2d === 'inscribed_central_2d' ? 15 : 10) };
          const A = { x: O.x + r * Math.cos(angleA), y: O.y + r * Math.sin(angleA) };
          const B = { x: O.x + r * Math.cos(angleB), y: O.y + r * Math.sin(angleB) };
          const P = { x: O.x + r * Math.cos(angleP), y: O.y + r * Math.sin(angleP) };
          if (dist(pos, P) < hitRadius) { state.draggedPoint = { type: 'circle', id: 'P' }; return true; }
          if (dist(pos, A) < hitRadius) { state.draggedPoint = { type: 'circle', id: 'A' }; return true; }
          if (dist(pos, B) < hitRadius) { state.draggedPoint = { type: 'circle', id: 'B' }; return true; }
        }
      } else {
        state.camera.drag = true;
        state.camera.lastMouseX = pos.x;
        state.camera.lastMouseY = pos.y;
        state.camera.autoRotate = false;
        return true;
      }
      return false;
    }

    function handlePointerMove(pos) {
      if (state.draggedPoint) {
        if (state.draggedPoint.type === 'heron_M') {
          state.questsExtra.heronM_x = Math.max(-220, Math.min(220, Math.round(pos.x - state.draggedPoint.cx)));
        } else if (state.draggedPoint.type === 'vec_basics_A') {
          state.vectors2d.baseA.x = pos.x - state.draggedPoint.ox;
          state.vectors2d.baseA.y = pos.y - state.draggedPoint.oy;
        } else if (state.draggedPoint.type === 'vec_basics_B') {
          const A = { x: state.draggedPoint.ox + state.vectors2d.baseA.x, y: state.draggedPoint.oy + state.vectors2d.baseA.y };
          state.vectors2d.vecA.x = Math.round((pos.x - A.x) / 15) * 15;
          state.vectors2d.vecA.y = Math.round((pos.y - A.y) / 15) * 15;
        } else if (state.draggedPoint.type === 'vec_tip') {
          state.draggedPoint.target.x = Math.round((pos.x - state.draggedPoint.origin.x) / 15) * 15;
          state.draggedPoint.target.y = Math.round((pos.y - state.draggedPoint.origin.y) / 15) * 15;
        } else if (state.draggedPoint.type === 'vec_geom_A') {
          state.vectors2d.vecA.x = (pos.x - state.draggedPoint.origin.x) / 1.4;
          state.vectors2d.vecA.y = (pos.y - state.draggedPoint.origin.y) / 1.4;
        } else if (state.draggedPoint.type === 'vec_geom_B') {
          state.vectors2d.vecB.x = (pos.x - state.draggedPoint.origin.x - 110) / 1.6;
          state.vectors2d.vecB.y = (pos.y - state.draggedPoint.origin.y + 20) / 0.4;
        } else if (state.draggedPoint.type === 'dido_scrub') {
          const delta = (pos.x - state.draggedPoint.startX) / (canvas.width * 0.45);
          state.dido.morphProgress = Math.max(0, Math.min(1, state.draggedPoint.startVal + delta));
