    function reset3DCamera() { state.camera.rotX = 0.45; state.camera.rotY = -0.65; state.camera.zoom = 1.0; }
    function toggleAutoRotate() {
      state.camera.autoRotate = !state.camera.autoRotate;
      const btn = document.getElementById('btn-autorotate');
      if (btn) {
        btn.style.background = state.camera.autoRotate ? 'var(--accent-blue)' : '';
        btn.style.color = state.camera.autoRotate ? '#000' : '#fff';
      }
    }
    function zoom3D(factor) { state.camera.zoom = Math.max(0.5, Math.min(2.5, state.camera.zoom * factor)); }

    // ==========================================
    // POINTER INTERACTION
    // ==========================================
    function getPointerPos(e) {
      const rect = canvas.getBoundingClientRect();
      const touch = (e.touches && e.touches[0]) || (e.changedTouches && e.changedTouches[0]);
      const clientX = touch ? touch.clientX : e.clientX;
      const clientY = touch ? touch.clientY : e.clientY;
      const scaleX = canvas.width / Math.max(1, rect.width);
      const scaleY = canvas.height / Math.max(1, rect.height);
      return {
        x: (clientX - rect.left) * scaleX,
        y: (clientY - rect.top) * scaleY
      };
    }

    function handlePointerDown(pos, hitRadius = 32) {
      if (state.domain === 'quests') {
        if (state.questId === 'quest_orthocenter') {
          for (let pt of [state.triangle.A, state.triangle.B, state.triangle.C]) {
            if (dist(pos, pt) < hitRadius) { state.draggedPoint = pt; return true; }
          }
        } else if (state.questId === 'quest_thales') {
          const { radius, angleA, angleB, angleP } = state.circleChord;
          const O = { x: canvas.width / 2 - 20, y: canvas.height / 2 + 10 };
          const A = { x: O.x + radius * Math.cos(angleA), y: O.y + radius * Math.sin(angleA) };
          const B = { x: O.x + radius * Math.cos(angleB), y: O.y + radius * Math.sin(angleB) };
          const P = { x: O.x + radius * Math.cos(angleP), y: O.y + radius * Math.sin(angleP) };
          if (dist(pos, P) < hitRadius) { state.draggedPoint = { type: 'circle', id: 'P' }; return true; }
          if (dist(pos, A) < hitRadius) { state.draggedPoint = { type: 'circle', id: 'A' }; return true; }
          if (dist(pos, B) < hitRadius) { state.draggedPoint = { type: 'circle', id: 'B' }; return true; }
        } else if (state.questId === 'quest_cube_hex') {
          state.camera.drag = true;
          state.camera.lastMouseX = pos.x;
          state.camera.lastMouseY = pos.y;
          state.camera.autoRotate = false;
          return true;
        } else if (state.questId === 'quest_isoperimetric') {
          state.draggedPoint = { type: 'dido_scrub', startX: pos.x, startVal: state.dido.morphProgress };
          state.dido.autoAnimate = false;
          return true;
        }
      } else if (state.domain === '2d') {
        if (state.mode2d === 'triangles_lines' || state.mode2d === 'sine_cosine_laws') {
          for (let pt of [state.triangle.A, state.triangle.B, state.triangle.C]) {
            if (dist(pos, pt) < hitRadius) { state.draggedPoint = pt; return true; }
          }
        } else if (state.mode2d === 'circles_helper' && state.circleChord.subMode === 'tangent_anatomy') {
          if (dist(pos, state.circleChord.extM) < hitRadius) {
            state.draggedPoint = state.circleChord.extM;
            return true;
          }
        } else if (state.mode2d === 'inscribed_central_2d' || (state.mode2d === 'circles_helper' && state.circleChord.subMode === 'inscribed_right')) {
          const r = state.mode2d === 'inscribed_central_2d' ? 165 : state.circleChord.radius;
          const { angleA, angleB, angleP } = state.circleChord;
          const O = { x: canvas.width / 2 - 20, y: canvas.height / 2 + (state.mode2d === 'inscribed_central_2d' ? 15 : 10) };
          const A = { x: O.x + r * Math.cos(angleA), y: O.y + r * Math.sin(angleA) };
          const B = { x: O.x + r * Math.cos(angleB), y: O.y + r * Math.sin(angleB) };
          const P = { x: O.x + r * Math.cos(angleP), y: O.y + r * Math.sin(angleP) };
          if (dist(pos, P) < hitRadius) { state.draggedPoint = { type: 'circle', id: 'P' }; return true; }
          if (dist(pos, A) < hitRadius) { state.draggedPoint = { type: 'circle', id: 'A' }; return true; }
          if (dist(pos, B) < hitRadius) { state.draggedPoint = { type: 'circle', id: 'B' }; return true; }
        }
      } else {
        state.camera.drag = true;
        state.camera.lastMouseX = pos.x;
        state.camera.lastMouseY = pos.y;
        state.camera.autoRotate = false;
        return true;
      }
      return false;
    }

    function handlePointerMove(pos) {
      if (state.draggedPoint) {
        if (state.draggedPoint.type === 'dido_scrub') {
          const delta = (pos.x - state.draggedPoint.startX) / (canvas.width * 0.45);
          state.dido.morphProgress = Math.max(0, Math.min(1, state.draggedPoint.startVal + delta));
          const slider = document.getElementById('dido-slider');
          if (slider) slider.value = state.dido.morphProgress;
          const valSpan = document.getElementById('dido-progress-val');
          if (valSpan) valSpan.innerText = Math.round(state.dido.morphProgress * 100) + '%';
        } else if (state.draggedPoint.type === 'circle') {
          const cx = canvas.width / 2 - 20, cy = canvas.height / 2 + 10;
          const ang = Math.atan2(pos.y - cy, pos.x - cx);
          if (state.draggedPoint.id === 'P') state.circleChord.angleP = ang;
          else if (state.draggedPoint.id === 'A') state.circleChord.angleA = ang;
          else if (state.draggedPoint.id === 'B') state.circleChord.angleB = ang;
        } else {
          state.draggedPoint.x = Math.max(30, Math.min(canvas.width - 30, pos.x));
          state.draggedPoint.y = Math.max(30, Math.min(canvas.height - 30, pos.y));
        }
        return;
      }

      if (state.camera.drag) {
        const dx = pos.x - state.camera.lastMouseX;
        const dy = pos.y - state.camera.lastMouseY;
        state.camera.rotY += dx * 0.007;
        state.camera.rotX = Math.max(-1.4, Math.min(1.4, state.camera.rotX - dy * 0.007));
        state.camera.lastMouseX = pos.x;
        state.camera.lastMouseY = pos.y;
      }
    }

    function handlePointerUp() {
      state.draggedPoint = null;
      state.camera.drag = false;
    }

    canvas.addEventListener('mousedown', (e) => {
      handlePointerDown(getPointerPos(e), 28);
    });

    window.addEventListener('mousemove', (e) => {
      handlePointerMove(getPointerPos(e));
    });

    window.addEventListener('mouseup', handlePointerUp);

    // Full Touch & Pinch-to-Zoom Support for Smartphones and Tablets
    let lastPinchDist = 0;
    canvas.addEventListener('touchstart', (e) => {
      if (e.touches.length === 2) {
        e.preventDefault();
        state.camera.drag = false;
        state.draggedPoint = null;
        lastPinchDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        return;
      }
      if (handlePointerDown(getPointerPos(e), 42)) {
        e.preventDefault();
      }
    }, { passive: false });

    canvas.addEventListener('touchmove', (e) => {
      if (e.touches.length === 2) {
        e.preventDefault();
        const curDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        if (lastPinchDist > 10) {
          const factor = curDist / lastPinchDist;
          zoom3D(factor);
        }
        lastPinchDist = curDist;
        return;
      }
      if (state.draggedPoint || state.camera.drag) {
        e.preventDefault();
        handlePointerMove(getPointerPos(e));
      }
    }, { passive: false });

    canvas.addEventListener('touchend', () => {
      lastPinchDist = 0;
      handlePointerUp();
    });

    canvas.addEventListener('wheel', (e) => {
      if (state.domain === '3d' || (state.domain === 'quests' && state.questId === 'quest_cube_hex')) {
        e.preventDefault();
        zoom3D(e.deltaY < 0 ? 1.08 : 0.92);
      }
    }, { passive: false });

    function renderQuestOrthocenterScene() {
      const { A, B, C } = state.triangle;
      const { a, b, c, angA, angB, angC } = getTriangleAngles(A, B, C);
      const H = getOrthocenter(A, B, C);

      const footA = projectPointOnLine(A, B, C);
      const footB = projectPointOnLine(B, A, C);
      const footC = projectPointOnLine(C, A, B);

      // Dashed extensions of sides and altitudes to Orthocenter H
      drawLine(B, footA, 'rgba(56, 189, 248, 0.35)', 1.5, true);
      drawLine(A, footB, 'rgba(56, 189, 248, 0.35)', 1.5, true);
      drawLine(A, footC, 'rgba(56, 189, 248, 0.35)', 1.5, true);

      drawLine(A, footA, '#38bdf8', 2.8);
      drawLine(B, footB, '#38bdf8', 2.8);
      drawLine(C, footC, '#38bdf8', 2.8);

      drawLine(footA, H, 'rgba(244, 63, 94, 0.65)', 2, true);
      drawLine(footB, H, 'rgba(244, 63, 94, 0.65)', 2, true);
      drawLine(footC, H, 'rgba(244, 63, 94, 0.65)', 2, true);

      drawRightAngleSquare(footC, C, B, 12, '#38bdf8');
      drawRightAngleSquare(footA, A, C, 12, '#38bdf8');
      drawRightAngleSquare(footB, B, C, 12, '#38bdf8');

      // Triangle body
      ctx.beginPath();
      ctx.moveTo(A.x, A.y); ctx.lineTo(B.x, B.y); ctx.lineTo(C.x, C.y);
      ctx.closePath();
      const isObtuse = (angA > 90.5 || angB > 90.5 || angC > 90.5);
      ctx.fillStyle = isObtuse ? 'rgba(52, 211, 153, 0.14)' : 'rgba(255, 255, 255, 0.06)';
      ctx.fill();
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2.8;
      ctx.stroke();

      drawAngleArc(A, B, C, 32, '#f43f5e', `α=${angA.toFixed(0)}°`);
      drawAngleArc(B, C, A, 32, '#38bdf8', `β=${angB.toFixed(0)}°`);
      drawAngleArc(C, A, B, 32, '#34d399', `γ=${angC.toFixed(0)}°`);

      // Clamp H display if it goes near canvas edge so user always sees where Orthocenter H is!
      const clampedH = {
        x: Math.max(45, Math.min(canvas.width - 240, H.x)),
        y: Math.max(45, Math.min(canvas.height - 45, H.y))
      };
      drawPointMarker(clampedH, '#f43f5e', isObtuse ? '🎯 ОРТОЦЕНТР H (СНАРУЖИ!)' : 'ОРТОЦЕНТР H (внутри треугольника)', -14);

      drawDraggableHandle(A);
      drawDraggableHandle(B);
      drawDraggableHandle(C);

      const label = document.getElementById('quest-status-label');
      if (label) {
        label.innerText = isObtuse
          ? '🎉 УСПЕХ! В тупоугольном треугольнике ортоцентр H (пересечение высот) вылетает наружу!'
          : 'Сейчас все углы острые (<90°), поэтому ортоцентр H внутри. Потяни вершину, чтобы сделать угол тупым!';
        label.className = 'quest-status' + (isObtuse ? ' success' : '');
      }

      updateMetrics({
        'Углы треугольника': `${angA.toFixed(0)}°, ${angB.toFixed(0)}°, ${angC.toFixed(0)}°`,
        'Максимальный угол': `${Math.max(angA, angB, angC).toFixed(1)}°`,
        'Ортоцентр H (высоты)': isObtuse ? 'СНАРУЖИ треугольника 🎉' : 'Внутри треугольника',
        'Координаты H': `(${Math.round(H.x)}, ${Math.round(H.y)})`
      }, 'Квест 1: Ортоцентр H');
    }

    function toggleDidoAnim() {
      state.dido.autoAnimate = !state.dido.autoAnimate;
      renderSidebar();
    }

    function setDidoStep(val) {
      state.dido.autoAnimate = false;
      state.dido.morphProgress = val;
      renderSidebar();
    }

    // Generate point on regular N-gon of fixed perimeter P_px at angle theta in [0, 2*pi)
    function getPolygonPointAtAngle(theta, N, P_px) {
      // Side length a = P_px / N
      // Inradius (apothem) r_in = a / (2 * tan(pi / N))
      const dAng = (2 * Math.PI) / N;
      const a = P_px / N;
      const rIn = a / (2 * Math.tan(Math.PI / N));
      // Find which sector theta belongs to (rotated by -pi/2 so top vertex/edge looks upright)
      let rel = theta + Math.PI / 2;
      while (rel < 0) rel += 2 * Math.PI;
      while (rel >= 2 * Math.PI) rel -= 2 * Math.PI;
      const sectorIdx = Math.floor(rel / dAng);
      const localAng = rel - (sectorIdx + 0.5) * dAng; // in [-dAng/2, +dAng/2]
      const rad = rIn / Math.cos(localAng);
      return {
        x: rad * Math.cos(theta),
        y: rad * Math.sin(theta)
      };
    }

    function renderQuestDidoScene() {
      const d = state.dido;

      // Advance smooth auto-animation if active
      if (d.autoAnimate) {
        d.morphProgress += 0.0032 * d.animDir;
        if (d.morphProgress >= 1.0) {
          d.morphProgress = 1.0;
          d.animDir = -1;
        } else if (d.morphProgress <= 0.0) {
          d.morphProgress = 0.0;
          d.animDir = 1;
        }
        const slider = document.getElementById('dido-slider');
        if (slider) slider.value = d.morphProgress;
        const valSpan = document.getElementById('dido-progress-val');
        if (valSpan) valSpan.innerText = Math.round(d.morphProgress * 100) + '%';
      }

      const t = d.morphProgress; // 0 -> N=3, 0.25 -> N=4, 0.5 -> N=5, 0.75 -> N=6, 1.0 -> Circle
      const stages = [
        { n: 3, name: 'Правильный треугольник (3 угла)', area: 481.1, color: '#f43f5e' },
        { n: 4, name: 'Квадрат (4 угла)', area: 625.0, color: '#fbbf24' },
        { n: 5, name: 'Правильный пятиугольник (5 углов)', area: 688.2, color: '#38bdf8' },
        { n: 6, name: 'Правильный шестиугольник (6 углов)', area: 721.7, color: '#818cf8' },
        { n: 48, name: 'Идеальный Круг (Максимум площади!)', area: 795.8, color: '#34d399' }
      ];

      const scaled = t * (stages.length - 1);
      const idx0 = Math.min(stages.length - 2, Math.floor(scaled));
      const idx1 = idx0 + 1;
      const frac = scaled - idx0;
      const st0 = stages[idx0], st1 = stages[idx1];

      const curArea = st0.area * (1 - frac) + st1.area * frac;
      const activeStage = frac < 0.5 ? st0 : st1;

      const cx = canvas.width * 0.34;
      const cy = canvas.height * 0.53;
      const P_px = 960; // Visual perimeter in pixels corresponding to P = 100 m
      const R_circle_px = P_px / (2 * Math.PI); // ~152.8 px

      // Draw dashed reference circle of maximum possible area
      ctx.beginPath();
      if (d.seaShoreMode) {
        // Sea coast at y = cy + 95, semicircle of radius R_semi = R_circle_px * 1.35
        const yCoast = cy + 95;
        // Draw blue sea waves at bottom
        ctx.fillStyle = 'rgba(14, 165, 233, 0.22)';
        ctx.fillRect(40, yCoast, canvas.width * 0.56, 90);
        drawLine({ x: 40, y: yCoast }, { x: 40 + canvas.width * 0.56, y: yCoast }, '#38bdf8', 4);
        if (state.uiLayers.showLabels) {
          ctx.fillStyle = '#7dd3fc';
          ctx.font = 'bold 13px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('🌊 Берег Средиземного моря (верёвка здесь не нужна!)', cx, yCoast + 32);
        }

        const rSemi = R_circle_px * 1.42;
        ctx.beginPath();
        ctx.arc(cx, yCoast, rSemi, Math.PI, 2 * Math.PI);
        ctx.closePath();
        ctx.fillStyle = 'rgba(52, 211, 153, 0.28)';
        ctx.fill();
        ctx.strokeStyle = '#fbbf24';
        ctx.lineWidth = 4;
        ctx.stroke();

        if (state.uiLayers.showLabels) {
          ctx.fillStyle = '#fde68a';
          ctx.font = 'bold 15px sans-serif';
          ctx.fillText('Полукруг Дидоны: L = πR = 100 м', cx, yCoast - rSemi - 16);
          ctx.fillStyle = '#6ee7b7';
          ctx.font = 'bold 17px sans-serif';
          ctx.fillText('Площадь S = L² / (2π) ≈ 1591.5 м² (В 2 РАЗА БОЛЬШЕ!)', cx, yCoast - rSemi / 2);
        }
      } else {
        ctx.arc(cx, cy, R_circle_px, 0, 2 * Math.PI);
        ctx.strokeStyle = 'rgba(52, 211, 153, 0.25)';
        ctx.lineWidth = 2;
        ctx.setLineDash([6, 6]);
        ctx.stroke();
        ctx.setLineDash([]);

        // Morphing closed rope of constant perimeter P = 100 m!
        const numSamples = 180;
        const polyPts = [];
        for (let i = 0; i < numSamples; i++) {
          const theta = (2 * Math.PI * i) / numSamples;
          const p0 = st0.n >= 40
            ? { x: R_circle_px * Math.cos(theta), y: R_circle_px * Math.sin(theta) }
            : getPolygonPointAtAngle(theta, st0.n, P_px);
          const p1 = st1.n >= 40
            ? { x: R_circle_px * Math.cos(theta), y: R_circle_px * Math.sin(theta) }
            : getPolygonPointAtAngle(theta, st1.n, P_px);
          polyPts.push({
            x: cx + p0.x * (1 - frac) + p1.x * frac,
            y: cy + p0.y * (1 - frac) + p1.y * frac
          });
        }

        // Draw internal territory grid inside the morphing rope!
        ctx.save();
        ctx.beginPath();
        polyPts.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
        ctx.closePath();
        ctx.fillStyle = activeStage.color + '33';
        ctx.fill();
        ctx.clip();

        ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
        ctx.lineWidth = 1;
        const gStep = 22;
        for (let gx = cx - 220; gx <= cx + 220; gx += gStep) {
          ctx.beginPath(); ctx.moveTo(gx, cy - 220); ctx.lineTo(gx, cy + 220); ctx.stroke();
        }
        for (let gy = cy - 220; gy <= cy + 220; gy += gStep) {
          ctx.beginPath(); ctx.moveTo(cx - 220, gy); ctx.lineTo(cx + 220, gy); ctx.stroke();
        }
        ctx.restore();

        // Draw the golden rope perimeter
        ctx.beginPath();
        polyPts.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
        ctx.closePath();
        ctx.strokeStyle = activeStage.color;
        ctx.lineWidth = 4;
        ctx.stroke();

        // Highlight vertices if near an integer polygon stage
        if (activeStage.n <= 6 && (frac < 0.15 || frac > 0.85)) {
          const nV = activeStage.n;
          for (let k = 0; k < nV; k++) {
            const vAng = -Math.PI / 2 + (2 * Math.PI * k) / nV;
            const vp = getPolygonPointAtAngle(vAng, nV, P_px);
            ctx.beginPath();
            ctx.arc(cx + vp.x, cy + vp.y, 6, 0, 2 * Math.PI);
            ctx.fillStyle = '#fff';
            ctx.fill();
          }
        }

        if (state.uiLayers.showLabels) {
          ctx.fillStyle = '#fff';
          ctx.font = 'bold 15px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(activeStage.name, cx, cy - R_circle_px - 32);
          ctx.fillStyle = '#fde68a';
          ctx.font = 'bold 14px sans-serif';
          ctx.fillText('Периметр верёвки НЕИЗМЕНЕН: P = 100.0 м', cx, cy - R_circle_px - 12);

          ctx.fillStyle = '#fff';
          ctx.font = 'bold 20px monospace';
          ctx.fillText(`S = ${curArea.toFixed(1)} м²`, cx, cy - 4);
          ctx.fillStyle = '#cbd5e1';
          ctx.font = 'bold 12px sans-serif';
          ctx.fillText(`(${((curArea / 795.8) * 100).toFixed(1)}% от максимума круга)`, cx, cy + 20);
        }
      }

      // RIGHT PANEL ON CANVAS: Live Bar Chart Comparing Areas for P = 100 m
      const rx = canvas.width * 0.62;
      const ry = canvas.height * 0.22;
      const barMaxW = 220;

      ctx.fillStyle = 'rgba(17, 24, 39, 0.9)';
      ctx.strokeStyle = '#334155';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(rx - 18, ry - 28, 315, 310, 14);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#fbbf24';
      ctx.font = 'bold 13.5px sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText('📊 Сравнение площадей при P = 100 м:', rx, ry - 4);

      stages.forEach((st, i) => {
        const by = ry + 22 + i * 52;
        const wBar = (st.area / 795.8) * barMaxW;
        const isCur = !d.seaShoreMode && activeStage.n === st.n;

        ctx.fillStyle = isCur ? '#fff' : '#cbd5e1';
        ctx.font = isCur ? 'bold 12px sans-serif' : '11.5px sans-serif';
        ctx.fillText(st.name, rx, by);

        ctx.fillStyle = 'rgba(255,255,255,0.08)';
        ctx.fillRect(rx, by + 7, barMaxW, 16);

        ctx.fillStyle = st.color;
        ctx.fillRect(rx, by + 7, wBar, 16);
        if (isCur) {
          ctx.strokeStyle = '#fff';
          ctx.lineWidth = 2;
          ctx.strokeRect(rx, by + 7, wBar, 16);
        }

        ctx.fillStyle = '#fff';
        ctx.font = 'bold 11.5px monospace';
        ctx.fillText(`${st.area.toFixed(1)} м²`, rx + wBar + 8, by + 19);
      });

      const statusEl = document.getElementById('quest-dido-status');
      if (statusEl) {
        if (d.seaShoreMode) {
          statusEl.innerText = '🌊 Хитрость Дидоны: полукруг у берега моря даёт 1591.5 м²!';
          statusEl.className = 'quest-status success';
        } else if (t > 0.92) {
          statusEl.innerText = `👑 МАКСИМУМ НАЙДЕН! Круг даёт S = ${curArea.toFixed(1)} м² (100% возможной площади)!`;
          statusEl.className = 'quest-status success';
        } else {
          statusEl.innerText = `${activeStage.name}: S = ${curArea.toFixed(1)} м² (${((curArea / 795.8) * 100).toFixed(1)}% от круга)`;
          statusEl.className = 'quest-status';
        }
      }

      updateMetrics({
        'Длина верёвки P': '100.0 м (постоянна!)',
        'Текущая фигура': d.seaShoreMode ? 'Полукруг у моря 🌊' : activeStage.name,
        'Площадь S': d.seaShoreMode ? '1591.5 м² (×2!)' : `${curArea.toFixed(1)} м²`,
        'Максимум (Круг)': '795.8 м² (P² / 4π) 👑'
      }, 'Задача Царицы Дидоны');
    }

    function mainLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (state.domain === '2d') {
        render2D();
      } else if (state.domain === '3d') {
        render3D();
      } else {
        drawSubtleGrid();
        if (state.questId === 'quest_orthocenter') {
          renderQuestOrthocenterScene();
        } else if (state.questId === 'quest_thales') {
          state.circleChord.subMode = 'inscribed_right';
          renderCirclesHelperScene();
          const { radius, angleA, angleB, angleP } = state.circleChord;
          const O = { x: canvas.width / 2 - 20, y: canvas.height / 2 + 10 };
          const A = { x: O.x + radius * Math.cos(angleA), y: O.y + radius * Math.sin(angleA) };
          const B = { x: O.x + radius * Math.cos(angleB), y: O.y + radius * Math.sin(angleB) };
          const P = { x: O.x + radius * Math.cos(angleP), y: O.y + radius * Math.sin(angleP) };
          const ins = getTriangleAngles(P, A, B).angA;
          const el = document.getElementById('quest-thales-angle');
          if (el) {
            const ok = Math.abs(ins - 90) < 1.8;
            el.innerText = `${ins.toFixed(1)}° ` + (ok ? '🎉 ПРЯМОЙ УГОЛ (90°)! Хорда AB стала диаметром!' : 'Потяни точку A или B, чтобы хорда AB прошла через центр O!');
            el.className = 'quest-status' + (ok ? ' success' : '');
          }
        } else if (state.questId === 'quest_cube_hex') {
          renderSectionPlane3D();
        } else {
          renderQuestDidoScene();
        }
      }
      requestAnimationFrame(mainLoop);
    }

    renderLayerBar();
    renderSidebar();
    presetTriangle('acute');
    requestAnimationFrame(mainLoop);
  </script>
</body>
</html>
