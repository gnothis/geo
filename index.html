<html lang="ru">
<head>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Живая Геометрия: Интерактивная Планиметрия, Тригонометрия и Стереометрия</title>

  <style>
    :root {
      --bg-dark: #090d16;
      --bg-panel: #111827;
      --bg-card: #1e293b;
      --bg-hover: #283548;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent-blue: #38bdf8;
      --accent-purple: #818cf8;
      --accent-emerald: #34d399;
      --accent-amber: #fbbf24;
      --accent-rose: #f43f5e;
      --accent-cyan: #22d3ee;
      --radius: 12px;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-dark);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, #4f46e5, #06b6d4);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 15px rgba(6, 182, 212, 0.4);
      font-size: 20px;
    }

    .brand-text h1 {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(90deg, #fff, #93c5fd);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-text p {
      font-size: 0.73rem;
      color: var(--text-muted);
    }

    .nav-tabs {
      display: flex;
      background: rgba(0, 0, 0, 0.3);
      padding: 4px;
      border-radius: 10px;
      border: 1px solid var(--border);
      gap: 4px;
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 7px 15px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .tab-btn:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.05);
    }

    .tab-btn.active {
      color: #fff;
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
    }

    .app-body {
      display: flex;
      flex: 1;
      height: calc(100vh - 59px);
      overflow: hidden;
    }

    .sidebar {
      width: 425px;
      background: var(--bg-panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    .sidebar::-webkit-scrollbar {
      width: 6px;
    }
    .sidebar::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }

    .sidebar-section {
      padding: 13px 15px;
      border-bottom: 1px solid var(--border);
    }

    .section-title {
      font-size: 0.71rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 9px;
      font-weight: 700;
    }

    .mode-pills {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .mode-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 9px;
      background: var(--bg-card);
      border: 1px solid transparent;
      border-radius: 10px;
      color: var(--text);
      cursor: pointer;
      font-size: 0.78rem;
      font-weight: 500;
      transition: all 0.18s ease;
      text-align: left;
    }

    .mode-pill.full-width {
      grid-column: span 2;
    }

    .mode-pill:hover {
      background: var(--bg-hover);
      border-color: rgba(255, 255, 255, 0.12);
    }

    .mode-pill.active {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.18), rgba(99, 102, 241, 0.18));
      border-color: var(--accent-blue);
      color: #fff;
    }

    .mode-pill .pill-icon {
      width: 26px;
      height: 26px;
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      flex-shrink: 0;
    }

    .mode-pill.active .pill-icon {
      background: var(--accent-blue);
      color: #000;
    }

    .info-card {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 12px 14px;
      border: 1px solid var(--border);
      margin-bottom: 11px;
    }

    .info-card h3 {
      font-size: 0.9rem;
      margin-bottom: 6px;
      color: var(--accent-amber);
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .info-card p {
      font-size: 0.81rem;
      line-height: 1.46;
      color: #cbd5e1;
      margin-bottom: 6px;
    }

    .info-card ul {
      padding-left: 16px;
      font-size: 0.79rem;
      line-height: 1.45;
      color: #cbd5e1;
      margin-bottom: 6px;
    }

    .info-card li {
      margin-bottom: 4px;
    }

    .info-card .formula-box {
      background: rgba(0, 0, 0, 0.38);
      border-left: 3px solid var(--accent-emerald);
      padding: 9px 12px;
      border-radius: 6px;
      font-size: 0.88rem;
      font-weight: 600;
      color: #6ee7b7;
      margin: 8px 0;
      line-height: 1.55;
      overflow-x: auto;
    }

    .info-card .formula-box .katex-display {
      margin: 4px 0;
    }

    .katex {
      font-size: 1.03em !important;
    }

    .info-card .hint {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-style: italic;
    }

    .control-group {
      margin-bottom: 11px;
    }

    .control-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.79rem;
      font-weight: 600;
      margin-bottom: 5px;
      color: #e2e8f0;
    }

    .control-label span.val {
      color: var(--accent-cyan);
      font-family: monospace;
    }

    input[type="range"] {
      width: 100%;
      height: 6px;
      background: var(--border);
      border-radius: 3px;
      outline: none;
      -webkit-appearance: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 17px;
      height: 17px;
      border-radius: 50%;
      background: var(--accent-blue);
      box-shadow: 0 0 8px rgba(56, 189, 248, 0.6);
      cursor: pointer;
    }

    .btn-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 6px;
    }

    .action-btn {
      flex: 1 1 auto;
      padding: 7px 9px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      font-size: 0.76rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.18s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .action-btn:hover {
      background: var(--bg-hover);
      border-color: var(--accent-blue);
    }

    .action-btn.active-toggle {
      background: rgba(56, 189, 248, 0.22);
      border-color: var(--accent-blue);
      color: #38bdf8;
    }

    .trig-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.75rem;
      margin-top: 6px;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 8px;
      overflow: hidden;
    }
    .trig-table th, .trig-table td {
      border: 1px solid var(--border);
      padding: 5px 4px;
      text-align: center;
    }
    .trig-table th {
      background: rgba(56, 189, 248, 0.15);
      color: #7dd3fc;
      cursor: pointer;
    }
    .trig-table th:hover {
      background: rgba(56, 189, 248, 0.35);
    }
    .trig-table td.sqrt-cell {
      font-family: monospace;
      color: #fde68a;
    }

    .canvas-container {
      flex: 1;
      position: relative;
      background: radial-gradient(circle at 50% 50%, #17223b 0%, #090d16 100%);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      cursor: crosshair;
    }

    .canvas-overlay {
      position: absolute;
      top: 14px;
      right: 14px;
      background: rgba(17, 24, 39, 0.9);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 15px;
      box-shadow: var(--shadow);
      pointer-events: auto;
      max-width: 340px;
      z-index: 5;
    }

    .overlay-title {
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--accent-cyan);
      margin-bottom: 7px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .stat-item {
      background: rgba(0, 0, 0, 0.3);
      padding: 5px 8px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .stat-name {
      font-size: 0.67rem;
      color: var(--text-muted);
    }

    .stat-val {
      font-size: 0.88rem;
      font-weight: 700;
      color: #fff;
      font-family: monospace;
    }

    .floating-tips {
      position: absolute;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(17, 24, 39, 0.88);
      backdrop-filter: blur(10px);
      padding: 7px 18px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      font-size: 0.79rem;
      color: #93c5fd;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      pointer-events: none;
      z-index: 5;
      white-space: nowrap;
    }

    .view-3d-tools {
      position: absolute;
      bottom: 18px;
      right: 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 5;
    }

    .circle-tool-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(17, 24, 39, 0.9);
      border: 1px solid var(--border);
      color: #fff;
      font-size: 17px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: all 0.2s;
    }

    .circle-tool-btn:hover {
      background: var(--accent-blue);
      color: #000;
      transform: scale(1.08);
    }

    .quest-card {
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.9), rgba(15, 23, 42, 0.9));
      border: 1px solid #4f46e5;
      box-shadow: 0 0 20px rgba(79, 70, 229, 0.3);
      padding: 13px;
      border-radius: var(--radius);
      margin-top: 10px;
    }

    .quest-header {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.84rem;
      font-weight: 700;
      color: #a5b4fc;
      margin-bottom: 5px;
    }

    .quest-status {
      display: inline-block;
      margin-top: 5px;
      font-size: 0.78rem;
      padding: 4px 8px;
      border-radius: 4px;
      background: rgba(251, 191, 36, 0.2);
      color: #fbbf24;
      font-weight: 600;
    }

    .quest-status.success {
      background: rgba(52, 211, 153, 0.2);
      color: #34d399;
    }

    /* Floating Layer Visibility Toolbar on Canvas */
    .canvas-layer-bar {
      position: absolute;
      top: 14px;
      left: 16px;
      background: rgba(17, 24, 39, 0.9);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 6px 10px;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: var(--shadow);
      z-index: 8;
      flex-wrap: wrap;
      justify-content: flex-start;
      max-width: calc(100% - 380px);
    }

    .layer-chip {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid transparent;
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 18px;
      font-size: 0.73rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.18s;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }

    .layer-chip:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
    }

    .layer-chip.on {
      background: rgba(56, 189, 248, 0.2);
      border-color: var(--accent-blue);
      color: #7dd3fc;
    }

    .layer-chip.clean-btn {
      background: rgba(251, 191, 36, 0.18);
      border-color: rgba(251, 191, 36, 0.5);
      color: #fde68a;
    }

    canvas {
      touch-action: none;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .mobile-toggle-btn {
      background: rgba(56, 189, 248, 0.14);
      border: 1px solid var(--accent-blue);
      color: #7dd3fc;
      padding: 6px 11px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .mobile-toggle-btn:hover, .mobile-toggle-btn.active {
      background: var(--accent-blue);
      color: #000;
    }

    .expand-canvas-btn {
      display: none;
    }

    /* Phone Simulator frame when toggled on Desktop (.force-mobile) */
    body.force-mobile {
      background: #03060c;
      align-items: center;
      justify-content: center;
      padding: 10px 0;
    }

    body.force-mobile .mobile-frame-wrapper {
      width: 414px;
      height: min(860px, 96vh);
      border: 8px solid #1e293b;
      border-radius: 36px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: var(--bg-dark);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85), 0 0 0 1px rgba(255,255,255,0.1);
      position: relative;
    }

    .mobile-frame-wrapper {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }

    /* Mobile & Narrow Screen Layout (automatic on phones <= 900px OR when .force-mobile is active) */
    @media (max-width: 900px) {
      header {
        padding: 8px 10px;
        flex-wrap: wrap;
        gap: 6px;
      }
      .brand-icon {
        width: 30px;
        height: 30px;
        font-size: 16px;
      }
      .brand-text h1 {
        font-size: 0.95rem;
      }
      .brand-text p {
        display: none;
      }
      .nav-tabs {
        width: 100%;
        order: 3;
        justify-content: space-between;
      }
      .tab-btn {
        flex: 1;
        justify-content: center;
        padding: 6px 6px;
        font-size: 0.76rem;
        gap: 4px;
      }
      .app-body {
        flex-direction: column-reverse;
        height: calc(100vh - 84px);
      }
      .canvas-container {
        flex: none;
        height: 50%;
        min-height: 270px;
        border-bottom: 1px solid var(--border);
        transition: height 0.25s ease;
      }
      body.canvas-expanded .canvas-container {
        height: 78%;
      }
      body.canvas-expanded .sidebar {
        height: 22%;
      }
      .sidebar {
        width: 100%;
        height: 50%;
        border-right: none;
      }
      .sidebar-section {
        padding: 10px 12px;
      }
      .mode-pills {
        display: flex;
        overflow-x: auto;
        gap: 8px;
        padding-bottom: 4px;
        scrollbar-width: none;
      }
      .mode-pills::-webkit-scrollbar {
        display: none;
      }
      .mode-pill {
        flex: 0 0 auto;
        min-width: 165px;
        padding: 7px 10px;
      }
      .canvas-layer-bar {
        top: 8px;
        left: 8px;
        right: 8px;
        max-width: calc(100% - 16px);
        flex-wrap: nowrap;
        overflow-x: auto;
        justify-content: flex-start;
        padding: 4px 8px;
        scrollbar-width: none;
      }
      .canvas-layer-bar::-webkit-scrollbar {
        display: none;
      }
      .layer-chip {
        font-size: 0.68rem;
        padding: 3px 8px;
      }
      .canvas-overlay {
        top: auto;
        bottom: 8px;
        left: 8px;
        right: 56px;
        max-width: none;
        padding: 6px 10px;
        background: rgba(17, 24, 39, 0.86);
      }
      .overlay-title {
        font-size: 0.68rem;
        margin-bottom: 4px;
      }
      .stat-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 4px;
      }
      .stat-item {
        padding: 3px 6px;
      }
      .stat-name {
        font-size: 0.6rem;
      }
      .stat-val {
        font-size: 0.75rem;
      }
      .floating-tips {
        display: none;
      }
      .view-3d-tools {
        bottom: 8px;
        right: 8px;
        gap: 5px;
      }
      .circle-tool-btn {
        width: 34px;
        height: 34px;
        font-size: 14px;
      }
      .expand-canvas-btn {
        display: inline-flex;
      }
      input[type="range"] {
        height: 8px;
      }
      input[type="range"]::-webkit-slider-thumb {
        width: 22px;
        height: 22px;
      }
    }

    /* Apply the exact same mobile rules when .force-mobile is toggled on desktop */
    body.force-mobile header {
      padding: 8px 12px;
      flex-wrap: wrap;
      gap: 6px;
    }
    body.force-mobile .brand-icon {
      width: 30px;
      height: 30px;
      font-size: 16px;
    }
    body.force-mobile .brand-text h1 {

    body.force-mobile .canvas-container {

      border-bottom: 1px solid var(--border);
    }
    body.force-mobile.canvas-expanded .canvas-container {
      height: 76%;
    }
    body.force-mobile.canvas-expanded .sidebar {
      height: 24%;
    }
    body.force-mobile .sidebar {
      width: 100%;
      height: 50%;
      border-right: none;
    }
    body.force-mobile .sidebar-section {
      padding: 10px 12px;
    }
    body.force-mobile .mode-pills {
      display: flex;

      gap: 8px;
      padding-bottom: 4px;
    }
    body.force-mobile .mode-pill {
      flex: 0 0 auto;

    }
    body.force-mobile .canvas-layer-bar {
      top: 8px;
      left: 8px;
      right: 8px;
      max-width: calc(100% - 16px);
      flex-wrap: nowrap;
      overflow-x: auto;
      justify-content: flex-start;
      padding: 4px 8px;
    }
    body.force-mobile .layer-chip {
      font-size: 0.68rem;

    }
    body.force-mobile .canvas-overlay {
      top: auto;

<body>
  <div class="mobile-frame-wrapper" id="app-wrapper">
  <header>
    <div class="brand">
      <div class="brand-icon">✨</div>
      <div class="brand-text">
        <h1>Живая Геометрия</h1>
        <p>Интерактивный курс для ПК и смартфонов: Планиметрия, Тригонометрия и 3D</p>
      </div>
    </div>

    <div class="nav-tabs">
      <button class="tab-btn active" id="tab-2d" onclick="switchDomain('2d')">
        <span>📐</span> 2D Планиметрия
      </button>
      <button class="tab-btn" id="tab-3d" onclick="switchDomain('3d')">

    <div class="header-actions">
      <button class="mobile-toggle-btn expand-canvas-btn" id="btn-expand-canvas" onclick="toggleExpandCanvas()" title="Увеличить область чертежа">
        <span>🔼</span> Чертёж
      </button>
      <button class="mobile-toggle-btn" id="btn-mobile-sim" onclick="toggleMobileSimulator()" title="Переключить между мобильным (смартфон) и настольным (ПК) видом">
        <span>📱</span> Мобильный вид
      </button>
    </div>
  </header>

  <div class="app-body">
    <div class="sidebar" id="sidebar"></div>

    <div class="canvas-container" id="canvas-container">
      <canvas id="main-canvas"></canvas>

      <!-- Quick Layer Visibility Toggles Bar -->
      <div class="canvas-layer-bar" id="canvas-layer-bar"></div>

      <div class="canvas-overlay" id="metrics-overlay">
        <div class="overlay-title" id="overlay-title">Живые Измерения</div>
        <div class="stat-grid" id="stat-grid"></div>
      </div>

      <div class="floating-tips" id="floating-tips">
        <span>💡</span> <span id="tip-text">Потяни за цветные точки или переключай режимы слева!</span>
      </div>

      <div class="view-3d-tools" id="view-3d-tools" style="display: none;">
        <button class="circle-tool-btn" title="Сбросить ракурс камеры" onclick="reset3DCamera()">🔄</button>
        <button class="circle-tool-btn" id="btn-autorotate" title="Авто-вращение" onclick="toggleAutoRotate()">⏯️</button>
        <button class="circle-tool-btn" title="Приблизить" onclick="zoom3D(1.15)">➕</button>
        <button class="circle-tool-btn" title="Отдалить" onclick="zoom3D(0.85)">➖</button>
      </div>
    </div>
  </div>
  </div>

  <script>
    const state = {
      domain: '2d',
      // 9 comprehensive 2D modules
      mode2d: 'triangles_lines',
      // 'angles_parallel', 'triangles_lines', 'congruence_similarity', 'pythagoras',
      // 'sine_cosine_laws', 'quadrilaterals', 'areas_perimeter', 'circles_helper', 'trigonometry'

      mode3d: 'gallery',
      questId: 'quest_orthocenter',

      // 1. Angles & Parallel Lines
      anglesParallel: {
        subMode: 'parallel',
        angleDeg: 62,
        pairType: 'alternate',
        brokenParallel: 0
      },

      // 2. Triangles & Euler Line
      triangle: {
        A: { x: 220, y: 420, label: 'A', color: '#f43f5e' },
        B: { x: 610, y: 420, label: 'B', color: '#38bdf8' },
        C: { x: 350, y: 150, label: 'C', color: '#34d399' }
      },
      triFeatures: {
        angleSumParallel: false,
        medians: true,
        bisectors: false,
        altitudes: true,
        perpBisectors: true,
        midline: false,
        eulerLine: true
      },

      // 3. Congruence & Similarity
      congSim: {
        subMode: 'congruence',
        congRule: 'SAS',
        overlapProgress: 0,
        simRule: 'AA',
        scaleK: 2.0
      },

      // 4. Pythagoras
      rightTriangle: {
        a: 110,
        b: 150,
        flowStep: 0
      },

      // 5. Sine & Cosine Laws (NEW!)
      lawsSinCos: {
        subMode: 'sine_law', // 'sine_law', 'cosine_law'
        showDiameterProof: true,
        showAltitudeProof: true
      },

      // 6. Quadrilaterals
      quads: {
        type: 'parallelogram',
        skew: 55,
        width: 240,
        height: 150,
        showDiagonals: true,
        showMidline: true,
        showCircle: false
      },

      // 7. Areas & Perimeter
      areas: {
        shape: 'parallelogram',
        cutMorph: 0,
        baseA: 220,
        baseB: 120,
        heightH: 140,
        skewX: 65
      },

      // 8. Circles Helper (Overhauled with full tangents & signed sides)
      circleChord: {
        subMode: 'tangent_anatomy', // 'tangent_anatomy', 'inscribed_right', 'quads_in_out', 'pi_area_unroll'
        radius: 145,
        cx: 400,
        cy: 300,
        extM: { x: 650, y: 290, label: 'M (потяни!)', color: '#fbbf24' },
        angleA: 3.14159,
        angleB: 0,
        angleP: -1.1,
        unrollStep: 0
      },

      // 9. Trigonometry
      trig: {
        angleDeg: 30
      },

      // 3D Engine state
      camera: {
        rotX: 0.45,
        rotY: -0.65,
        zoom: 1.0,
        autoRotate: true,
        drag: false,
        lastMouseX: 0,
        lastMouseY: 0
      },
      currentShape3d: 'cube',
      renderStyle3d: 'solid_translucent',
      sectionPlane: { height: 0, pitch: 0.35, yaw: 0.2 },
      unfoldProgress: 0,
      revolveAngle: 360,
      revolveShape: 'triangle',
      uiLayers: {
        showLabels: true,       // Подписи длин, сторон и точек
        showAngleVals: true,    // Числовые градусы углов
        showCanvasCard: false,  // Крупная плашка с теорией в левом верхнем углу (по умолчанию выкл в 3D, чтобы не мешать!)
        showMetricsBox: true,   // Компактное табло метрик справа
        showFaces3D: true,      // Закрашенные грани в 3D
        showEdges3D: true,      // Рёбра в 3D
        showVertices3D: true,   // Вершины-точки в 3D
        showGrid: true          // Сетка фона
      },
      circle3d: {
        centralDeg: 110,
        pointPDeg: 215,
        showSphere: true,
        showCentralAngle: true,
        showInscribedAngle: true,
        showChordLabels: true,
        showMultiP: false,
        tiltPlaneDeg: 0
      },
      inscribed2d: {
        showProofOP: true,
        showFan: false
      },
      platonic: {
        selected: 'dodecahedron',
        showDual: true,
        showVertexUnfold: true
      },
      dido: {
        morphProgress: 0.25,
        autoAnimate: true,
        animDir: 1,
        seaShoreMode: false
      },
      vectors2d: {
        subMode: 'addition', // 'basics', 'addition', 'sub_scalar', 'dot_product', 'geom_apps'
        addRule: 'both', // 'triangle', 'parallelogram', 'both', 'polygon'
        shiftStep: 1.0,  // 0 to 1 animation slider for moving vector b to tip of a
        scalarK: 1.5,    // -2.5 to 2.5
        divRatioT: 0.5,  // 0 to 1 for point M on AB: OM = (1-t)OA + tOB
        // Vector coordinates in grid units (1 unit = 30 px, origin at center of canvas)
        vecA: { x: 150, y: -90, label: 'a', color: '#f43f5e' },  // (5, 3) in math coords
        vecB: { x: 90, y: 120, label: 'b', color: '#38bdf8' },   // (3, -4) in math coords
        baseA: { x: -180, y: 60, label: 'Начало A', color: '#fbbf24' }
      },
      vectors3d: {
        subMode: 'box_3d',
        ax: 1.2,
        ay: 1.0,
        az: 0.9,
        angleBetweenDeg: 65
      },
      volSurf3d: {
        shape: 'pyramid',
        paramR: 3.0,
        paramH: 4.0,
        fillLevel: 0.65,
        showBoundingCylinder: true,
        highlightPart: 'all'
      },
      stereoTheory: {
        subMode: 'axioms', // 'axioms', 'parallel', 'skew_lines', 'perp', 'ttp', 'ege_plot'
        planeWay: '3points', // '3points', 'line_point', '2intersect', '2parallel', '2planes_line'
        ttpAngleDeg: 90,   // Angle of line a in plane alpha relative to projection HM (90° = TTP holds!)
        egeShape: 'pyramid' // 'pyramid', 'cube_diag'
      },
      stereoDistAng: {
        subMode: 'point_plane',
        shiftSkewT: 1.0,
        inclineDeg: 40,
        heightH: 1.25
      },
      dimBridge: {
        family: 'hypercube', // 'hypercube' (1->2->4->8->16) or 'simplex' (1->2->3->4->5)
        dimProgress: 3.0,    // 0.0 (0D) -> 1.0 (1D) -> 2.0 (2D) -> 3.0 (3D) -> 4.0 (4D)
        autoAnimate: false,
        animDir: 1,
        wAngle: 0.45,
        autoWRotate: true
      },
      questsExtra: {
        // Quest 6: Heron's shortest path A -> M (on river) -> B
        heronM_x: -90, // relative to cx, optimal is +32
        showHeronMirror: false,
        // Quest 7: Inscribed quadrilateral (drag D so B + D = 180 deg)
        quadD: { x: 560, y: 185, label: 'D (тяни к окружности!)', color: '#fbbf24' },
        // Quest 9: Ant on a 3D cube (crossing point t on top-front edge, optimal t = 0.5, unfold 0..1)
        antEdgeT: 0.15,
        antUnfold: 0.0,
        // Quest 10: 3D Shadow catcher (tilt angle phi, target = 60 deg so cos(60) = 0.5)
        shadowTiltDeg: 25
      },

      draggedPoint: null,
      hoveredPoint: null
    };

    const canvas = document.getElementById('main-canvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('canvas-container');

    function resizeCanvas() {
      const cw = Math.max(1, container.clientWidth);
      const ch = Math.max(1, container.clientHeight);
      const vScale = Math.max(1, 880 / cw, 560 / ch);
      canvas.width = Math.round(cw * vScale);
      canvas.height = Math.round(ch * vScale);
      state.circleChord.cx = canvas.width / 2 - 40;
      state.circleChord.cy = canvas.height / 2;
      if (!state.circleChord.extMInitialized) {
        state.circleChord.extM.x = state.circleChord.cx + 260;
        state.circleChord.extM.y = state.circleChord.cy - 10;
        state.circleChord.extMInitialized = true;
      }
    }

    function toggleMobileSimulator() {
      document.body.classList.toggle('force-mobile');
      const isMob = document.body.classList.contains('force-mobile');
      const btn = document.getElementById('btn-mobile-sim');
      if (btn) {
        btn.classList.toggle('active', isMob);
        btn.innerHTML = isMob ? '<span>💻</span> ПК вид' : '<span>📱</span> Мобильный вид';
      }
      // On mobile view, hide the right metrics overlay by default if user wants more room, or keep it compact at bottom
      setTimeout(() => {
        resizeCanvas();
        presetTriangle('acute');
      }, 60);
    }

    function toggleExpandCanvas() {
      document.body.classList.toggle('canvas-expanded');
      const isExp = document.body.classList.contains('canvas-expanded');
      const btn = document.getElementById('btn-expand-canvas');
      if (btn) {
        btn.classList.toggle('active', isExp);
        btn.innerHTML = isExp ? '<span>🔽</span> Панель' : '<span>🔼</span> Чертёж';
      }
      setTimeout(resizeCanvas, 260);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function switchDomain(domain) {
      state.domain = domain;
      document.getElementById('tab-2d').classList.toggle('active', domain === '2d');
      document.getElementById('tab-3d').classList.toggle('active', domain === '3d');
      document.getElementById('tab-quests').classList.toggle('active', domain === 'quests');

      const tools3d = document.getElementById('view-3d-tools');
      tools3d.style.display = (domain === '3d' || (domain === 'quests' && state.questId === 'quest_cube_hex')) ? 'flex' : 'none';

      renderLayerBar();
      renderSidebar();
    }

    function toggleUILayer(key) {
      state.uiLayers[key] = !state.uiLayers[key];
      const mBox = document.getElementById('metrics-overlay');
      if (mBox) mBox.style.display = state.uiLayers.showMetricsBox ? 'block' : 'none';
      renderLayerBar();
      renderSidebar();
    }

    function toggleCleanView() {
      const ui = state.uiLayers;
      const anyTextOn = ui.showLabels || ui.showAngleVals || ui.showCanvasCard || ui.showMetricsBox;
      if (anyTextOn) {
        ui.showLabels = false;
        ui.showAngleVals = false;
        ui.showCanvasCard = false;
        ui.showMetricsBox = false;
      } else {
        ui.showLabels = true;
        ui.showAngleVals = true;
        ui.showMetricsBox = true;
      }
      const mBox = document.getElementById('metrics-overlay');
      if (mBox) mBox.style.display = ui.showMetricsBox ? 'block' : 'none';
      renderLayerBar();
      renderSidebar();
    }

    function renderLayerBar() {
      const bar = document.getElementById('canvas-layer-bar');
      if (!bar) return;
      const ui = state.uiLayers;
      const isClean = !(ui.showLabels || ui.showAngleVals || ui.showCanvasCard || ui.showMetricsBox);

      let html = `
        <button class="layer-chip clean-btn" onclick="toggleCleanView()" title="Убрать или вернуть все надписи и таблицы одним кликом">
          ${isClean ? '👁️ Вернуть подписи' : '🧹 Чистый вид (без надписей)'}
        </button>
        <button class="layer-chip ${ui.showLabels ? 'on' : ''}" onclick="toggleUILayer('showLabels')">
          🏷️ Подписи и длины
        </button>
        <button class="layer-chip ${ui.showAngleVals ? 'on' : ''}" onclick="toggleUILayer('showAngleVals')">
          📐 Градусы
        </button>
        <button class="layer-chip ${ui.showCanvasCard ? 'on' : ''}" onclick="toggleUILayer('showCanvasCard')">
          📋 Справка на холсте
        </button>
        <button class="layer-chip ${ui.showMetricsBox ? 'on' : ''}" onclick="toggleUILayer('showMetricsBox')">
          📊 Табло цифр
        </button>
      `;

      if (state.domain === '3d') {
        html += `
          <button class="layer-chip ${ui.showFaces3D ? 'on' : ''}" onclick="toggleUILayer('showFaces3D')">
            🎨 Грани
          </button>
          <button class="layer-chip ${ui.showEdges3D ? 'on' : ''}" onclick="toggleUILayer('showEdges3D')">
            📏 Рёбра
          </button>
          <button class="layer-chip ${ui.showVertices3D ? 'on' : ''}" onclick="toggleUILayer('showVertices3D')">
            ⚪ Вершины
          </button>
        `;
      }
      bar.innerHTML = html;
    }

    function triggerKaTeX() {
      if (typeof renderMathInElement === 'function') {
        const opts = {
          delimiters: [
            { left: '$$', right: '$$', display: true },
            { left: '\\(', right: '\\)', display: false },
            { left: '$', right: '$', display: false }
          ],
          throwOnError: false
        };
        const sb = document.getElementById('sidebar');
        if (sb) renderMathInElement(sb, opts);
      }
    }
    window.triggerKaTeX = triggerKaTeX;
    window.addEventListener('DOMContentLoaded', () => { setTimeout(triggerKaTeX, 80); });
    window.addEventListener('load', () => { triggerKaTeX(); });

    function set2DMode(mode) {
      state.mode2d = mode;
      renderSidebar();
    }

    function set3DMode(mode) {
      state.mode3d = mode;
      renderSidebar();
    }

    function setQuest(qId) {
      state.questId = qId;
      const is3DQuest = (qId === 'quest_cube_hex' || qId === 'quest_spider_cube' || qId === 'quest_shadow_3d' || qId === 'quest_dimensions');
      document.getElementById('view-3d-tools').style.display = is3DQuest ? 'flex' : 'none';
      if (qId === 'quest_orthocenter' || qId === 'quest_euler_collapse') {
        presetTriangle('acute');
      } else if (qId === 'quest_thales') {
        state.circleChord.angleA = 2.45;
        state.circleChord.angleB = 0.25;
        state.circleChord.angleP = -1.25;
      } else if (qId === 'quest_cube_hex') {
        state.currentShape3d = 'cube';
      } else if (qId === 'quest_isoperimetric') {
        state.dido.autoAnimate = true;
      } else if (qId === 'quest_perp_vectors') {
        state.vectors2d.vecA = { x: 120, y: -90, label: 'a', color: '#f43f5e' };
        state.vectors2d.vecB = { x: 120, y: 60, label: 'b', color: '#38bdf8' };
      } else if (qId === 'quest_inscribed_quad') {
        state.questsExtra.quadD = { x: canvas.width / 2 + 185, y: canvas.height / 2 - 125, label: 'D (тяни!)', color: '#fbbf24' };
      }
      renderSidebar();
    }

    // ==========================================
    // SIDEBAR RENDERING
    // ==========================================
    function renderSidebar() {
      const sb = document.getElementById('sidebar');

      if (state.domain === '2d') {
        sb.innerHTML = `
          <div class="sidebar-section">
            <div class="section-title">11 Разделов Планиметрии, Тригонометрии и Векторов</div>
            <div class="mode-pills">
              <div class="mode-pill ${state.mode2d === 'angles_parallel' ? 'active' : ''}" onclick="set2DMode('angles_parallel')">
                <div class="pill-icon">📏</div>
                <div>
                  <strong>1. Углы и Параллельные</strong>
                  <div style="font-size:0.68rem; color:var(--text-muted)">Смежные, Z, F, C углы</div>
                </div>
              </div>

              <div class="mode-pill ${state.mode2d === 'triangles_lines' ? 'active' : ''}" onclick="set2DMode('triangles_lines')">
                <div class="pill-icon">🔺</div>
                <div>
                  <strong>2. Центры и Прямая Эйлера</strong>
                  <div style="font-size:0.68rem; color:var(--text-muted)">Ортоцентр H, M, O, I, ср. линия</div>
                </div>
              </div>

              <div class="mode-pill ${state.mode2d === 'congruence_similarity' ? 'active' : ''}" onclick="set2DMode('congruence_similarity')">
                <div class="pill-icon">👯</div>
                <div>
                  <strong>3. Равенство и Подобие</strong>
                  <div style="font-size:0.68rem; color:var(--text-muted)">СУС, УСУ, ССС и площади k²</div>
                </div>
              </div>

              <div class="mode-pill ${state.mode2d === 'pythagoras' ? 'active' : ''}" onclick="set2DMode('pythagoras')">
                <div class="pill-icon">📐</div>
                <div>
                  <strong>4. Теорема Пифагора</strong>
                  <div style="font-size:0.68rem; color:var(--text-muted)">На гипотенузе + Доказательство</div>
                </div>
              </div>

              <div class="mode-pill ${state.mode2d === 'sine_cosine_laws' ? 'active' : ''}" onclick="set2DMode('sine_cosine_laws')">
                <div class="pill-icon">👑</div>
                <div>
                  <strong>5. Теоремы Sin и Cos</strong>
                  <div style="font-size:0.68rem; color:var(--text-muted)">a/sinα = 2R и c² = a²+b²-2ab·cosγ</div>
                </div>
              </div>

              <div class="mode-pill ${state.mode2d === 'quadrilaterals' ? 'active' : ''}" onclick="set2DMode('quadrilaterals')">
                <div class="pill-icon">▱</div>
                <div>
                  <strong>6. Четырёхугольники</strong>
                  <div style="font-size:0.68rem; color:var(--text-muted)">Параллелограмм, ромб, трапеция</div>
                </div>
              </div>

              <div class="mode-pill ${state.mode2d === 'areas_perimeter' ? 'active' : ''}" onclick="set2DMode('areas_perimeter')">
                <div class="pill-icon">✂️</div>
                <div>
                  <strong>7. Площади и Периметр</strong>
                  <div style="font-size:0.68rem; color:var(--text-muted)">Вывод формул перекраиванием</div>
                </div>
              </div>

              <div class="mode-pill ${state.mode2d === 'circles_helper' ? 'active' : ''}" onclick="set2DMode('circles_helper')">
                <div class="pill-icon">⭕</div>
                <div>
                  <strong>8. Тайны Окружности</strong>
                  <div style="font-size:0.68rem; color:var(--text-muted)">Касательные, стороны, 4-угольники</div>
                </div>
              </div>

              <div class="mode-pill ${state.mode2d === 'inscribed_central_2d' ? 'active' : ''}" onclick="set2DMode('inscribed_central_2d')">
                <div class="pill-icon">🎯</div>
                <div>
                  <strong>9. Вписанный и Центр. угол</strong>
                  <div style="font-size:0.68rem; color:var(--text-muted)">∠APB = ½ ∠AOB + доказательство</div>
                </div>
              </div>

              <div class="mode-pill ${state.mode2d === 'trigonometry' ? 'active' : ''}" onclick="set2DMode('trigonometry')">
                <div class="pill-icon">🧭</div>
                <div>
                  <strong>10. Синус и Косинус (√N/2)</strong>
                  <div style="font-size:0.68rem; color:var(--text-muted)">Смысл на круге и правило руки</div>
                </div>
              </div>

              <div class="mode-pill full-width ${state.mode2d === 'vectors_2d' ? 'active' : ''}" onclick="set2DMode('vectors_2d')" style="border-color: rgba(52, 211, 153, 0.4);">
                <div class="pill-icon">🏹</div>
                <div>
                  <strong>11. Векторы и действия с ними (от А до Я)</strong>
                  <div style="font-size:0.68rem; color:var(--text-muted)">Координаты, сложение (△ и ▱), вычитание, скалярное произведение и геометрия</div>
                </div>
              </div>
            </div>
          </div>

          <div class="sidebar-section">
            ${get2DControlsHTML()}
          </div>

    function toggleTriFeature(key) {

    function presetTriangle(type) {
      const cx = canvas.width / 2 - 30;
      const cy = canvas.height / 2 + 30;
      if (type === 'acute') {
        state.triangle.A = { x: cx - 190, y: cy + 120, label: 'A', color: '#f43f5e' };
        state.triangle.B = { x: cx + 190, y: cy + 120, label: 'B', color: '#38bdf8' };
        state.triangle.C = { x: cx + 45, y: cy - 150, label: 'C', color: '#34d399' };
      } else if (type === 'right') {
        state.triangle.A = { x: cx - 160, y: cy + 120, label: 'A', color: '#f43f5e' };
        state.triangle.B = { x: cx + 180, y: cy + 120, label: 'B', color: '#38bdf8' };
        state.triangle.C = { x: cx - 160, y: cy - 130, label: 'C', color: '#34d399' };
      } else if (type === 'obtuse') {
        state.triangle.A = { x: cx - 90, y: cy + 120, label: 'A', color: '#f43f5e' };
        state.triangle.B = { x: cx + 200, y: cy + 120, label: 'B', color: '#38bdf8' };
        state.triangle.C = { x: cx - 200, y: cy - 70, label: 'C', color: '#34d399' };
      } else if (type === 'isosceles') {
        state.triangle.A = { x: cx - 160, y: cy + 130, label: 'A', color: '#f43f5e' };
        state.triangle.B = { x: cx + 160, y: cy + 130, label: 'B', color: '#38bdf8' };
        state.triangle.C = { x: cx, y: cy - 160, label: 'C', color: '#34d399' };
      } else if (type === 'equilateral') {
        const side = 320;
        const h = side * Math.sqrt(3) / 2;
        state.triangle.A = { x: cx - side / 2, y: cy + h / 3, label: 'A', color: '#f43f5e' };
        state.triangle.B = { x: cx + side / 2, y: cy + h / 3, label: 'B', color: '#38bdf8' };
        state.triangle.C = { x: cx, y: cy - 2 * h / 3, label: 'C', color: '#34d399' };
      }
    }

    function makeDiameter() {
      state.circleChord.angleA = Math.PI;
      state.circleChord.angleB = 0;
      state.circleChord.angleP = -1.1;
    }

    function set2DCentralArc(deg) {
      const halfRad = (deg * Math.PI) / 360;
      state.circleChord.angleA = Math.PI / 2 + halfRad;
      state.circleChord.angleB = Math.PI / 2 - halfRad;
      if (Math.sin(state.circleChord.angleP) > -0.2) {
        state.circleChord.angleP = -Math.PI / 2;
      }
      renderSidebar();
    }

      ];
      const curList = db.family === 'hypercube' ? hyperStages : simplexStages;
      const cur = curList[stageIdx];

      return `

                <li><strong>1.2 Аксиома II (\\(A_2\\)):</strong> Если <strong>две точки прямой</strong> лежат в плоскости, то и <strong>все точки этой прямой</strong> лежат в этой плоскости (\\(A \\in \\alpha, B \\in \\alpha \\implies AB \\subset \\alpha\\)).</li>
                <li><strong>1.3 Аксиома III (\\(A_3\\)):</strong> Если две плоскости имеют общую точку, то они имеют <strong>общую прямую</strong>, на которой лежат все общие точки этих плоскостей (\\(\\alpha \\cap \\beta = l\\)).</li>

              <div class="formula-box">

                <li><strong>Признак параллельности прямой и плоскости:</strong> если прямая \\(a \\not\\subset \\alpha\\) параллельна <em>какой-нибудь одной прямой</em> \\(b \\subset \\alpha\\), то \\(a \\parallel \\alpha\\)!</li>

                $$\\text{Прямая } a \\subset \\alpha \\text{ перпендикулярна НАКЛОННОЙ } AM \\text{ тогда и только тогда,}$$

                $$a \\perp HM \\quad\\Longleftrightarrow\\quad a \\perp AM \\quad (90^\\circ \\Longleftrightarrow 90^\\circ)$$

              <p class="hint">Двигай ползунок поворота прямой a в плоскости α: как только угол с проекцией HM станет 90°, угол с наклонной AM в 3D тоже станет строго 90°!</p>

    // ==========================================
    // COMMON DRAWING HELPERS
    // ==========================================
    function dist(p1, p2) {
      return Math.hypot(p1.x - p2.x, p1.y - p2.y);
    }

    function drawSubtleGrid() {
      if (!state.uiLayers.showGrid) return;
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.035)';
      ctx.lineWidth = 1;
      const step = 40;
      for (let x = 0; x < canvas.width; x += step) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
      }
      for (let y = 0; y < canvas.height; y += step) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
      }
    }

    function drawLine(p1, p2, color, width = 2, dashed = false) {
      ctx.beginPath();
      ctx.moveTo(p1.x, p1.y);
      ctx.lineTo(p2.x, p2.y);
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.setLineDash(dashed ? [6, 6] : []);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    function drawSegmentLabel(p1, p2, text, color = '#fff', normalOffset = 14) {
      if (!state.uiLayers.showLabels) return;
      const mx = (p1.x + p2.x) / 2;
      const my = (p1.y + p2.y) / 2;
      const dx = p2.x - p1.x;
      const dy = p2.y - p1.y;
      const len = Math.hypot(dx, dy) || 1;
      const nx = -dy / len;
      const ny = dx / len;
      const lx = mx + nx * normalOffset;
      const ly = my + ny * normalOffset;

      ctx.font = 'bold 11.5px sans-serif';
      const tw = ctx.measureText(text).width;
      ctx.fillStyle = 'rgba(9, 13, 22, 0.78)';
      ctx.beginPath();
      ctx.roundRect(lx - tw / 2 - 5, ly - 9, tw + 10, 18, 5);
      ctx.fill();

      ctx.fillStyle = color;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, lx, ly);
    }

    function drawTickMarks(p1, p2, count, color = '#fff') {
      const mx = (p1.x + p2.x) / 2;
      const my = (p1.y + p2.y) / 2;
      const dx = p2.x - p1.x;
      const dy = p2.y - p1.y;
      const len = Math.hypot(dx, dy);
      if (len < 1) return;
      const ux = dx / len, uy = dy / len;
      const nx = -uy, ny = ux;
      const spacing = 6, tickHalf = 6;

      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      for (let i = 0; i < count; i++) {
        const offset = (i - (count - 1) / 2) * spacing;
        const cx = mx + ux * offset;
        const cy = my + uy * offset;
        ctx.beginPath();
        ctx.moveTo(cx - nx * tickHalf, cy - ny * tickHalf);
        ctx.lineTo(cx + nx * tickHalf, cy + ny * tickHalf);
        ctx.stroke();
      }
    }

    function drawRightAngleSquare(vertex, p1, p2, size = 14, color = '#fbbf24') {
      const d1 = dist(vertex, p1);
      const d2 = dist(vertex, p2);
      if (d1 < 1 || d2 < 1) return;
      const u1 = { x: (p1.x - vertex.x) / d1, y: (p1.y - vertex.y) / d1 };
      const u2 = { x: (p2.x - vertex.x) / d2, y: (p2.y - vertex.y) / d2 };

      const c1 = { x: vertex.x + u1.x * size, y: vertex.y + u1.y * size };
      const c2 = { x: vertex.x + (u1.x + u2.x) * size, y: vertex.y + (u1.y + u2.y) * size };
      const c3 = { x: vertex.x + u2.x * size, y: vertex.y + u2.y * size };

      ctx.beginPath();
      ctx.moveTo(vertex.x, vertex.y);
      ctx.lineTo(c1.x, c1.y);
      ctx.lineTo(c2.x, c2.y);
      ctx.lineTo(c3.x, c3.y);
      ctx.closePath();
      ctx.fillStyle = color + '33';
      ctx.fill();
      ctx.strokeStyle = color;
      ctx.lineWidth = 1.8;
      ctx.stroke();
    }

    function drawAngleArc(center, p1, p2, radius, color, label) {
      const a1 = Math.atan2(p1.y - center.y, p1.x - center.x);
      const a2 = Math.atan2(p2.y - center.y, p2.x - center.x);
      let diff = a2 - a1;
      while (diff < -Math.PI) diff += 2 * Math.PI;
      while (diff > Math.PI) diff -= 2 * Math.PI;

      ctx.beginPath();
      ctx.moveTo(center.x, center.y);
      ctx.arc(center.x, center.y, radius, a1, a1 + diff, diff < 0);
      ctx.closePath();
      ctx.fillStyle = color;
      ctx.globalAlpha = 0.32;
      ctx.fill();
      ctx.globalAlpha = 1.0;
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.stroke();

      if (label && state.uiLayers.showAngleVals) {
        const mid = a1 + diff / 2;
        const lx = center.x + (radius + 18) * Math.cos(mid);
        const ly = center.y + (radius + 18) * Math.sin(mid);
        ctx.fillStyle = color;
        ctx.font = 'bold 12px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(label, lx, ly);
      }
    }

    function drawPointMarker(p, color, label, offsetY = 4) {
      if (state.domain === '3d' && !state.uiLayers.showVertices3D) return;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 5.5, 0, 2 * Math.PI);
      ctx.fillStyle = color;
      ctx.fill();
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      if (label && state.uiLayers.showLabels) {
        ctx.font = 'bold 12px sans-serif';
        const tw = ctx.measureText(label).width;
        ctx.fillStyle = 'rgba(9, 13, 22, 0.78)';
        ctx.beginPath();
        ctx.roundRect(p.x + 7, p.y + offsetY - 9, tw + 8, 18, 4);
        ctx.fill();

        ctx.fillStyle = color;
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText(label, p.x + 11, p.y + offsetY);
      }
    }

    function drawDraggableHandle(p) {
      const isHovered = state.hoveredPoint === p;
      ctx.beginPath();
      ctx.arc(p.x, p.y, isHovered ? 12 : 9, 0, 2 * Math.PI);
      ctx.fillStyle = p.color;
      ctx.fill();
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2.5;
      ctx.stroke();

      ctx.fillStyle = '#fff';
      ctx.font = 'bold 13px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(p.label, p.x, p.y - 18);
    }

    function getTriangleAngles(A, B, C) {
      const a = dist(B, C);
      const b = dist(A, C);
      const c = dist(A, B);
      const cosA = Math.max(-1, Math.min(1, (b*b + c*c - a*a) / (2 * b * c)));
      const cosB = Math.max(-1, Math.min(1, (a*a + c*c - b*b) / (2 * a * c)));
      const cosC = Math.max(-1, Math.min(1, (a*a + b*b - c*c) / (2 * a * b)));
      return {
        a, b, c,
        angA: Math.acos(cosA) * 180 / Math.PI,
        angB: Math.acos(cosB) * 180 / Math.PI,
        angC: Math.acos(cosC) * 180 / Math.PI
      };
    }

    function getCircumcenter(A, B, C) {
      const D = 2 * (A.x * (B.y - C.y) + B.x * (C.y - A.y) + C.x * (A.y - B.y));
      if (Math.abs(D) < 0.001) return { x: (A.x + B.x)/2, y: (A.y + B.y)/2 };
      const Ux = ((A.x*A.x + A.y*A.y)*(B.y - C.y) + (B.x*B.x + B.y*B.y)*(C.y - A.y) + (C.x*C.x + C.y*C.y)*(A.y - B.y)) / D;
      const Uy = ((A.x*A.x + A.y*A.y)*(C.x - B.x) + (B.x*B.x + B.y*B.y)*(A.x - C.x) + (C.x*C.x + C.y*C.y)*(B.x - A.x)) / D;
      return { x: Ux, y: Uy };
    }

    function getOrthocenter(A, B, C) {
      const O = getCircumcenter(A, B, C);
      const Mx = (A.x + B.x + C.x) / 3;
      const My = (A.y + B.y + C.y) / 3;
      return { x: 3 * Mx - 2 * O.x, y: 3 * My - 2 * O.y };
    }

    function getIncenter(A, B, C) {
      const a = dist(B, C), b = dist(A, C), c = dist(A, B);
      const p = a + b + c;
      return {
        x: (a * A.x + b * B.x + c * C.x) / p,
        y: (a * A.y + b * B.y + c * C.y) / p,
        r: Math.sqrt(Math.max(0, ((p/2 - a)*(p/2 - b)*(p/2 - c))/(p/2)))
      };
    }

    function projectPointOnLine(P, A, B) {
      const dx = B.x - A.x;
      const dy = B.y - A.y;
      const len2 = dx*dx + dy*dy;
      if (len2 < 1e-6) return { x: A.x, y: A.y };
      const t = ((P.x - A.x)*dx + (P.y - A.y)*dy) / len2;
      return { x: A.x + t * dx, y: A.y + t * dy, t };
    }

    // ==========================================
    // RENDER 2D DISPATCHER
    // ==========================================
    function render2D() {
      drawSubtleGrid();
      const m = state.mode2d;
      if (m === 'angles_parallel') renderAnglesParallelScene();
      else if (m === 'triangles_lines') renderTrianglesLinesScene();
      else if (m === 'congruence_similarity') renderCongruenceSimilarityScene();
      else if (m === 'pythagoras') renderPythagorasScene();
      else if (m === 'sine_cosine_laws') renderSineCosineLawsScene();
      else if (m === 'quadrilaterals') renderQuadrilateralsScene();
      else if (m === 'areas_perimeter') renderAreasPerimeterScene();
      else if (m === 'circles_helper') renderCirclesHelperScene();
      else if (m === 'inscribed_central_2d') renderInscribedCentral2DScene();
      else if (m === 'trigonometry') renderTrigonometryScene();
      else if (m === 'vectors_2d') renderVectors2DScene();
    }

    function drawVectorArrow(pStart, pEnd, color = '#f43f5e', width = 3.5, label = '', dashed = false, normalOffset = -16) {
      const dx = pEnd.x - pStart.x;
      const dy = pEnd.y - pStart.y;
      const len = Math.hypot(dx, dy);
      if (len < 2) return;

      const angle = Math.atan2(dy, dx);
      const headLen = Math.min(16, Math.max(10, len * 0.22));

      ctx.save();
      ctx.beginPath();
      ctx.moveTo(pStart.x, pStart.y);
      ctx.lineTo(pEnd.x, pEnd.y);
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.setLineDash(dashed ? [6, 6] : []);
      ctx.stroke();
      ctx.setLineDash([]);

      // Arrowhead cone
      ctx.beginPath();
      ctx.moveTo(pEnd.x, pEnd.y);
      ctx.lineTo(pEnd.x - headLen * Math.cos(angle - Math.PI / 6.5), pEnd.y - headLen * Math.sin(angle - Math.PI / 6.5));
      ctx.lineTo(pEnd.x - headLen * 0.72 * Math.cos(angle), pEnd.y - headLen * 0.72 * Math.sin(angle));
      ctx.lineTo(pEnd.x - headLen * Math.cos(angle + Math.PI / 6.5), pEnd.y - headLen * Math.sin(angle + Math.PI / 6.5));
      ctx.closePath();
      ctx.fillStyle = color;
      ctx.fill();
      ctx.restore();

      if (label) {
        drawSegmentLabel(pStart, pEnd, label, color, normalOffset);
      }
    }

    function drawCoordinateAxes2D(ox, oy, unitPx = 30) {
      // Subtle coordinate grid aligned with (ox, oy)
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
      ctx.lineWidth = 1;
      for (let x = ox % unitPx; x < canvas.width; x += unitPx) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
      }
      for (let y = oy % unitPx; y < canvas.height; y += unitPx) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
      }

      // Main X and Y axes
      drawVectorArrow({ x: 30, y: oy }, { x: canvas.width - 30, y: oy }, 'rgba(148, 163, 184, 0.45)', 1.8);
      drawVectorArrow({ x: ox, y: canvas.height - 25 }, { x: ox, y: 25 }, 'rgba(148, 163, 184, 0.45)', 1.8);

      if (state.uiLayers.showLabels) {
        ctx.fillStyle = '#94a3b8';
        ctx.font = 'bold 12px sans-serif';
        ctx.textAlign = 'right';
        ctx.fillText('Ось X', canvas.width - 35, oy - 10);
        ctx.textAlign = 'left';
        ctx.fillText('Ось Y', ox + 10, 35);
        ctx.fillText('O(0;0)', ox - 42, oy + 16);
      }
    }

    function renderVectors2DScene() {
      const v2 = state.vectors2d;
      const unit = 30; // 30 px = 1 unit
      const ox = Math.round((canvas.width / 2 - 20) / unit) * unit;
      const oy = Math.round((canvas.height / 2 + 15) / unit) * unit;

      drawCoordinateAxes2D(ox, oy, unit);

      // Math coordinates of vecA and vecB (where +Y is up!)
      const ax = +(v2.vecA.x / unit).toFixed(1);
      const ay = +(-v2.vecA.y / unit).toFixed(1);
      const bx = +(v2.vecB.x / unit).toFixed(1);
      const by = +(-v2.vecB.y / unit).toFixed(1);
      const lenA = Math.hypot(ax, ay);
      const lenB = Math.hypot(bx, by);

      if (v2.subMode === 'basics') {
        // Snap baseA to half-units so coordinates x1, y1, x2, y2 are clean numbers!
        const x1 = +(v2.baseA.x / unit).toFixed(1);
        const y1 = +(-v2.baseA.y / unit).toFixed(1);
        const x2 = +(x1 + ax).toFixed(1);
        const y2 = +(y1 + ay).toFixed(1);

        const A = { x: ox + x1 * unit, y: oy - y1 * unit };
        const B = { x: ox + x2 * unit, y: oy - y2 * unit };
        const corner = { x: B.x, y: A.y };

        // Right triangle of components ax = x2 - x1 and ay = y2 - y1
        drawLine(A, corner, '#38bdf8', 2.4, true);
        drawLine(corner, B, '#34d399', 2.4, true);
        if (Math.abs(v2.vecA.x) > 20 && Math.abs(v2.vecA.y) > 20) {
          drawRightAngleSquare(corner, A, B, 12, '#fbbf24');
        }
        drawSegmentLabel(A, corner, `ax = x₂ − x₁ = ${x2} − (${x1}) = ${ax}`, '#7dd3fc', 18);
        drawSegmentLabel(corner, B, `ay = y₂ − y₁ = ${y2} − (${y1}) = ${ay}`, '#6ee7b7', 18);

        // Main vector AB
        drawVectorArrow(A, B, '#f43f5e', 4.2, `AB = {${ax}; ${ay}}, |AB| = √(${ax}²+${ay}²) ≈ ${lenA.toFixed(2)}`, false, -20);

        // Equal free vector a' starting from Origin O(0,0)
        const O = { x: ox, y: oy };
        const B_orig = { x: ox + v2.vecA.x, y: oy + v2.vecA.y };
        drawVectorArrow(O, B_orig, 'rgba(244, 63, 94, 0.5)', 3, `Равный a' = {${ax}; ${ay}} от O(0;0)`, true, -16);

        // Basis unit vectors i and j at Origin
        drawVectorArrow(O, { x: ox + unit, y: oy }, '#38bdf8', 3);
        drawVectorArrow(O, { x: ox, y: oy - unit }, '#34d399', 3);

        drawDraggableHandle({ x: A.x, y: A.y, label: `A(${x1}; ${y1}) — начало`, color: '#fbbf24' });
        drawDraggableHandle({ x: B.x, y: B.y, label: `B(${x2}; ${y2}) — конец`, color: '#f43f5e' });

        // Live Step-by-Step Calculation Box at bottom-left of Canvas
        if (state.uiLayers.showLabels) {
          const boxY = canvas.height - 122;
          ctx.fillStyle = 'rgba(17, 24, 39, 0.92)';
          ctx.strokeStyle = '#38bdf8';
          ctx.lineWidth = 1.6;
          ctx.beginPath();
          ctx.roundRect(16, boxY, 445, 76, 10);
          ctx.fill();
          ctx.stroke();

          ctx.textAlign = 'left';
          ctx.font = 'bold 12px monospace';
          ctx.fillStyle = '#fde68a';
          ctx.fillText(`1) Координаты AB (Конец B минус Начало A):`, 26, boxY + 20);
          ctx.fillStyle = '#7dd3fc';
          ctx.fillText(`   AB = { x₂−x₁ ; y₂−y₁ } = { ${x2}−(${x1}) ; ${y2}−(${y1}) } = { ${ax} ; ${ay} }`, 26, boxY + 40);
          ctx.fillStyle = '#6ee7b7';
          ctx.fillText(`2) Длина |AB| = √((x₂−x₁)²+(y₂−y₁)²) = √(${ax}²+${ay}²) = √${(ax*ax+ay*ay).toFixed(1)} ≈ ${lenA.toFixed(2)}`, 26, boxY + 60);
        }

        updateMetrics({
          'Начало A и Конец B': `A(${x1}; ${y1}), B(${x2}; ${y2})`,
          'Координаты {x₂−x₁; y₂−y₁}': `{ ${ax} ; ${ay} }`,
          'Сумма квадратов ax²+ay²': `${(ax*ax).toFixed(1)} + ${(ay*ay).toFixed(1)} = ${(ax*ax + ay*ay).toFixed(1)}`,
          'Длина |AB| = √(ax²+ay²)': `√${(ax*ax + ay*ay).toFixed(1)} ≈ ${lenA.toFixed(2)} ✨`
        }, 'Координаты и Длина Вектора');
      } else if (v2.subMode === 'addition') {
        const O = { x: ox - 70, y: oy + 40 };
        const tipA = { x: O.x + v2.vecA.x, y: O.y + v2.vecA.y };
        const tipB_fromO = { x: O.x + v2.vecB.x, y: O.y + v2.vecB.y };
        const tipSum = { x: O.x + v2.vecA.x + v2.vecB.x, y: O.y + v2.vecA.y + v2.vecB.y };

        // Parallelogram dashed completion
        if (v2.addRule === 'parallelogram' || v2.addRule === 'both') {
          ctx.beginPath();
          ctx.moveTo(O.x, O.y);
          ctx.lineTo(tipA.x, tipA.y);
          ctx.lineTo(tipSum.x, tipSum.y);
          ctx.lineTo(tipB_fromO.x, tipB_fromO.y);
          ctx.closePath();
          ctx.fillStyle = 'rgba(52, 211, 153, 0.1)';
          ctx.fill();
          drawLine(tipA, tipSum, 'rgba(56, 189, 248, 0.45)', 2, true);
          drawLine(tipB_fromO, tipSum, 'rgba(244, 63, 94, 0.45)', 2, true);
        }

        // Animated translated copy of vector b sliding from O to tipA according to shiftStep!
        const t = v2.addRule === 'parallelogram' ? 0 : (v2.addRule === 'triangle' ? 1 : v2.shiftStep);
        const bStart = { x: O.x + v2.vecA.x * t, y: O.y + v2.vecA.y * t };
        const bEnd = { x: bStart.x + v2.vecB.x, y: bStart.y + v2.vecB.y };

        // Vector a from O
        drawVectorArrow(O, tipA, '#f43f5e', 4, `a = {${ax}; ${ay}}`, false, -16);

        // Vector b at O (for parallelogram or reference)
        if (t > 0.05) {
          drawVectorArrow(O, tipB_fromO, 'rgba(56, 189, 248, 0.4)', 2.5, 'b (от точки O)', true, 16);
        }
        // Translated vector b
        drawVectorArrow(bStart, bEnd, '#38bdf8', 4, `b = {${bx}; ${by}}`, false, -16);

        // Resultant Sum Vector c = a + b (Emerald)
        const sx = +(ax + bx).toFixed(1), sy = +(ay + by).toFixed(1);
        const lenSum = Math.hypot(sx, sy);
        drawVectorArrow(O, tipSum, '#34d399', 4.5, `Сумма a + b = {${sx}; ${sy}}`, false, 18);

        drawPointMarker(O, '#fff', 'Общее начало O', 14);
        drawDraggableHandle({ x: tipA.x, y: tipA.y, label: 'a (тяни!)', color: '#f43f5e' });
        drawDraggableHandle({ x: tipB_fromO.x, y: tipB_fromO.y, label: 'b (тяни!)', color: '#38bdf8' });
        drawPointMarker(tipSum, '#34d399', 'Конец суммы a + b', -14);

        updateMetrics({
          'Вектор a': `{ ${ax} ; ${ay} } (|a|=${lenA.toFixed(1)})`,
          'Вектор b': `{ ${bx} ; ${by} } (|b|=${lenB.toFixed(1)})`,
          'Сумма a + b': `{ ${sx} ; ${sy} } ✨`,
          'Длина суммы |a+b|': `${lenSum.toFixed(2)} (≤ ${(lenA+lenB).toFixed(1)})`
        }, 'Сложение Векторов');
      } else if (v2.subMode === 'sub_scalar') {
        // Left side: Subtraction a - b (connecting tips, pointing to a!)
        const O1 = { x: ox - 160, y: oy + 30 };
        const tipA = { x: O1.x + v2.vecA.x, y: O1.y + v2.vecA.y };
        const tipB = { x: O1.x + v2.vecB.x, y: O1.y + v2.vecB.y };

        drawVectorArrow(O1, tipA, '#f43f5e', 3.8, `a = {${ax}; ${ay}}`, false, -16);
        drawVectorArrow(O1, tipB, '#38bdf8', 3.8, `b = {${bx}; ${by}}`, false, 16);
        // Difference vector a - b goes from tipB to tipA!
        const dxSub = +(ax - bx).toFixed(1), dySub = +(ay - by).toFixed(1);
        drawVectorArrow(tipB, tipA, '#fbbf24', 4.2, `Разность a − b = {${dxSub}; ${dySub}} (стрелка к a!)`, false, -18);

        drawPointMarker(O1, '#fff', 'O', 14);
        drawDraggableHandle({ x: tipA.x, y: tipA.y, label: 'a (тяни!)', color: '#f43f5e' });
        drawDraggableHandle({ x: tipB.x, y: tipB.y, label: 'b (тяни!)', color: '#38bdf8' });

        // Right side: Scalar multiplication k * a
        const O2 = { x: ox + 170, y: oy + 20 };
        const k = v2.scalarK;
        const tipKA = { x: O2.x + v2.vecA.x * k, y: O2.y + v2.vecA.y * k };
        drawVectorArrow(O2, { x: O2.x + v2.vecA.x, y: O2.y + v2.vecA.y }, 'rgba(244, 63, 94, 0.4)', 2.5, 'Исходный a', true, -14);
        drawVectorArrow(O2, tipKA, '#c084fc', 4.2, `${k.toFixed(1)}·a = {${(ax*k).toFixed(1)}; ${(ay*k).toFixed(1)}}`, false, 18);
        drawPointMarker(O2, '#fff', `Умножение на k = ${k.toFixed(1)}`, 16);

        updateMetrics({
          'Разность a − b': `{ ${dxSub} ; ${dySub} }`,
          'Куда смотрит a − b': 'К уменьшаемому вектору a!',
          'Вектор k·a': `{ ${(ax*k).toFixed(1)} ; ${(ay*k).toFixed(1)} }`,
          'Направление k·a': k > 0 ? 'Сонаправлен (↑↑)' : (k < 0 ? 'Противоположен (↑↓)' : 'Нулевой вектор 0')
        }, 'Вычитание и Умножение на k');
      } else if (v2.subMode === 'dot_product') {
        const O = { x: ox, y: oy };
        const tipA = { x: O.x + v2.vecA.x, y: O.y + v2.vecA.y };
        const tipB = { x: O.x + v2.vecB.x, y: O.y + v2.vecB.y };

        // Dot product in math units
        const dotVal = ax * bx + ay * by;
        const cosPhi = (lenA > 0.01 && lenB > 0.01) ? Math.max(-1, Math.min(1, dotVal / (lenA * lenB))) : 0;
        const phiDeg = Math.acos(cosPhi) * 180 / Math.PI;

        // Projection of tipB onto line OA
        const footB = projectPointOnLine(tipB, O, tipA);
        drawLine(O, footB, 'rgba(251, 191, 36, 0.6)', 5);
        drawLine(tipB, footB, '#fbbf24', 2, true);
        drawRightAngleSquare(footB, tipB, tipA, 12, '#fbbf24');
        drawSegmentLabel(O, footB, `Проекция |b|cos φ = ${(lenB * cosPhi).toFixed(2)}`, '#fde68a', 18);

        // Angle arc between a and b
        const isPerp = Math.abs(phiDeg - 90) < 2.0;
        const arcCol = isPerp ? '#fbbf24' : (dotVal > 0 ? '#34d399' : '#f43f5e');
        if (isPerp) {
          drawRightAngleSquare(O, tipA, tipB, 22, '#fbbf24');
        } else {
          drawAngleArc(O, tipA, tipB, 48, arcCol, `φ = ${phiDeg.toFixed(1)}°`);
        }

        drawVectorArrow(O, tipA, '#f43f5e', 4, `a = {${ax}; ${ay}} (|a|=${lenA.toFixed(1)})`, false, -18);
        drawVectorArrow(O, tipB, '#38bdf8', 4, `b = {${bx}; ${by}} (|b|=${lenB.toFixed(1)})`, false, 18);

        drawPointMarker(O, '#fff', 'O(0;0)', -14);
        drawDraggableHandle({ x: tipA.x, y: tipA.y, label: 'a (тяни!)', color: '#f43f5e' });
        drawDraggableHandle({ x: tipB.x, y: tipB.y, label: 'b (тяни!)', color: '#38bdf8' });

        updateMetrics({
          'Угол φ между a и b': `${phiDeg.toFixed(1)}° (cos φ = ${cosPhi.toFixed(3)})`,
          'Через координаты ax·bx+ay·by': `${(ax*bx).toFixed(1)} + ${(ay*by).toFixed(1)} = ${dotVal.toFixed(2)}`,
          'Через длины |a||b|cos φ': `${dotVal.toFixed(2)} ✨`,
          'Вердикт по углу': isPerp ? 'a ⊥ b (Перпендикулярны, 90°!)' : (dotVal > 0 ? 'Острый угол (a·b > 0)' : 'Тупой угол (a·b < 0)')
        }, 'Скалярное Произведение a · b');
      } else {
        // 5. Vectors in Geometry: Midpoint/Median vector OM = 1/2 (OA + OB) & Centroid G = 1/3(OA + OB + OC)
        const O = { x: ox - 140, y: oy + 110 };
        const A = { x: O.x + v2.vecA.x * 1.4, y: O.y + v2.vecA.y * 1.4 };
        const B = { x: O.x + v2.vecB.x * 1.6 + 110, y: O.y + v2.vecB.y * 0.4 - 20 };
        const t = v2.divRatioT;
        const P = { x: A.x * (1 - t) + B.x * t, y: A.y * (1 - t) + B.y * t };
        const G = { x: (O.x + A.x + B.x) / 3, y: (O.y + A.y + B.y) / 3 };

        // Triangle OAB
        ctx.beginPath();
        ctx.moveTo(O.x, O.y); ctx.lineTo(A.x, A.y); ctx.lineTo(B.x, B.y);
        ctx.closePath();
        ctx.fillStyle = 'rgba(56, 189, 248, 0.1)';
        ctx.fill();
        drawLine(A, B, '#fbbf24', 3);

        drawVectorArrow(O, A, '#f43f5e', 3.8, 'Вектор OA', false, -16);
        drawVectorArrow(O, B, '#38bdf8', 3.8, 'Вектор OB', false, 16);
        drawVectorArrow(O, P, '#34d399', 4.2, Math.abs(t - 0.5) < 0.03 ? 'Медиана OM = ½(OA + OB)' : `OP = ${(1-t).toFixed(2)}·OA + ${t.toFixed(2)}·OB`, false, -16);

        if (Math.abs(t - 0.5) < 0.03) {
          drawTickMarks(A, P, 1, '#34d399');
          drawTickMarks(P, B, 1, '#34d399');
        }

        drawPointMarker(O, '#fff', 'Вершина O', 14);
        drawPointMarker(P, '#34d399', Math.abs(t - 0.5) < 0.03 ? 'M (Середина AB)' : 'P', -14);
        drawPointMarker(G, '#fbbf24', 'G (Центроид: GA+GB+GO = 0)', 14);
        drawDraggableHandle({ x: A.x, y: A.y, label: 'A (тяни!)', color: '#f43f5e' });
        drawDraggableHandle({ x: B.x, y: B.y, label: 'B (тяни!)', color: '#38bdf8' });

        updateMetrics({
          'Вектор медианы OM': '½ (OA + OB)',
          'Текущая точка P': `${(1-t).toFixed(2)}·OA + ${t.toFixed(2)}·OB`,
          'Свойство центроида G': 'GO + GA + GB = 0 ✨',
          'Отношение AP : PB': `${Math.round(t*100)} : ${Math.round((1-t)*100)}`
        }, 'Векторы в Геометрии');
      }
    }

    function renderInscribedCentral2DScene() {
      const cc = state.circleChord;
      const ins2 = state.inscribed2d;
      const O = { x: canvas.width / 2 - 20, y: canvas.height / 2 + 15 };
      const R = 165;

      const { angleA, angleB, angleP } = cc;
      const A = { x: O.x + R * Math.cos(angleA), y: O.y + R * Math.sin(angleA) };
      const B = { x: O.x + R * Math.cos(angleB), y: O.y + R * Math.sin(angleB) };
      const P = { x: O.x + R * Math.cos(angleP), y: O.y + R * Math.sin(angleP) };

      // Main Circle
      ctx.beginPath();
      ctx.arc(O.x, O.y, R, 0, 2 * Math.PI);
      ctx.fillStyle = 'rgba(56, 189, 248, 0.04)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
      ctx.lineWidth = 2.8;
      ctx.stroke();

      // Highlighted Arc AB
      let diff = angleB - angleA;
      while (diff < -Math.PI) diff += 2 * Math.PI;
      while (diff > Math.PI) diff -= 2 * Math.PI;
      ctx.beginPath();
      ctx.arc(O.x, O.y, R, angleA, angleA + diff, diff < 0);
      ctx.strokeStyle = '#fbbf24';
      ctx.lineWidth = 5;
      ctx.stroke();

      const midArc = angleA + diff / 2;
      ctx.fillStyle = '#fbbf24';
      ctx.font = 'bold 13px sans-serif';
      ctx.textAlign = 'center';
      const centralDeg = Math.abs(diff) * 180 / Math.PI;
      ctx.fillText(`Дуга ◡AB = ${centralDeg.toFixed(1)}°`, O.x + (R + 26) * Math.cos(midArc), O.y + (R + 26) * Math.sin(midArc));

      // Central angle sector AOB (Blue)
      drawAngleArc(O, A, B, 48, '#38bdf8', `∠AOB = ${centralDeg.toFixed(1)}°`);

      // Inscribed angle sector APB (Rose)
      const inscribedDeg = getTriangleAngles(P, A, B).angA;
      drawAngleArc(P, A, B, 44, '#f43f5e', `∠APB = ${inscribedDeg.toFixed(1)}°`);

      // Optional Fan of equal inscribed angles
      if (ins2.showFan) {
        for (let offset of [-0.95, 0.95]) {
          const angP2 = angleP + offset;
          const P2 = { x: O.x + R * Math.cos(angP2), y: O.y + R * Math.sin(angP2) };
          drawLine(P2, A, 'rgba(52, 211, 153, 0.5)', 1.8, true);
          drawLine(P2, B, 'rgba(52, 211, 153, 0.5)', 1.8, true);
          const deg2 = getTriangleAngles(P2, A, B).angA;
          drawPointMarker(P2, '#34d399', `P' (${deg2.toFixed(1)}°)`, -12);
        }
      }

      // Radii OA and OB
      drawLine(O, A, '#38bdf8', 3);
      drawLine(O, B, '#38bdf8', 3);
      // Chords PA, PB and AB
      drawLine(P, A, '#f43f5e', 3);
      drawLine(P, B, '#f43f5e', 3);
      drawLine(A, B, '#fbbf24', 2.8, true);

      // Proof via Radius OP = R (Isosceles triangles AOP and BOP)
      if (ins2.showProofOP) {
        const D_opp = { x: O.x - R * Math.cos(angleP), y: O.y - R * Math.sin(angleP) };
        drawLine(P, D_opp, '#34d399', 2.5, true);
        drawTickMarks(O, A, 1, '#34d399');
        drawTickMarks(O, B, 1, '#34d399');
        drawTickMarks(O, P, 1, '#34d399');
        drawSegmentLabel(O, P, `Радиус OP = R`, '#6ee7b7', 14);
        drawPointMarker(D_opp, '#34d399', 'D (диаметр PD)', 12);
      }

      if (Math.abs(inscribedDeg - 90) < 1.5) {
        drawRightAngleSquare(P, A, B, 16, '#34d399');
      }

      drawSegmentLabel(O, A, `Радиус OA = R`, '#7dd3fc', -15);
      drawSegmentLabel(O, B, `Радиус OB = R`, '#7dd3fc', 15);
      drawSegmentLabel(P, A, `Хорда PA = ${Math.round(dist(P, A))}`, '#fda4af', -16);
      drawSegmentLabel(P, B, `Хорда PB = ${Math.round(dist(P, B))}`, '#fda4af', 16);
      drawSegmentLabel(A, B, `Хорда AB = ${Math.round(dist(A, B))}`, '#fde68a', -16);

      drawPointMarker(O, '#fff', 'Центр O', -14);
      drawDraggableHandle({ ...A, label: 'A (тяни!)', color: '#fbbf24' });
      drawDraggableHandle({ ...B, label: 'B (тяни!)', color: '#fbbf24' });
      drawDraggableHandle({ ...P, label: 'P (вершина)', color: '#f43f5e' });

      // Top-left Visual Summary Box
      ctx.fillStyle = 'rgba(17, 24, 39, 0.92)';
      ctx.strokeStyle = '#f43f5e';
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.roundRect(16, 16, 395, 112, 12);
      ctx.fill();
      ctx.stroke();

      ctx.textAlign = 'left';
      ctx.font = 'bold 13px sans-serif';
      ctx.fillStyle = '#fda4af';
      ctx.fillText('🎯 ТЕОРЕМА О ВПИСАННОМ И ЦЕНТРАЛЬНОМ УГЛЕ', 28, 36);
      ctx.font = '12px sans-serif';
      ctx.fillStyle = '#7dd3fc';
      ctx.fillText(`• Центральный угол ∠AOB (из центра O) = ${centralDeg.toFixed(1)}°`, 28, 58);
      ctx.fillStyle = '#fda4af';
      ctx.fillText(`• Вписанный угол ∠APB (с окружности) = ${inscribedDeg.toFixed(1)}°`, 28, 78);
      ctx.fillStyle = '#6ee7b7';
      ctx.fillText(`• Доказательство: △AOP и △BOP равнобедренные (OA = OP = OB = R)!`, 28, 100);

      updateMetrics({
        'Центральный ∠AOB': `${centralDeg.toFixed(1)}°`,
        'Вписанный ∠APB': `${inscribedDeg.toFixed(1)}°`,
        'Отношение ∠AOB / ∠APB': '2 : 1 (всегда!) ✨',
        'Хорда AB': `${Math.round(dist(A, B))} px`
      }, 'Вписанный и Центральный угол');
    }

    // ------------------------------------------
    // 1. ANGLES & PARALLEL LINES SCENE
    // ------------------------------------------
    function renderAnglesParallelScene() {
      const ap = state.anglesParallel;
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      const rad = (ap.angleDeg * Math.PI) / 180;
      const suppDeg = 180 - ap.angleDeg;

      if (ap.subMode === 'adjacent_vertical') {
        const L = 240;
        const pLeft = { x: cx - L, y: cy };
        const pRight = { x: cx + L, y: cy };
        const pTop = { x: cx + L * Math.cos(rad), y: cy - L * Math.sin(rad) };
        const pBot = { x: cx - L * Math.cos(rad), y: cy + L * Math.sin(rad) };
        const O = { x: cx, y: cy };

        drawAngleArc(O, pRight, pTop, 65, '#f43f5e', `α₁ = ${ap.angleDeg}°`);
        drawAngleArc(O, pLeft, pBot, 65, '#f43f5e', `α₂ = ${ap.angleDeg}°`);
        drawAngleArc(O, pTop, pLeft, 52, '#38bdf8', `β₁ = ${suppDeg}°`);
        drawAngleArc(O, pBot, pRight, 52, '#38bdf8', `β₂ = ${suppDeg}°`);

        drawLine(pLeft, pRight, '#fff', 3);
        drawLine(pBot, pTop, '#fbbf24', 3);
        drawPointMarker(O, '#fff', 'Вершина O');

        ctx.fillStyle = '#f8fafc';
        ctx.font = 'bold 14px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(`Смежные углы (соседи на прямой): α + β = ${ap.angleDeg}° + ${suppDeg}° = 180°`, cx, cy - 220);
        ctx.fillStyle = '#fda4af';
        ctx.fillText(`Вертикальные углы (напротив друг друга): α₁ = α₂ = ${ap.angleDeg}°  и  β₁ = β₂ = ${suppDeg}°`, cx, cy + 230);

        updateMetrics({
          'Угол α₁ = α₂': `${ap.angleDeg}° (вертикальные)`,
          'Угол β₁ = β₂': `${suppDeg}° (вертикальные)`,
          'Сумма смежных α+β': '180° (развернутый)',
          'Сумма всех 4 углов': '360° (полный круг)'
        }, 'Смежные и Вертикальные');
      } else {
        const yA = cy - 95;
        const yB = cy + 95;
        const tiltRad = (ap.brokenParallel * Math.PI) / 180;
        const dx = 95 / Math.tan(rad);
        const IA = { x: cx + dx, y: yA };
        const IB = { x: cx - dx, y: yB };

        const aL = { x: cx - 290, y: yA };
        const aR = { x: cx + 290, y: yA };
        const bL = { x: IB.x - 290 * Math.cos(tiltRad), y: IB.y + 290 * Math.sin(tiltRad) };
        const bR = { x: IB.x + 290 * Math.cos(tiltRad), y: IB.y - 290 * Math.sin(tiltRad) };
        const cTop = { x: IA.x + 95 * Math.cos(rad), y: IA.y - 95 * Math.sin(rad) };
        const cBot = { x: IB.x - 95 * Math.cos(rad), y: IB.y + 95 * Math.sin(rad) };

        drawLine(aL, aR, '#94a3b8', 2.5);
        drawLine(bL, bR, ap.brokenParallel === 0 ? '#94a3b8' : '#f43f5e', 2.5);
        drawLine(cBot, cTop, '#e2e8f0', 2.5);

        ctx.fillStyle = '#94a3b8';
        ctx.font = 'bold 14px sans-serif';
        ctx.fillText('Прямая a', aL.x + 35, aL.y - 12);
        ctx.fillText(ap.brokenParallel === 0 ? 'Прямая b (a ∥ b)' : 'Прямая b (НЕ параллельна!)', bL.x + 65, bL.y - 12);
        ctx.fillText('Секущая c', cTop.x + 35, cTop.y + 10);

        const angAtB = ap.angleDeg - ap.brokenParallel;

        if (ap.pairType === 'alternate') {
          drawAngleArc(IA, aL, IB, 45, '#34d399', `${ap.angleDeg}°`);
          drawAngleArc(IB, IA, bR, 45, '#34d399', `${angAtB}°`);

          ctx.strokeStyle = '#34d399';
          ctx.lineWidth = 5;
          ctx.beginPath();
          ctx.moveTo(IA.x - 110, IA.y);
          ctx.lineTo(IA.x, IA.y);
          ctx.lineTo(IB.x, IB.y);
          ctx.lineTo(IB.x + 110 * Math.cos(tiltRad), IB.y - 110 * Math.sin(tiltRad));
          ctx.stroke();

          ctx.fillStyle = '#34d399';
          ctx.font = 'bold 15px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('Правило буквы «Z»: Накрест лежащие углы ' + (ap.brokenParallel === 0 ? 'РАВНЫ!' : 'НЕ равны (прямые не параллельны!)'), cx, cy - 190);
        } else if (ap.pairType === 'corresponding') {
          drawAngleArc(IA, aR, cTop, 45, '#38bdf8', `${ap.angleDeg}°`);
          drawAngleArc(IB, bR, IA, 45, '#38bdf8', `${angAtB}°`);

          ctx.strokeStyle = '#38bdf8';
          ctx.lineWidth = 5;
          ctx.beginPath();
          ctx.moveTo(cTop.x, cTop.y);
          ctx.lineTo(cBot.x, cBot.y);
          ctx.moveTo(IA.x, IA.y);
          ctx.lineTo(IA.x + 120, IA.y);
          ctx.moveTo(IB.x, IB.y);
          ctx.lineTo(IB.x + 120 * Math.cos(tiltRad), IB.y - 120 * Math.sin(tiltRad));
          ctx.stroke();

          ctx.fillStyle = '#38bdf8';
          ctx.font = 'bold 15px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('Правило буквы «F»: Соответственные углы смотрят в одну сторону и ' + (ap.brokenParallel === 0 ? 'РАВНЫ!' : 'НЕ равны!'), cx, cy - 190);
        } else {
          drawAngleArc(IA, IB, aR, 45, '#fbbf24', `${suppDeg}°`);
          drawAngleArc(IB, bR, IA, 45, '#f43f5e', `${angAtB}°`);

          ctx.strokeStyle = '#fbbf24';
          ctx.lineWidth = 5;
          ctx.beginPath();
          ctx.moveTo(IA.x + 110, IA.y);
          ctx.lineTo(IA.x, IA.y);
          ctx.lineTo(IB.x, IB.y);
          ctx.lineTo(IB.x + 110 * Math.cos(tiltRad), IB.y - 110 * Math.sin(tiltRad));
          ctx.stroke();

          ctx.fillStyle = '#fbbf24';
          ctx.font = 'bold 15px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(`Правило буквы «C»: Сумма односторонних углов = ${suppDeg}° + ${angAtB}° = ${suppDeg + angAtB}° ` + (ap.brokenParallel === 0 ? '(ровно 180°!)' : '(не 180°!)'), cx, cy - 190);
        }

        updateMetrics({
          'Статус прямых': ap.brokenParallel === 0 ? 'a ∥ b (Параллельны) ✅' : 'Пересекаются ❌',
          'Острый угол α': `${ap.angleDeg}°`,
          'Тупой угол β': `${suppDeg}°`,
          'Односторонние α+β': `${suppDeg + angAtB}°`
        }, 'Параллельные прямые');
      }
    }

    // ------------------------------------------
    // 2. TRIANGLES, 4 CENTERS & EULER LINE SCENE
    // ------------------------------------------
    function renderTrianglesLinesScene() {
      const { A, B, C } = state.triangle;
      const tf = state.triFeatures;
      const { a, b, c, angA, angB, angC } = getTriangleAngles(A, B, C);

      const M = { x: (A.x + B.x + C.x) / 3, y: (A.y + B.y + C.y) / 3 };
      const O = getCircumcenter(A, B, C);
      const H = getOrthocenter(A, B, C);
      const I = getIncenter(A, B, C);

      const midAB = { x: (A.x + B.x) / 2, y: (A.y + B.y) / 2 };
      const midBC = { x: (B.x + C.x) / 2, y: (B.y + C.y) / 2 };
      const midAC = { x: (A.x + C.x) / 2, y: (A.y + C.y) / 2 };

      // 1. Parallel line through C proving Angle Sum = 180°
      if (tf.angleSumParallel) {
        const dx = B.x - A.x, dy = B.y - A.y;
        const len = Math.hypot(dx, dy) || 1;
        const ux = dx / len, uy = dy / len;
        const pLeft = { x: C.x - ux * 180, y: C.y - uy * 180 };
        const pRight = { x: C.x + ux * 180, y: C.y + uy * 180 };

        drawLine(pLeft, pRight, '#fbbf24', 2, true);
        drawAngleArc(C, pLeft, A, 34, '#f43f5e', `α`);
        drawAngleArc(C, B, pRight, 34, '#38bdf8', `β`);
      }

      // 2. Perpendicular bisectors & Circumcenter O
      if (tf.perpBisectors) {
        const R = dist(O, A);
        ctx.beginPath();
        ctx.arc(O.x, O.y, R, 0, 2 * Math.PI);
        ctx.strokeStyle = 'rgba(52, 211, 153, 0.32)';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Draw perpendicular bisectors from midAB, midBC, midAC to O
        drawLine(midAB, O, 'rgba(52, 211, 153, 0.7)', 2, true);
        drawLine(midBC, O, 'rgba(52, 211, 153, 0.7)', 2, true);
        drawLine(midAC, O, 'rgba(52, 211, 153, 0.7)', 2, true);
        drawRightAngleSquare(midAB, O, B, 11, '#34d399');
        drawRightAngleSquare(midBC, O, C, 11, '#34d399');
        drawRightAngleSquare(midAC, O, A, 11, '#34d399');
      }

      // 3. Medians & Centroid M
      if (tf.medians) {
        drawLine(A, midBC, 'rgba(251, 191, 36, 0.65)', 2);
        drawLine(B, midAC, 'rgba(251, 191, 36, 0.65)', 2);
        drawLine(C, midAB, 'rgba(251, 191, 36, 0.65)', 2);
        drawTickMarks(A, midAB, 1, '#fbbf24');
