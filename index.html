          const slider = document.getElementById('dido-slider');
          if (slider) slider.value = state.dido.morphProgress;
          const valSpan = document.getElementById('dido-progress-val');
          if (valSpan) valSpan.innerText = Math.round(state.dido.morphProgress * 100) + '%';
        } else if (state.draggedPoint.type === 'circle') {
          const cx = canvas.width / 2 - 20, cy = canvas.height / 2 + 10;
          const ang = Math.atan2(pos.y - cy, pos.x - cx);
          if (state.draggedPoint.id === 'P') state.circleChord.angleP = ang;
          else if (state.draggedPoint.id === 'A') state.circleChord.angleA = ang;
          else if (state.draggedPoint.id === 'B') state.circleChord.angleB = ang;
        } else {
          state.draggedPoint.x = Math.max(30, Math.min(canvas.width - 30, pos.x));
          state.draggedPoint.y = Math.max(30, Math.min(canvas.height - 30, pos.y));
        }
        return;
      }

      if (state.camera.drag) {
        const dx = pos.x - state.camera.lastMouseX;
        const dy = pos.y - state.camera.lastMouseY;
        state.camera.rotY += dx * 0.007;
        state.camera.rotX = Math.max(-1.4, Math.min(1.4, state.camera.rotX - dy * 0.007));
        state.camera.lastMouseX = pos.x;
        state.camera.lastMouseY = pos.y;
      }
    }

    // Full Touch & Pinch-to-Zoom Support for Smartphones and Tablets
    let lastPinchDist = 0;
    canvas.addEventListener('touchstart', (e) => {
      if (e.touches.length === 2) {
        e.preventDefault();
        state.camera.drag = false;
        state.draggedPoint = null;
        lastPinchDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        return;
      }
      if (handlePointerDown(getPointerPos(e), 42)) {
        e.preventDefault();
      }
    }, { passive: false });

    canvas.addEventListener('touchmove', (e) => {
      if (e.touches.length === 2) {
        e.preventDefault();
        const curDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        if (lastPinchDist > 10) {
          const factor = curDist / lastPinchDist;
          zoom3D(factor);
        }
        lastPinchDist = curDist;
        return;
      }
      if (state.draggedPoint || state.camera.drag) {
        e.preventDefault();
        handlePointerMove(getPointerPos(e));
      }
    }, { passive: false });

    canvas.addEventListener('touchend', () => {
      lastPinchDist = 0;

      // Clamp H display if it goes near canvas edge so user always sees where Orthocenter H is!

      };

          : 'Сейчас все углы острые (<90°), поэтому ортоцентр H внутри. Потяни вершину, чтобы сделать угол тупым!';

        'Ортоцентр H (высоты)': isObtuse ? 'СНАРУЖИ треугольника 🎉' : 'Внутри треугольника',

    // Generate point on regular N-gon of fixed perimeter P_px at angle theta in [0, 2*pi)
    function getPolygonPointAtAngle(theta, N, P_px) {
      // Side length a = P_px / N
      // Inradius (apothem) r_in = a / (2 * tan(pi / N))
      const dAng = (2 * Math.PI) / N;
      const a = P_px / N;
      const rIn = a / (2 * Math.tan(Math.PI / N));
      // Find which sector theta belongs to (rotated by -pi/2 so top vertex/edge looks upright)
      let rel = theta + Math.PI / 2;
      while (rel < 0) rel += 2 * Math.PI;
      while (rel >= 2 * Math.PI) rel -= 2 * Math.PI;
      const sectorIdx = Math.floor(rel / dAng);
      const localAng = rel - (sectorIdx + 0.5) * dAng; // in [-dAng/2, +dAng/2]
      const rad = rIn / Math.cos(localAng);
      return {
        x: rad * Math.cos(theta),
        y: rad * Math.sin(theta)
      };
    }

    function renderQuestDidoScene() {
      const d = state.dido;

      // Advance smooth auto-animation if active
      if (d.autoAnimate) {
        d.morphProgress += 0.0032 * d.animDir;
        if (d.morphProgress >= 1.0) {
          d.morphProgress = 1.0;
          d.animDir = -1;
        } else if (d.morphProgress <= 0.0) {
          d.morphProgress = 0.0;
          d.animDir = 1;
        }
        const slider = document.getElementById('dido-slider');
        if (slider) slider.value = d.morphProgress;
        const valSpan = document.getElementById('dido-progress-val');
        if (valSpan) valSpan.innerText = Math.round(d.morphProgress * 100) + '%';
      }

      const t = d.morphProgress; // 0 -> N=3, 0.25 -> N=4, 0.5 -> N=5, 0.75 -> N=6, 1.0 -> Circle
      const stages = [
        { n: 3, name: 'Правильный треугольник (3 угла)', area: 481.1, color: '#f43f5e' },
        { n: 4, name: 'Квадрат (4 угла)', area: 625.0, color: '#fbbf24' },
        { n: 5, name: 'Правильный пятиугольник (5 углов)', area: 688.2, color: '#38bdf8' },
        { n: 6, name: 'Правильный шестиугольник (6 углов)', area: 721.7, color: '#818cf8' },
        { n: 48, name: 'Идеальный Круг (Максимум площади!)', area: 795.8, color: '#34d399' }
      ];

      const scaled = t * (stages.length - 1);
      const idx0 = Math.min(stages.length - 2, Math.floor(scaled));
      const idx1 = idx0 + 1;
      const frac = scaled - idx0;
      const st0 = stages[idx0], st1 = stages[idx1];

      const curArea = st0.area * (1 - frac) + st1.area * frac;
      const activeStage = frac < 0.5 ? st0 : st1;

      const cx = canvas.width * 0.34;
      const cy = canvas.height * 0.53;
      const P_px = 960; // Visual perimeter in pixels corresponding to P = 100 m
      const R_circle_px = P_px / (2 * Math.PI); // ~152.8 px

      // Draw dashed reference circle of maximum possible area
      ctx.beginPath();
      if (d.seaShoreMode) {
        // Sea coast at y = cy + 95, semicircle of radius R_semi = R_circle_px * 1.35
        const yCoast = cy + 95;
        // Draw blue sea waves at bottom
        ctx.fillStyle = 'rgba(14, 165, 233, 0.22)';
        ctx.fillRect(40, yCoast, canvas.width * 0.56, 90);
        drawLine({ x: 40, y: yCoast }, { x: 40 + canvas.width * 0.56, y: yCoast }, '#38bdf8', 4);
        if (state.uiLayers.showLabels) {
          ctx.fillStyle = '#7dd3fc';
          ctx.font = 'bold 13px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('🌊 Берег Средиземного моря (верёвка здесь не нужна!)', cx, yCoast + 32);
        }

        const rSemi = R_circle_px * 1.42;
        ctx.beginPath();
        ctx.arc(cx, yCoast, rSemi, Math.PI, 2 * Math.PI);
        ctx.closePath();
        ctx.fillStyle = 'rgba(52, 211, 153, 0.28)';
        ctx.fill();
        ctx.strokeStyle = '#fbbf24';
        ctx.lineWidth = 4;
        ctx.stroke();

        if (state.uiLayers.showLabels) {
          ctx.fillStyle = '#fde68a';
          ctx.font = 'bold 15px sans-serif';
          ctx.fillText('Полукруг Дидоны: L = πR = 100 м', cx, yCoast - rSemi - 16);
          ctx.fillStyle = '#6ee7b7';
          ctx.font = 'bold 17px sans-serif';
          ctx.fillText('Площадь S = L² / (2π) ≈ 1591.5 м² (В 2 РАЗА БОЛЬШЕ!)', cx, yCoast - rSemi / 2);
        }
      } else {
        ctx.arc(cx, cy, R_circle_px, 0, 2 * Math.PI);
        ctx.strokeStyle = 'rgba(52, 211, 153, 0.25)';
        ctx.lineWidth = 2;
        ctx.setLineDash([6, 6]);
        ctx.stroke();
        ctx.setLineDash([]);

        // Morphing closed rope of constant perimeter P = 100 m!
        const numSamples = 180;
        const polyPts = [];
        for (let i = 0; i < numSamples; i++) {
          const theta = (2 * Math.PI * i) / numSamples;
          const p0 = st0.n >= 40
            ? { x: R_circle_px * Math.cos(theta), y: R_circle_px * Math.sin(theta) }
            : getPolygonPointAtAngle(theta, st0.n, P_px);
          const p1 = st1.n >= 40
            ? { x: R_circle_px * Math.cos(theta), y: R_circle_px * Math.sin(theta) }
            : getPolygonPointAtAngle(theta, st1.n, P_px);
          polyPts.push({
            x: cx + p0.x * (1 - frac) + p1.x * frac,
            y: cy + p0.y * (1 - frac) + p1.y * frac
          });
        }

        // Draw internal territory grid inside the morphing rope!
        ctx.save();
        ctx.beginPath();
        polyPts.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
        ctx.closePath();
        ctx.fillStyle = activeStage.color + '33';
        ctx.fill();
        ctx.clip();

        ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
        ctx.lineWidth = 1;
        const gStep = 22;
        for (let gx = cx - 220; gx <= cx + 220; gx += gStep) {
          ctx.beginPath(); ctx.moveTo(gx, cy - 220); ctx.lineTo(gx, cy + 220); ctx.stroke();
        }
        for (let gy = cy - 220; gy <= cy + 220; gy += gStep) {
          ctx.beginPath(); ctx.moveTo(cx - 220, gy); ctx.lineTo(cx + 220, gy); ctx.stroke();
        }
        ctx.restore();

        // Draw the golden rope perimeter
        ctx.beginPath();
        polyPts.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
        ctx.closePath();
        ctx.strokeStyle = activeStage.color;
        ctx.lineWidth = 4;
        ctx.stroke();

        // Highlight vertices if near an integer polygon stage
        if (activeStage.n <= 6 && (frac < 0.15 || frac > 0.85)) {
          const nV = activeStage.n;
          for (let k = 0; k < nV; k++) {
            const vAng = -Math.PI / 2 + (2 * Math.PI * k) / nV;
            const vp = getPolygonPointAtAngle(vAng, nV, P_px);
            ctx.beginPath();
            ctx.arc(cx + vp.x, cy + vp.y, 6, 0, 2 * Math.PI);
            ctx.fillStyle = '#fff';
            ctx.fill();
          }
        }

        if (state.uiLayers.showLabels) {
          ctx.fillStyle = '#fff';
          ctx.font = 'bold 15px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(activeStage.name, cx, cy - R_circle_px - 32);
          ctx.fillStyle = '#fde68a';
          ctx.font = 'bold 14px sans-serif';
          ctx.fillText('Периметр верёвки НЕИЗМЕНЕН: P = 100.0 м', cx, cy - R_circle_px - 12);

          ctx.fillStyle = '#fff';
          ctx.font = 'bold 20px monospace';
          ctx.fillText(`S = ${curArea.toFixed(1)} м²`, cx, cy - 4);
          ctx.fillStyle = '#cbd5e1';
          ctx.font = 'bold 12px sans-serif';
          ctx.fillText(`(${((curArea / 795.8) * 100).toFixed(1)}% от максимума круга)`, cx, cy + 20);
        }
      }

      // RIGHT PANEL ON CANVAS: Live Bar Chart Comparing Areas for P = 100 m
      const rx = canvas.width * 0.62;
      const ry = canvas.height * 0.22;
      const barMaxW = 220;

      ctx.fillStyle = 'rgba(17, 24, 39, 0.9)';
      ctx.strokeStyle = '#334155';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(rx - 18, ry - 28, 315, 310, 14);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#fbbf24';
      ctx.font = 'bold 13.5px sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText('📊 Сравнение площадей при P = 100 м:', rx, ry - 4);

      stages.forEach((st, i) => {
        const by = ry + 22 + i * 52;
        const wBar = (st.area / 795.8) * barMaxW;
        const isCur = !d.seaShoreMode && activeStage.n === st.n;

        ctx.fillStyle = isCur ? '#fff' : '#cbd5e1';
        ctx.font = isCur ? 'bold 12px sans-serif' : '11.5px sans-serif';
        ctx.fillText(st.name, rx, by);

        ctx.fillStyle = 'rgba(255,255,255,0.08)';
        ctx.fillRect(rx, by + 7, barMaxW, 16);

        ctx.fillStyle = st.color;
        ctx.fillRect(rx, by + 7, wBar, 16);
        if (isCur) {
          ctx.strokeStyle = '#fff';
          ctx.lineWidth = 2;
          ctx.strokeRect(rx, by + 7, wBar, 16);
        }

        ctx.fillStyle = '#fff';
        ctx.font = 'bold 11.5px monospace';
        ctx.fillText(`${st.area.toFixed(1)} м²`, rx + wBar + 8, by + 19);
      });

      const statusEl = document.getElementById('quest-dido-status');
      if (statusEl) {
        if (d.seaShoreMode) {
          statusEl.innerText = '🌊 Хитрость Дидоны: полукруг у берега моря даёт 1591.5 м²!';
          statusEl.className = 'quest-status success';
        } else if (t > 0.92) {
          statusEl.innerText = `👑 МАКСИМУМ НАЙДЕН! Круг даёт S = ${curArea.toFixed(1)} м² (100% возможной площади)!`;
          statusEl.className = 'quest-status success';
        } else {
          statusEl.innerText = `${activeStage.name}: S = ${curArea.toFixed(1)} м² (${((curArea / 795.8) * 100).toFixed(1)}% от круга)`;
          statusEl.className = 'quest-status';
        }
      }

      updateMetrics({
        'Длина верёвки P': '100.0 м (постоянна!)',
        'Текущая фигура': d.seaShoreMode ? 'Полукруг у моря 🌊' : activeStage.name,
        'Площадь S': d.seaShoreMode ? '1591.5 м² (×2!)' : `${curArea.toFixed(1)} м²`,
        'Максимум (Круг)': '795.8 м² (P² / 4π) 👑'
      }, 'Задача Царицы Дидоны');
    }

    function renderQuestHeronBridgeScene() {
      const qe = state.questsExtra;
      const cx = canvas.width / 2 - 20;
      const yRiver = canvas.height / 2 + 55;

      // Draw River
      ctx.fillStyle = 'rgba(14, 165, 233, 0.22)';
      ctx.fillRect(30, yRiver, canvas.width - 60, 55);
      drawLine({ x: 30, y: yRiver }, { x: canvas.width - 30, y: yRiver }, '#38bdf8', 4);
      if (state.uiLayers.showLabels) {
        ctx.fillStyle = '#7dd3fc';
        ctx.font = 'bold 13px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('🌊 Прямой берег реки (потяни точку моста M вдоль берега!)', cx, yRiver + 32);
      }

      const A = { x: cx - 180, y: yRiver - 120 };
      const B = { x: cx + 190, y: yRiver - 185 };
      const A_mirror = { x: A.x, y: yRiver + 120 }; // Reflected across yRiver
      const M = { x: cx + qe.heronM_x, y: yRiver };

      // Optimal M is intersection of A_mirror -> B with y = yRiver:
      // t = 120 / (120 + 185) = 120 / 305 => x_opt = A.x + (B.x - A.x) * (120/305) = cx - 180 + 370 * (120/305) ≈ cx - 34.4
      const optX = -180 + 370 * (120 / 305);

      if (qe.showHeronMirror) {
        drawLine(A, A_mirror, 'rgba(251, 191, 36, 0.5)', 2, true);
        drawLine(A_mirror, B, 'rgba(52, 211, 153, 0.55)', 3, true);
        drawLine(A_mirror, M, '#c084fc', 2.5, true);
        drawPointMarker(A_mirror, '#fbbf24', "A' (зеркальное отражение A)", 16);
        drawSegmentLabel(A_mirror, B, 'Прямая A′B — кратчайший путь!', '#6ee7b7', 16);
      }

      const dAM = dist(A, M), dMB = dist(B, M);
      const totalLen = dAM + dMB;
      const minLen = dist(A_mirror, B);
      const isOpt = Math.abs(qe.heronM_x - optX) < 8;

      drawLine(A, M, isOpt ? '#34d399' : '#f43f5e', 4);
      drawLine(M, B, isOpt ? '#34d399' : '#f43f5e', 4);

      // Grazing angles with river bank
      const ang1 = Math.atan2(yRiver - A.y, M.x - A.x) * 180 / Math.PI;
      const ang2 = Math.atan2(yRiver - B.y, B.x - M.x) * 180 / Math.PI;
      drawAngleArc(M, { x: M.x - 60, y: yRiver }, A, 36, '#fbbf24', `∠1=${ang1.toFixed(0)}°`);
      drawAngleArc(M, B, { x: M.x + 60, y: yRiver }, 36, '#38bdf8', `∠2=${ang2.toFixed(0)}°`);

      drawSegmentLabel(A, M, `AM = ${dAM.toFixed(0)}`, '#fda4af', -16);
      drawSegmentLabel(M, B, `MB = ${dMB.toFixed(0)}`, '#fda4af', -16);

      drawPointMarker(A, '#f43f5e', 'Город A', -14);
      drawPointMarker(B, '#38bdf8', 'Город B', -14);
      drawDraggableHandle({ x: M.x, y: M.y, label: 'Мост M (тяни!)', color: isOpt ? '#34d399' : '#fbbf24' });

      const el = document.getElementById('quest-heron-status');
      if (el) {
        el.innerText = `Путь AM + MB = ${totalLen.toFixed(1)} м (мин = ${minLen.toFixed(1)} м) ` + (isOpt ? '🎉 ПОБЕДА! Угол падения равен углу отражения (∠1 = ∠2), путь минимален!' : 'Двигай мост M, чтобы уравнять углы ∠1 и ∠2!');
        el.className = 'quest-status' + (isOpt ? ' success' : '');
      }

      updateMetrics({
        'Угол подхода ∠1': `${ang1.toFixed(1)}°`,
        'Угол отхода ∠2': `${ang2.toFixed(1)}°`,
        'Текущий путь AM+MB': `${totalLen.toFixed(1)} м`,
        'Минимум по прямой A′B': `${minLen.toFixed(1)} м ✨`
      }, 'Квест 6: Мост Герона');
    }

    function renderQuestInscribedQuadScene() {
      const O = { x: canvas.width / 2 - 20, y: canvas.height / 2 + 10 };
      const R = 155;

      // Fixed circle through A, B, C
      ctx.beginPath();
      ctx.arc(O.x, O.y, R, 0, 2 * Math.PI);
      ctx.strokeStyle = 'rgba(56, 189, 248, 0.5)';
      ctx.lineWidth = 2.5;
      ctx.setLineDash([7, 5]);
      ctx.stroke();
      ctx.setLineDash([]);

      const A = { x: O.x + R * Math.cos(2.35), y: O.y + R * Math.sin(2.35) };
      const B = { x: O.x + R * Math.cos(3.85), y: O.y + R * Math.sin(3.85) };
      const C = { x: O.x + R * Math.cos(5.35), y: O.y + R * Math.sin(5.35) };
      const D = state.questsExtra.quadD;

      const angB = getTriangleAngles(B, A, C).angA;
      const angD = getTriangleAngles(D, A, C).angA;
      const sumBD = angB + angD;
      const isInscribed = Math.abs(sumBD - 180) < 2.2 && Math.abs(dist(O, D) - R) < 12;

      ctx.beginPath();
      ctx.moveTo(A.x, A.y); ctx.lineTo(B.x, B.y); ctx.lineTo(C.x, C.y); ctx.lineTo(D.x, D.y);
      ctx.closePath();
      ctx.fillStyle = isInscribed ? 'rgba(52, 211, 153, 0.22)' : 'rgba(244, 63, 94, 0.14)';
      ctx.fill();
      ctx.strokeStyle = isInscribed ? '#34d399' : '#fff';
      ctx.lineWidth = 3;
      ctx.stroke();

      drawAngleArc(B, C, A, 34, '#38bdf8', `∠B=${angB.toFixed(0)}°`);
      drawAngleArc(D, A, C, 34, '#fbbf24', `∠D=${angD.toFixed(0)}°`);

      drawPointMarker(O, '#fff', 'Центр O', 14);
      drawPointMarker(A, '#38bdf8', 'A', 14);
      drawPointMarker(B, '#38bdf8', 'B', -14);
      drawPointMarker(C, '#38bdf8', 'C', -14);
      drawDraggableHandle(D);

      const el = document.getElementById('quest-quad-status');
      if (el) {
        el.innerText = `∠B + ∠D = ${angB.toFixed(1)}° + ${angD.toFixed(1)}° = ${sumBD.toFixed(1)}° ` + (isInscribed ? '🎉 ПОБЕДА! Сумма противоположных углов = 180°, четырёхугольник вписан в окружность!' : 'Подведи точку D к окружности (сумма должна стать 180°)!');
        el.className = 'quest-status' + (isInscribed ? ' success' : '');
      }

      updateMetrics({
        'Угол ∠B': `${angB.toFixed(1)}°`,
        'Угол ∠D': `${angD.toFixed(1)}°`,
        'Сумма ∠B + ∠D': `${sumBD.toFixed(1)}° (цель: 180°)`,
        'Статус 4-угольника': isInscribed ? 'Вписан в окружность! ✨' : 'Не вписан'
      }, 'Квест 7: Вписанный 4-угольник');
    }

    function renderQuestSpiderCubeScene() {
      const qe = state.questsExtra;
      const w = canvas.width, h = canvas.height;
      const s = 0.9;
      const fold = (1 - qe.antUnfold) * (Math.PI / 2); // pi/2 = 3D cube, 0 = top face unfolded flat with front face!

      // Front face of cube: z = +s, x in [-s, s], y in [-s, s]
      const A3 = { x: -s, y: -s, z: s }; // Start point A (bottom-left-front)
      const B3 = { x: s, y: -s, z: s };
      const B1_3 = { x: s, y: s, z: s };
      const A1_3 = { x: -s, y: s, z: s };

      // Top face hinges along top-front edge A1-B1 (y = s, z = s) by angle fold:
      // When fold = pi/2 (3D cube), top face goes back along z from +s to -s at y = +s.
      // When fold = 0 (unfolded flat), top face goes UP along y from +s to +3s at z = +s!
      const D1_3 = { x: -s, y: s + 2 * s * Math.cos(fold), z: s - 2 * s * Math.sin(fold) };
      const C1_3 = { x: s, y: s + 2 * s * Math.cos(fold), z: s - 2 * s * Math.sin(fold) }; // Target point C1!

      // Draw rest of cube wireframe lightly
      const backBotL = project3D({ x: -s, y: -s, z: -s }, w, h);
      const backBotR = project3D({ x: s, y: -s, z: -s }, w, h);
      const backTopL = project3D({ x: -s, y: s, z: -s }, w, h);
      const backTopR = project3D({ x: s, y: s, z: -s }, w, h);
      const pA = project3D(A3, w, h), pB = project3D(B3, w, h), pB1 = project3D(B1_3, w, h), pA1 = project3D(A1_3, w, h);
      const pD1 = project3D(D1_3, w, h), pC1 = project3D(C1_3, w, h);

      drawLine(backBotL, backBotR, 'rgba(255,255,255,0.2)', 1.5, true);
      drawLine(backBotR, backTopR, 'rgba(255,255,255,0.2)', 1.5, true);
      drawLine(backBotL, backTopL, 'rgba(255,255,255,0.2)', 1.5, true);
      drawLine(backTopL, backTopR, 'rgba(255,255,255,0.2)', 1.5, true);
      drawLine(pA, backBotL, 'rgba(255,255,255,0.2)', 1.5, true);
      drawLine(pB, backBotR, 'rgba(255,255,255,0.2)', 1.5, true);

      // Draw Front Face and Hinged Top Face
      drawPlanePatch3D([A3, B3, B1_3, A1_3], '#38bdf8', 0.28, '#38bdf8', w, h);
      drawPlanePatch3D([A1_3, B1_3, C1_3, D1_3], '#818cf8', 0.28, '#818cf8', w, h);

      // Crossing point K on edge A1-B1 at fraction t = qe.antEdgeT
      const t = qe.antEdgeT;
      const K3 = { x: -s + 2 * s * t, y: s, z: s };
      const pK = project3D(K3, w, h);

      // True math distances (for cube of side a = 10):
      // Front segment AK: dx = 10*t, dy = 10 => d1 = 10 * sqrt(t^2 + 1)
      // Top segment KC1: dx = 10*(1-t), dz = 10 => d2 = 10 * sqrt((1-t)^2 + 1)
      const d1 = 10 * Math.hypot(t, 1);
      const d2 = 10 * Math.hypot(1 - t, 1);
      const totalPath = d1 + d2;
      const minPath = 10 * Math.sqrt(5); // ~22.36 at t = 0.5
      const isOpt = Math.abs(t - 0.5) < 0.035;

      drawLine(pA, pK, isOpt ? '#34d399' : '#f43f5e', 4.5);
      drawLine(pK, pC1, isOpt ? '#34d399' : '#f43f5e', 4.5);

      drawSegmentLabel(pA, pK, `AK = ${d1.toFixed(2)}`, '#fda4af', -16);
      drawSegmentLabel(pK, pC1, `KC₁ = ${d2.toFixed(2)}`, '#fda4af', 16);

      drawPointMarker(pA, '#fbbf24', 'Старт муравья A', 14);
      drawPointMarker(pK, isOpt ? '#34d399' : '#f43f5e', `Точка переползания K (t=${t.toFixed(2)})`, -14);
      drawPointMarker(pC1, '#34d399', 'Финиш C₁', -14);

      const el = document.getElementById('quest-ant-status');
      if (el) {
        el.innerText = `Путь = ${totalPath.toFixed(2)} (мин = 10√5 ≈ ${minPath.toFixed(2)}) ` + (isOpt ? '🎉 ПОБЕДА! Ровно через середину ребра (t = 0.5) путь превращается в прямую на развёртке!' : 'Ищи точку K на ребре для кратчайшего пути!');
        el.className = 'quest-status' + (isOpt ? ' success' : '');
      }

      updateMetrics({
        'Сторона куба a': '10.0',
        'Путь по рёбрам (3a)': '30.00 (слишком длинно)',
        'Текущий маршрут AK+KC₁': `${totalPath.toFixed(2)}`,
        'Минимум a√5 (при t=0.5)': `${minPath.toFixed(2)} ✨`
      }, 'Квест 9: Муравей на Кубе');
    }

    function mainLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (state.domain === '2d') {
        render2D();
      } else if (state.domain === '3d') {
        render3D();
      } else {
        drawSubtleGrid();
        if (state.questId === 'quest_orthocenter') {
          renderQuestOrthocenterScene();
        } else if (state.questId === 'quest_thales') {
          state.circleChord.subMode = 'inscribed_right';
          renderCirclesHelperScene();
          const { radius, angleA, angleB, angleP } = state.circleChord;
          const O = { x: canvas.width / 2 - 20, y: canvas.height / 2 + 10 };
          const A = { x: O.x + radius * Math.cos(angleA), y: O.y + radius * Math.sin(angleA) };
          const B = { x: O.x + radius * Math.cos(angleB), y: O.y + radius * Math.sin(angleB) };
          const P = { x: O.x + radius * Math.cos(angleP), y: O.y + radius * Math.sin(angleP) };
          const ins = getTriangleAngles(P, A, B).angA;
          const el = document.getElementById('quest-thales-angle');
          if (el) {
            const ok = Math.abs(ins - 90) < 1.8;
            el.innerText = `${ins.toFixed(1)}° ` + (ok ? '🎉 ПРЯМОЙ УГОЛ (90°)! Хорда AB стала диаметром!' : 'Потяни точку A или B, чтобы хорда AB прошла через центр O!');
            el.className = 'quest-status' + (ok ? ' success' : '');
          }
        } else if (state.questId === 'quest_cube_hex') {
          renderSectionPlane3D();
        } else if (state.questId === 'quest_isoperimetric') {
          renderQuestDidoScene();
        } else if (state.questId === 'quest_euler_collapse') {
          renderQuestEulerCollapseScene();
        } else if (state.questId === 'quest_heron_bridge') {
          renderQuestHeronBridgeScene();
        } else if (state.questId === 'quest_inscribed_quad') {
          renderQuestInscribedQuadScene();
        } else if (state.questId === 'quest_perp_vectors') {
          state.vectors2d.subMode = 'dot_product';
          renderVectors2DScene();
          const unit = 30;
          const ax = +(state.vectors2d.vecA.x / unit).toFixed(1), ay = +(-state.vectors2d.vecA.y / unit).toFixed(1);
          const bx = +(state.vectors2d.vecB.x / unit).toFixed(1), by = +(-state.vectors2d.vecB.y / unit).toFixed(1);
          const dot = ax * bx + ay * by;
          const el = document.getElementById('quest-vec-status');
          if (el) {
            const ok = Math.abs(dot) < 0.15 && Math.hypot(bx, by) > 0.5;
            el.innerText = `a · b = ${dot.toFixed(1)} ` + (ok ? '🎉 ПОБЕДА! Скалярное произведение = 0, угол ровно 90°!' : 'Сделай a · b = 0!');
            el.className = 'quest-status' + (ok ? ' success' : '');
          }
        } else if (state.questId === 'quest_spider_cube') {
          renderQuestSpiderCubeScene();
        } else if (state.questId === 'quest_dimensions') {
          renderDimensionsBridge3DScene();
        } else if (state.questId === 'quest_shadow_3d') {
          state.stereoDistAng.subMode = 'area_proj';
          state.stereoDistAng.inclineDeg = state.questsExtra.shadowTiltDeg;
          renderDistancesAngles3DScene();
          const deg = state.questsExtra.shadowTiltDeg;
          const sProj = 100 * Math.cos(deg * Math.PI / 180);
          const el = document.getElementById('quest-shadow-status');
          if (el) {
            const ok = Math.abs(deg - 60) <= 1;
            el.innerText = `Sпр = ${sProj.toFixed(1)} м² (при φ = ${deg}°) ` + (ok ? '🎉 ПОБЕДА! При φ = 60° (cos 60° = ½) тень ровно вдвое меньше!' : 'Добейся Sпр = 50.0 м²!');
            el.className = 'quest-status' + (ok ? ' success' : '');
          }
        }
      }
      requestAnimationFrame(mainLoop);
    }

    renderLayerBar();
    renderSidebar();
    presetTriangle('acute');
    requestAnimationFrame(mainLoop);
  </script>
</body>
</html>
